name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.repository == 'hzi-bifo/SeqDesk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seqdesk
          POSTGRES_PASSWORD: seqdesk
          POSTGRES_DB: seqdesk_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seqdesk -d seqdesk_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk_e2e?schema=public
      DIRECT_URL: postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk_e2e?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: seqdesk-playwright-ci-secret
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare database
        run: |
          npm run db:migrate:deploy
          npm run db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Setup Miniconda for pipeline readiness
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniconda-version: latest

      - name: Install Nextflow
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://get.nextflow.io | bash
          mv nextflow "$HOME/.local/bin/nextflow"
          chmod +x "$HOME/.local/bin/nextflow"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nextflow" -version

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Run real pipeline Store browser flow
        env:
          SEQDESK_PIPELINE_REGISTRY_URL: http://127.0.0.1:3219/registry
          SEQDESK_PLAYWRIGHT_STORE_FIXTURE_URL: http://127.0.0.1:3219
          SEQDESK_PIPELINE_STORE_E2E_FAULTS: "1"
        run: |
          set -euo pipefail
          STORE_PIPELINES_DIR="$RUNNER_TEMP/playwright-real-store-pipelines"
          mkdir -p "$STORE_PIPELINES_DIR"
          SEQDESK_PIPELINES_DIR="$STORE_PIPELINES_DIR" \
            npx playwright test \
              playwright/tests/pipeline-store-real.admin.spec.ts \
              --project=chromium-admin \
              --no-deps \
              --workers=1 \
              --repeat-each=2 \
              --reporter=list

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5
