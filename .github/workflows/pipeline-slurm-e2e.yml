# Pipeline SLURM E2E
#
# Exercises real SLURM pipeline execution *through the running SeqDesk app* on the
# self-hosted AlmaLinux (Twincore) runner. It boots the built app against a local
# PostgreSQL database, logs in via the API, then drives pipeline runs with
# executionMode='slurm' so the SBATCH wrapper generation (#SBATCH directives) and a
# real allocation on the cluster get coverage. This runner uses the inline mode:
# Nextflow itself runs with its local executor inside one outer SLURM allocation.
#
# REQUIREMENTS: the self-hosted runner MUST provide `sbatch`, `squeue`, `sacct`,
# `scancel`, and `scontrol` on PATH. The runtime/SLURM smoke scripts guard on those
# commands and fail fast if they are missing. Nextflow + Java are provisioned via a
# throwaway Conda env and
# wired into the app through the SEQDESK_CONDA_* settings so the generated run scripts
# can activate the toolchain.

name: Pipeline SLURM E2E

on:
  # The public repository mirrors main into SeqDesk-ci. That private push is the
  # change signal for this self-hosted acceptance gate; there is no time-based run.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_pipeline_id:
        description: "Consuming pipeline id for the runtime (local + SLURM) E2E"
        required: true
        default: "fastq-checksum"
        type: string
      run_mouse_real_data:
        description: "Also run the public pipelines on the REAL ENA mouse-gut dataset (PRJDB6165) and upload their reports for the demo viewer"
        required: false
        default: false
        type: boolean
      run_human_gut_kraken:
        description: "Run kraken2-bracken taxonomic profiling on the REAL human-gut shotgun dataset (PRJEB54724) and push the Kraken/Bracken/Krona output for the demo viewer"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pipeline-slurm-e2e
  # Do not cancel a live outer SLURM allocation. GitHub still retains only the
  # newest pending run when several mirrored pushes arrive while one is active.
  cancel-in-progress: false

jobs:
  slurm_app_e2e:
    name: Pipeline SLURM E2E (Self-hosted Alma)
    # Self-hosted runner lives only on the private CI mirror; never run on the public repo.
    if: ${{ github.repository == 'hzi-bifo/SeqDesk-ci' }}
    runs-on:
      group: bifo_dmz
      labels: [self-hosted, Linux, X64, db-local, twincore, alma]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=8192
      PIPELINE_CONDA_ENV: seqdesk-pipelines-ci-${{ github.run_id }}-slurm
      # Compute nodes do NOT share /home or the runner _work tree with the runner
      # (each node mounts /home from a different NFS server); only a dedicated shared
      # filesystem is visible cluster-wide. These point the SLURM run dir + pipeline
      # conda env at that shared FS. Set as Actions variables on the private CI mirror;
      # empty on the public repo, in which case the job falls back to runner-local
      # paths (fine for the local-mode portion, but SLURM submissions need the shared FS).
      SLURM_SHARED_CONDA_BASE: ${{ vars.SLURM_SHARED_CONDA_BASE }}
      SLURM_SHARED_RUN_ROOT: ${{ vars.SLURM_SHARED_RUN_ROOT }}
      # Full prefix PATH of the pipeline conda env on the shared FS. Names don't resolve
      # across nodes here (conda maps a name to ~/.conda/envs, which is per-node home),
      # and the admin conda's envs/ dir is read-only to the CI user, so the env lives at
      # a runner-writable prefix and is activated by full path.
      SLURM_SHARED_CONDA_ENV: ${{ vars.SLURM_SHARED_CONDA_ENV }}
      # This runner's SLURM account caps concurrent submissions per user (QOS
      # MaxSubmitJobsPerUser=1), so run each pipeline as a SINGLE SLURM job with
      # Nextflow's local executor inside instead of one job per process. Job-level so
      # both the app (boot) and the E2E assertions see it.
      SEQDESK_SLURM_INLINE_EXECUTOR: "1"
      DB_HOST: 127.0.0.1
      DB_PASSWORD: seqdesk
      DB_PORT: 5432
      DB_USER: seqdesk
      FALLBACK_DB_PORT: 55435
      # Short SLURM resource overrides so the smoke jobs are tiny and finish fast.
      # SeqDesk expresses this value in hours (the wrapper writes -t <N>:0:0).
      SEQDESK_RUNTIME_E2E_SLURM_CORES: "1"
      SEQDESK_RUNTIME_E2E_SLURM_MEMORY: "1G"
      SEQDESK_RUNTIME_E2E_SLURM_TIME_LIMIT: "1"
      SEQDESK_SLURM_E2E_CORES: "1"
      SEQDESK_SLURM_E2E_MEMORY: "1G"
      SEQDESK_SLURM_E2E_TIME_LIMIT: "1"
      # Pipeline id the runtime smoke drives through both local and SLURM modes.
      RUNTIME_PIPELINE_ID: ${{ github.event.inputs.runtime_pipeline_id || 'fastq-checksum' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pin the supported SeqDesk Node.js runtime
        run: |
          set -euo pipefail
          NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$NODE_MAJOR" != "24" ]; then
            echo "Expected actions/setup-node to provide Node 24, got $(node --version)." >&2
            exit 1
          fi
          echo "SEQDESK_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          echo "SeqDesk application runtime: $(node --version) ($(command -v node))"

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniconda-version: latest

      - name: Configure run paths
        run: |
          set -euo pipefail
          RUN_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-slurm"
          PORT=$((23000 + (GITHUB_RUN_NUMBER % 1000)))
          DB_NAME="seqdesk_slurm_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "SERVER_LOG=$RUNNER_TEMP/server-slurm-$RUN_SUFFIX.log" >> "$GITHUB_ENV"
          echo "RUNTIME_E2E_LOG=$RUNNER_TEMP/runtime-e2e-$RUN_SUFFIX.log" >> "$GITHUB_ENV"
          echo "SLURM_E2E_LOG=$RUNNER_TEMP/slurm-e2e-$RUN_SUFFIX.log" >> "$GITHUB_ENV"
          echo "FAILURE_E2E_LOG=$RUNNER_TEMP/slurm-failure-e2e-$RUN_SUFFIX.log" >> "$GITHUB_ENV"
          echo "CANCEL_E2E_LOG=$RUNNER_TEMP/slurm-cancel-e2e-$RUN_SUFFIX.log" >> "$GITHUB_ENV"
          echo "APPCHECK_E2E_LOG=$RUNNER_TEMP/appcheck-e2e-$RUN_SUFFIX.log" >> "$GITHUB_ENV"
          echo "PROVIDERS_JSON=$RUNNER_TEMP/providers-slurm-$RUN_SUFFIX.json" >> "$GITHUB_ENV"
          # The SLURM compute node must see the pipeline's inputs (data), its run dir
          # (outputs/logs) AND any reference DBs, so place all three on the shared FS
          # when configured. Server/PG logs stay runner-local — only the app reads them.
          if [ -n "${SLURM_SHARED_RUN_ROOT:-}" ]; then
            SHARED_BASE="$SLURM_SHARED_RUN_ROOT"
            mkdir -p "$SHARED_BASE"
          else
            SHARED_BASE="$RUNNER_TEMP"
          fi
          echo "SEQDESK_DATA_DIR=$SHARED_BASE/seqdesk-data-$RUN_SUFFIX" >> "$GITHUB_ENV"
          echo "SEQDESK_RUN_DIR=$SHARED_BASE/ci-seqdesk-runs-$RUN_SUFFIX" >> "$GITHUB_ENV"
          echo "SEQDESK_STAGED_PIPELINES_DIR=$SHARED_BASE/ci-seqdesk-pipelines-$RUN_SUFFIX" >> "$GITHUB_ENV"
          echo "SEQDESK_DB_DIR=$SHARED_BASE/seqdesk-pipeline-dbs-$RUN_SUFFIX" >> "$GITHUB_ENV"
          echo "PGDATA_DIR=$RUNNER_TEMP/postgres-slurm-$RUN_SUFFIX" >> "$GITHUB_ENV"
          echo "PG_LOG=$RUNNER_TEMP/postgres-slurm-$RUN_SUFFIX.log" >> "$GITHUB_ENV"
          echo "PG_TOOLCHAIN_DIR=$RUNNER_TEMP/seqdesk-postgres-tools-slurm-$RUN_SUFFIX" >> "$GITHUB_ENV"

      - name: Prepare run-scoped process cleanup
        run: |
          set -euo pipefail
          CLEANUP_HELPER="$RUNNER_TEMP/seqdesk-ci-cleanup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sh"
          cat > "$CLEANUP_HELPER" <<'CLEANUP_HELPER'
          # Functions in this file are sourced by later workflow steps. A PipelineRun
          # queue id is not enough authority to signal a process: PIDs and SLURM ids
          # can be reused. Match the generated run root (and SeqDesk job name for
          # SLURM) before signalling anything.
          seqdesk_ci_process_group_identity_state() {
            local group_id="${1:-}"
            local run_folder="${2:-}"
            local expected_script processes identity_state
            if [[ ! "$group_id" =~ ^[0-9]+$ ]] || [ -z "$run_folder" ]; then
              printf '%s\n' unknown
              return 0
            fi
            expected_script="$run_folder/run.sh"
            if ! processes="$(ps -eo pgid=,args= 2>/dev/null)"; then
              printf '%s\n' unknown
              return 0
            fi
            if ! identity_state="$(printf '%s\n' "$processes" | awk \
              -v expected="$group_id" -v script="$expected_script" '
                $1 == expected {
                  for (field = 2; field <= NF; field += 1) {
                    if ($field == script) found = 1
                  }
                }
                END { print(found ? "matches" : "mismatch") }
              ')"; then
              printf '%s\n' unknown
            else
              printf '%s\n' "$identity_state"
            fi
          }

          seqdesk_ci_pid_state() {
            local pid="${1:-}"
            local processes pid_state
            if [[ ! "$pid" =~ ^[0-9]+$ ]]; then
              printf '%s\n' unknown
              return 0
            fi
            if ! processes="$(ps -eo pid=,stat= 2>/dev/null)"; then
              printf '%s\n' unknown
              return 0
            fi
            if ! pid_state="$(printf '%s\n' "$processes" | awk \
              -v expected="$pid" '
                $1 == expected && $2 !~ /^Z/ { active = 1 }
                END { print(active ? "active" : "inactive") }
              ')"; then
              printf '%s\n' unknown
            else
              printf '%s\n' "$pid_state"
            fi
          }

          seqdesk_ci_process_group_state() {
            local group_id="${1:-}"
            local processes group_state
            if [[ ! "$group_id" =~ ^[0-9]+$ ]]; then
              printf '%s\n' unknown
              return 0
            fi
            if ! processes="$(ps -eo pgid=,stat= 2>/dev/null)"; then
              printf '%s\n' unknown
              return 0
            fi
            if ! group_state="$(printf '%s\n' "$processes" | awk \
              -v expected="$group_id" '
                $1 == expected && $2 !~ /^Z/ { active = 1 }
                END { print(active ? "active" : "inactive") }
              ')"; then
              printf '%s\n' unknown
            else
              printf '%s\n' "$group_state"
            fi
          }

          seqdesk_ci_pid_identity_state() {
            local pid="${1:-}"
            local expected_root="${2:-}"
            local cwd processes identity_state
            if [[ ! "$pid" =~ ^[0-9]+$ ]] || [ -z "$expected_root" ]; then
              printf '%s\n' unknown
              return 0
            fi
            cwd="$(readlink "/proc/$pid/cwd" 2>/dev/null || true)"
            if [[ "$cwd" == "$expected_root" || "$cwd" == "$expected_root/"* ]]; then
              printf '%s\n' matches
              return 0
            fi
            if ! processes="$(ps -eo pid=,args= 2>/dev/null)"; then
              printf '%s\n' unknown
              return 0
            fi
            if ! identity_state="$(printf '%s\n' "$processes" | awk \
              -v expected="$pid" -v root="$expected_root" '
                $1 == expected && index($0, root) > 0 { matches = 1 }
                END { print(matches ? "matches" : "mismatch") }
              ')"; then
              printf '%s\n' unknown
            else
              printf '%s\n' "$identity_state"
            fi
          }

          # Print active, inactive, or unknown. Query the queue as a whole so a
          # completed/nonexistent id is a successful empty match; a controller
          # lookup failure remains distinguishable from an inactive job.
          seqdesk_ci_slurm_job_state() {
            local job_id="${1:-}"
            local queue_ids
            if [[ ! "$job_id" =~ ^[0-9]+$ ]]; then
              printf '%s\n' unknown
              return 0
            fi
            if ! queue_ids="$(squeue -h -o '%i' 2>/dev/null)"; then
              printf '%s\n' unknown
            elif printf '%s\n' "$queue_ids" | grep -qx "$job_id"; then
              printf '%s\n' active
            else
              printf '%s\n' inactive
            fi
          }

          # Print matches, mismatch, or unknown. Only an exact JobName + WorkDir
          # match authorizes a signal; controller errors are never an inactive job.
          seqdesk_ci_slurm_job_identity_state() {
            local job_id="${1:-}"
            local run_folder="${2:-}"
            local expected_job_name="${3:-}"
            local info job_name work_dir
            local resolved_expected_work_dir resolved_actual_work_dir
            if [[ ! "$job_id" =~ ^[0-9]+$ ]] ||
               [ -z "$run_folder" ] || [ -z "$expected_job_name" ]; then
              printf '%s\n' unknown
              return 0
            fi
            if ! info="$(scontrol show job -o "$job_id" 2>/dev/null)"; then
              printf '%s\n' unknown
              return 0
            fi
            job_name="$(printf '%s\n' "$info" | tr ' ' '\n' | sed -n 's/^JobName=//p' | head -n 1)"
            work_dir="$(printf '%s\n' "$info" | tr ' ' '\n' | sed -n 's/^WorkDir=//p' | head -n 1)"
            resolved_expected_work_dir="$(realpath -m "$run_folder" 2>/dev/null || true)"
            resolved_actual_work_dir="$(realpath -m "$work_dir" 2>/dev/null || true)"
            if [ -z "$job_name" ] || [ -z "$work_dir" ]; then
              printf '%s\n' unknown
            elif [ -z "$resolved_expected_work_dir" ] ||
                 [ -z "$resolved_actual_work_dir" ]; then
              printf '%s\n' unknown
            elif [ "$job_name" = "$expected_job_name" ] &&
                 [ "$resolved_actual_work_dir" = "$resolved_expected_work_dir" ]; then
              printf '%s\n' matches
            else
              printf '%s\n' mismatch
            fi
          }

          seqdesk_ci_cancel_pipeline_runs() {
            local db_name="${1:-}"
            local run_root="${2:-}"
            local queue_file identity_file marker_file run_id queue_id run_folder safe_run_id
            local kind expected_job_name pid process_state slurm_state identity_state
            local marker_path marker_size marker_contents resolved_marker
            local resolved_root resolved_run
            local cleanup_rc=0
            local remaining=0

            if [ -z "$db_name" ] || [ -z "$run_root" ]; then
              echo "ERROR: refusing pipeline cleanup without a database and run root." >&2
              return 1
            fi
            if ! command -v psql >/dev/null 2>&1; then
              echo "ERROR: psql is unavailable; cannot resolve this run's queue ids." >&2
              return 1
            fi
            resolved_root="$(realpath -m "$run_root" 2>/dev/null || true)"
            if [ -z "$resolved_root" ]; then
              echo "ERROR: could not resolve pipeline run root $run_root." >&2
              return 1
            fi

            queue_file="$(mktemp "${RUNNER_TEMP:-/tmp}/seqdesk-ci-queue.XXXXXX")" || return 1
            identity_file="$(mktemp "${RUNNER_TEMP:-/tmp}/seqdesk-ci-identity.XXXXXX")" || {
              rm -f "$queue_file"
              return 1
            }
            marker_file="$(mktemp "${RUNNER_TEMP:-/tmp}/seqdesk-ci-markers.XXXXXX")" || {
              rm -f "$queue_file" "$identity_file"
              return 1
            }
            if ! PGPASSWORD="${DB_PASSWORD:-seqdesk}" psql \
              -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" \
              -U "${DB_USER:-seqdesk}" -d "$db_name" -At -F '|' \
              -c "select id, \"queueJobId\", coalesce(\"runFolder\", '') from \"PipelineRun\" where coalesce(\"queueJobId\", '') <> '' order by \"createdAt\"" \
              >"$queue_file" 2>/dev/null; then
              echo "ERROR: could not query PipelineRun queue identities from $db_name." >&2
              # Preserve cleanup failure so diagnostics survive, but still use
              # launch markers to stop jobs that never reached PostgreSQL.
              : > "$queue_file"
              cleanup_rc=1
            fi

            # Database status is deliberately not part of this filter. A finalizer
            # bug or race can mark a run terminal before its detached process/allocation
            # actually exits. Scope every identity to this run's exact generated folder,
            # then let ps/squeue determine whether anything still needs a signal.
            while IFS='|' read -r run_id queue_id run_folder; do
              resolved_run="$(realpath -m "$run_folder" 2>/dev/null || true)"
              if [ -z "$run_id" ] || [ -z "$queue_id" ] ||
                 [ -z "$resolved_run" ] ||
                 [[ "$resolved_run" != "$resolved_root/"* ]]; then
                echo "ERROR: refusing unscoped PipelineRun identity from $db_name (run=${run_id:-<missing>} queue=${queue_id:-<missing>} folder=${run_folder:-<missing>})." >&2
                cleanup_rc=1
                continue
              fi
              case "$queue_id" in
                local-*)
                  pid="${queue_id#local-}"
                  if [[ "$pid" =~ ^[0-9]+$ ]]; then
                    printf 'local|%s|%s|-\n' "$pid" "$run_folder" >> "$identity_file"
                  else
                    echo "ERROR: malformed local queue id in $db_name: $queue_id" >&2
                    cleanup_rc=1
                  fi
                  ;;
                *[!0-9]*)
                  echo "ERROR: unrecognized queue id in $db_name: $queue_id" >&2
                  cleanup_rc=1
                  ;;
                *)
                  safe_run_id="$(printf '%s' "$run_id" | sed 's/[^A-Za-z0-9_-]/-/g' | cut -c1-48)"
                  expected_job_name="seqdesk-$safe_run_id"
                  printf 'slurm|%s|%s|%s\n' \
                    "$queue_id" "$run_folder" "$expected_job_name" >> "$identity_file"
                  ;;
              esac
            done < "$queue_file"
            rm -f "$queue_file"

            # Recover external launches whose queueJobId database write and
            # immediate compensating stop both failed. The app writes this
            # marker atomically beside run.sh before persisting queueJobId.
            if [ -d "$resolved_root" ]; then
              if ! find "$resolved_root" \
                -name '.seqdesk-launch-identity' -print0 > "$marker_file" 2>/dev/null; then
                echo "ERROR: could not scan pipeline launch identity markers under $resolved_root." >&2
                cleanup_rc=1
              fi

              while IFS= read -r -d '' marker_path; do
                resolved_run="$(realpath -m "$(dirname "$marker_path")" 2>/dev/null || true)"
                resolved_marker="$(realpath -m "$marker_path" 2>/dev/null || true)"
                if [ -z "$resolved_run" ] || [ -z "$resolved_marker" ] ||
                   [[ "$resolved_run" != "$resolved_root/"* ]] ||
                   [ "$resolved_marker" != "$resolved_run/.seqdesk-launch-identity" ] ||
                   [ -L "$marker_path" ] || [ ! -f "$marker_path" ]; then
                  echo "ERROR: refusing unscoped pipeline launch marker: $marker_path" >&2
                  cleanup_rc=1
                  continue
                fi
                if ! marker_size="$(wc -c < "$marker_path" 2>/dev/null)"; then
                  echo "ERROR: could not size pipeline launch marker: $marker_path" >&2
                  cleanup_rc=1
                  continue
                fi
                marker_size="${marker_size//[[:space:]]/}"
                if [[ ! "$marker_size" =~ ^[0-9]+$ ]] ||
                   [ "$marker_size" -lt 1 ] || [ "$marker_size" -gt 256 ]; then
                  echo "ERROR: refusing malformed pipeline launch marker: $marker_path" >&2
                  cleanup_rc=1
                  continue
                fi
                if ! marker_contents="$(LC_ALL=C head -c 257 "$marker_path" 2>/dev/null)"; then
                  echo "ERROR: could not read pipeline launch marker: $marker_path" >&2
                  cleanup_rc=1
                  continue
                fi

                if [[ "$marker_contents" =~ ^local\|([1-9][0-9]*)\|-$ ]]; then
                  printf 'local|%s|%s|-\n' \
                    "${BASH_REMATCH[1]}" "$resolved_run" >> "$identity_file"
                elif [[ "$marker_contents" =~ ^slurm\|([1-9][0-9]*)\|(seqdesk-[A-Za-z0-9_-]+)$ ]]; then
                  printf 'slurm|%s|%s|%s\n' \
                    "${BASH_REMATCH[1]}" "$resolved_run" "${BASH_REMATCH[2]}" >> "$identity_file"
                else
                  echo "ERROR: refusing malformed pipeline launch marker contents at $marker_path." >&2
                  cleanup_rc=1
                fi
              done < "$marker_file"
            fi
            rm -f "$marker_file"

            if ! sort -u "$identity_file" -o "$identity_file"; then
              echo "ERROR: could not deduplicate pipeline cleanup identities." >&2
              cleanup_rc=1
            fi

            # Signal all verified jobs first, then wait for the whole set together.
            # This keeps cleanup bounded even if several clients timed out together.
            while IFS='|' read -r kind queue_id run_folder expected_job_name; do
              case "$kind" in
                local)
                  process_state="$(seqdesk_ci_process_group_state "$queue_id")"
                  if [ "$process_state" = "active" ]; then
                    identity_state="$(seqdesk_ci_process_group_identity_state \
                      "$queue_id" "$run_folder")"
                    if [ "$identity_state" = "matches" ]; then
                      kill -TERM -- "-$queue_id" >/dev/null 2>&1 ||
                        kill -TERM "$queue_id" >/dev/null 2>&1 || cleanup_rc=1
                    else
                      process_state="$(seqdesk_ci_process_group_state "$queue_id")"
                      if [ "$process_state" != "inactive" ]; then
                        echo "ERROR: refusing to signal process group $queue_id; state=$process_state identity=$identity_state." >&2
                        cleanup_rc=1
                      fi
                    fi
                  elif [ "$process_state" = "unknown" ]; then
                    echo "ERROR: process-group state for $queue_id is unknown; preserving the run tree." >&2
                    cleanup_rc=1
                  fi
                  ;;
                slurm)
                  slurm_state="$(seqdesk_ci_slurm_job_state "$queue_id")"
                  case "$slurm_state" in
                    inactive)
                      continue
                      ;;
                    unknown)
                      echo "ERROR: could not determine whether SLURM job $queue_id is active; preserving the run tree." >&2
                      cleanup_rc=1
                      continue
                      ;;
                  esac
                  identity_state="$(seqdesk_ci_slurm_job_identity_state \
                    "$queue_id" "$run_folder" "$expected_job_name")"
                  if [ "$identity_state" = "matches" ]; then
                    scancel "$queue_id" >/dev/null 2>&1 || cleanup_rc=1
                  else
                    slurm_state="$(seqdesk_ci_slurm_job_state "$queue_id")"
                    if [ "$slurm_state" = "inactive" ]; then
                      echo "SLURM job $queue_id exited before cleanup could signal it."
                    else
                      echo "ERROR: refusing to cancel SLURM job $queue_id; queue state=$slurm_state identity=$identity_state, expected JobName=$expected_job_name WorkDir=$run_folder." >&2
                      cleanup_rc=1
                    fi
                  fi
                  ;;
              esac
            done < "$identity_file"

            for _ in $(seq 1 30); do
              remaining=0
              while IFS='|' read -r kind queue_id run_folder expected_job_name; do
                if [ "$kind" = "local" ]; then
                  process_state="$(seqdesk_ci_process_group_state "$queue_id")"
                  if [ "$process_state" = "active" ]; then
                    remaining=1
                  elif [ "$process_state" = "unknown" ]; then
                    cleanup_rc=1
                  fi
                else
                  slurm_state="$(seqdesk_ci_slurm_job_state "$queue_id")"
                  if [ "$slurm_state" = "active" ]; then
                    identity_state="$(seqdesk_ci_slurm_job_identity_state \
                      "$queue_id" "$run_folder" "$expected_job_name")"
                    if [ "$identity_state" = "matches" ]; then
                      remaining=1
                    else
                      cleanup_rc=1
                    fi
                  elif [ "$slurm_state" = "unknown" ]; then
                    cleanup_rc=1
                  fi
                fi
              done < "$identity_file"
              [ "$remaining" = 0 ] && break
              sleep 1
            done

            # Escalate only process groups that still prove ownership. scancel is
            # repeated for verified SLURM jobs; SLURM performs its own signal policy.
            while IFS='|' read -r kind queue_id run_folder expected_job_name; do
              if [ "$kind" = "local" ]; then
                process_state="$(seqdesk_ci_process_group_state "$queue_id")"
                if [ "$process_state" = "active" ]; then
                  identity_state="$(seqdesk_ci_process_group_identity_state \
                    "$queue_id" "$run_folder")"
                  if [ "$identity_state" = "matches" ]; then
                    kill -KILL -- "-$queue_id" >/dev/null 2>&1 ||
                      kill -KILL "$queue_id" >/dev/null 2>&1 || cleanup_rc=1
                  else
                    cleanup_rc=1
                  fi
                elif [ "$process_state" = "unknown" ]; then
                  cleanup_rc=1
                fi
              elif [ "$kind" = "slurm" ]; then
                slurm_state="$(seqdesk_ci_slurm_job_state "$queue_id")"
                if [ "$slurm_state" = "active" ]; then
                  identity_state="$(seqdesk_ci_slurm_job_identity_state \
                    "$queue_id" "$run_folder" "$expected_job_name")"
                  if [ "$identity_state" = "matches" ]; then
                    scancel "$queue_id" >/dev/null 2>&1 || cleanup_rc=1
                  else
                    cleanup_rc=1
                  fi
                elif [ "$slurm_state" = "unknown" ]; then
                  cleanup_rc=1
                fi
              fi
            done < "$identity_file"

            for _ in $(seq 1 10); do
              remaining=0
              while IFS='|' read -r kind queue_id run_folder expected_job_name; do
                if [ "$kind" = "local" ]; then
                  process_state="$(seqdesk_ci_process_group_state "$queue_id")"
                  if [ "$process_state" = "active" ]; then
                    remaining=1
                  elif [ "$process_state" = "unknown" ]; then
                    cleanup_rc=1
                  fi
                else
                  slurm_state="$(seqdesk_ci_slurm_job_state "$queue_id")"
                  if [ "$slurm_state" = "active" ]; then
                    identity_state="$(seqdesk_ci_slurm_job_identity_state \
                      "$queue_id" "$run_folder" "$expected_job_name")"
                    if [ "$identity_state" = "matches" ]; then
                      remaining=1
                    else
                      cleanup_rc=1
                    fi
                  elif [ "$slurm_state" = "unknown" ]; then
                    cleanup_rc=1
                  fi
                fi
              done < "$identity_file"
              [ "$remaining" = 0 ] && break
              sleep 1
            done

            while IFS='|' read -r kind queue_id run_folder expected_job_name; do
              if [ "$kind" = "local" ]; then
                process_state="$(seqdesk_ci_process_group_state "$queue_id")"
                if [ "$process_state" = "active" ]; then
                  identity_state="$(seqdesk_ci_process_group_identity_state \
                    "$queue_id" "$run_folder")"
                  if [ "$identity_state" = "matches" ]; then
                    echo "ERROR: local pipeline process group $queue_id survived bounded cleanup." >&2
                  else
                    echo "ERROR: process group $queue_id is still active but its exact run.sh identity is $identity_state; preserving the run tree." >&2
                  fi
                  cleanup_rc=1
                elif [ "$process_state" = "unknown" ]; then
                  echo "ERROR: final process-group state for $queue_id is unknown; preserving the run tree." >&2
                  cleanup_rc=1
                fi
              elif [ "$kind" = "slurm" ]; then
                slurm_state="$(seqdesk_ci_slurm_job_state "$queue_id")"
                if [ "$slurm_state" = "active" ]; then
                  identity_state="$(seqdesk_ci_slurm_job_identity_state \
                    "$queue_id" "$run_folder" "$expected_job_name")"
                  if [ "$identity_state" = "matches" ]; then
                    echo "ERROR: SLURM job $queue_id survived bounded cleanup." >&2
                  else
                    echo "ERROR: active SLURM id $queue_id could not be revalidated after cleanup; preserving the run tree." >&2
                  fi
                  cleanup_rc=1
                elif [ "$slurm_state" = "unknown" ]; then
                  echo "ERROR: final SLURM state for $queue_id is unknown; preserving the run tree." >&2
                  cleanup_rc=1
                fi
              fi
            done < "$identity_file"
            rm -f "$identity_file"
            return "$cleanup_rc"
          }

          seqdesk_ci_stop_child() {
            local pid="${1:-}"
            local label="${2:-child process}"
            local expected_root="${3:-}"
            local pid_state identity_state
            [ -n "$pid" ] || return 0
            pid_state="$(seqdesk_ci_pid_state "$pid")"
            if [ "$pid_state" = "inactive" ]; then
              wait "$pid" >/dev/null 2>&1 || true
              return 0
            fi
            if [ "$pid_state" = "unknown" ]; then
              echo "ERROR: state of $label PID $pid is unknown; preserving its tree." >&2
              return 1
            fi
            identity_state="$(seqdesk_ci_pid_identity_state "$pid" "$expected_root")"
            if [ "$identity_state" != "matches" ]; then
              pid_state="$(seqdesk_ci_pid_state "$pid")"
              if [ "$pid_state" = "inactive" ]; then
                wait "$pid" >/dev/null 2>&1 || true
                return 0
              fi
              echo "ERROR: refusing to signal $label PID $pid; state=$pid_state identity=$identity_state for $expected_root." >&2
              return 1
            fi
            kill -TERM "$pid" >/dev/null 2>&1 || true
            for _ in $(seq 1 20); do
              pid_state="$(seqdesk_ci_pid_state "$pid")"
              [ "$pid_state" = "inactive" ] && break
              if [ "$pid_state" = "unknown" ]; then
                echo "ERROR: state of $label PID $pid became unknown after TERM." >&2
                return 1
              fi
              sleep 1
            done
            pid_state="$(seqdesk_ci_pid_state "$pid")"
            if [ "$pid_state" = "active" ]; then
              identity_state="$(seqdesk_ci_pid_identity_state "$pid" "$expected_root")"
              if [ "$identity_state" != "matches" ]; then
                pid_state="$(seqdesk_ci_pid_state "$pid")"
                if [ "$pid_state" = "inactive" ]; then
                  wait "$pid" >/dev/null 2>&1 || true
                  return 0
                fi
                echo "ERROR: refusing to escalate $label PID $pid; state=$pid_state identity=$identity_state." >&2
                return 1
              fi
              kill -KILL "$pid" >/dev/null 2>&1 || true
              for _ in $(seq 1 5); do
                pid_state="$(seqdesk_ci_pid_state "$pid")"
                [ "$pid_state" = "inactive" ] && break
                if [ "$pid_state" = "unknown" ]; then
                  echo "ERROR: state of $label PID $pid became unknown after KILL." >&2
                  return 1
                fi
                sleep 1
              done
            elif [ "$pid_state" = "unknown" ]; then
              echo "ERROR: state of $label PID $pid is unknown before escalation." >&2
              return 1
            fi
            wait "$pid" >/dev/null 2>&1 || true
            pid_state="$(seqdesk_ci_pid_state "$pid")"
            if [ "$pid_state" != "inactive" ]; then
              echo "ERROR: final state of $label PID $pid is $pid_state after bounded cleanup." >&2
              return 1
            fi
          }

          seqdesk_ci_stop_monitors() {
            local app_root="${1:-}"
            local processes monitor_pids pid
            [ -n "$app_root" ] || return 0
            if ! processes="$(ps -eo pid=,args= 2>/dev/null)"; then
              echo "ERROR: process-table lookup failed while finding monitors for $app_root." >&2
              return 1
            fi
            monitor_pids="$(printf '%s\n' "$processes" | awk \
              -v root="$app_root" '
                index($0, root) > 0 && $0 ~ /-monitor/ { print $1 }
              ')"
            for pid in $monitor_pids; do
              seqdesk_ci_stop_child "$pid" "pipeline monitor" "$app_root" || return 1
            done
            if ! processes="$(ps -eo pid=,args= 2>/dev/null)"; then
              echo "ERROR: final process-table lookup failed for monitors under $app_root." >&2
              return 1
            fi
            if printf '%s\n' "$processes" | awk \
              -v root="$app_root" '
                index($0, root) > 0 && $0 ~ /-monitor/ { found = 1 }
                END { exit(found ? 0 : 1) }
              '; then
              echo "ERROR: monitor process scoped to $app_root survived bounded cleanup." >&2
              return 1
            fi
          }
          CLEANUP_HELPER
          chmod 700 "$CLEANUP_HELPER"
          bash -n "$CLEANUP_HELPER"
          echo "SEQDESK_CI_CLEANUP_HELPER=$CLEANUP_HELPER" >> "$GITHUB_ENV"

      - name: Verify SLURM is available on the runner
        run: |
          set -euo pipefail
          missing=0
          for cmd in sbatch squeue sacct scancel scontrol; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "Found $cmd: $(command -v "$cmd")"
            else
              echo "Missing required SLURM command on runner: $cmd" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "This workflow requires sbatch/squeue/sacct/scancel/scontrol on the self-hosted runner." >&2
            exit 1
          fi
          for required_var in SLURM_SHARED_CONDA_BASE SLURM_SHARED_RUN_ROOT SLURM_SHARED_CONDA_ENV; do
            if [ -z "${!required_var:-}" ]; then
              echo "Required private-repository variable $required_var is not configured." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The Twincore compute nodes require shared run and Conda paths." >&2
            exit 1
          fi

      - name: Free stale SLURM jobs from prior runs (QOS submit-slot cleanup)
        run: |
          set -euo pipefail
          # This cluster caps concurrent submissions per user. A PENDING allocation
          # blocks the submit slot, while a RUNNING/COMPLETING allocation from a
          # failed workflow can keep using a run tree the next cleanup wants to
          # reclaim. Drain every active state from prior canonical runs. A SeqDesk
          # name or account membership alone is never ownership proof: snapshot the
          # exact controller JobName + WorkDir beneath a canonical CI run folder and
          # revalidate both immediately before scancel.
          source "$SEQDESK_CI_CLEANUP_HELPER"
          ME="$(whoami)"
          STALE_FILE="$RUNNER_TEMP/seqdesk-stale-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          ACTIVE_FILE="$RUNNER_TEMP/seqdesk-active-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          drain_fail=0
          : > "$STALE_FILE"
          if ! squeue -u "$ME" -h -o '%i|%j|%T' > "$ACTIVE_FILE" 2>/dev/null; then
            echo "ERROR: could not query active SLURM jobs; refusing to start a new acceptance run." >&2
            exit 1
          fi
          while IFS='|' read -r job_id listed_job_name job_state; do
            [[ "$job_id" =~ ^[0-9]+$ ]] || continue
            [[ "$listed_job_name" == seqdesk-* ]] || continue
            if ! info="$(scontrol show job -o "$job_id" 2>/dev/null)"; then
              echo "ERROR: controller lookup failed for active SeqDesk job $job_id; ownership is unknown." >&2
              drain_fail=1
              continue
            fi
            job_name="$(printf '%s\n' "$info" | tr ' ' '\n' | sed -n 's/^JobName=//p' | head -n 1)"
            work_dir="$(printf '%s\n' "$info" | tr ' ' '\n' | sed -n 's/^WorkDir=//p' | head -n 1)"
            if [ -z "$job_name" ] || [ -z "$work_dir" ]; then
              echo "ERROR: controller metadata is incomplete for active SeqDesk job $job_id; ownership is unknown." >&2
              drain_fail=1
            elif [ "$job_name" = "$listed_job_name" ] &&
               [[ "$work_dir" == "$SLURM_SHARED_RUN_ROOT"/ci-seqdesk-runs-*/* ]]; then
              printf '%s|%s|%s|%s\n' \
                "$job_id" "$job_name" "$work_dir" "$job_state" >> "$STALE_FILE"
            else
              echo "leaving active SeqDesk job $job_id untouched (state=${job_state:-unknown} JobName=${job_name:-unknown} WorkDir=${work_dir:-unknown})"
            fi
          done < "$ACTIVE_FILE"
          if [ -s "$STALE_FILE" ]; then
            echo "draining prior canonical-CI active allocation(s):"
            sed 's/^/  /' "$STALE_FILE"
            while IFS='|' read -r job_id job_name work_dir job_state; do
              identity_state="$(seqdesk_ci_slurm_job_identity_state \
                "$job_id" "$work_dir" "$job_name")"
              if [ "$identity_state" = "matches" ]; then
                echo "cancelling $job_id ($job_state, $job_name, $work_dir)"
                scancel "$job_id" 2>/dev/null || drain_fail=1
              else
                slurm_state="$(seqdesk_ci_slurm_job_state "$job_id")"
                if [ "$slurm_state" = "inactive" ]; then
                  echo "prior canonical-CI allocation $job_id exited before the drain signal"
                else
                  echo "ERROR: identity for job $job_id is $identity_state and queue state is $slurm_state before cancellation; refusing scancel." >&2
                  drain_fail=1
                fi
              fi
            done < "$STALE_FILE"
            for _ in $(seq 1 24); do
              remaining=0
              while IFS='|' read -r job_id job_name work_dir job_state; do
                slurm_state="$(seqdesk_ci_slurm_job_state "$job_id")"
                if [ "$slurm_state" = "active" ]; then
                  identity_state="$(seqdesk_ci_slurm_job_identity_state \
                    "$job_id" "$work_dir" "$job_name")"
                  if [ "$identity_state" = "matches" ]; then
                    remaining=1
                  else
                    drain_fail=1
                  fi
                elif [ "$slurm_state" = "unknown" ]; then
                  drain_fail=1
                fi
              done < "$STALE_FILE"
              [ "$remaining" = 0 ] && break
              sleep 5
            done
            while IFS='|' read -r job_id job_name work_dir job_state; do
              slurm_state="$(seqdesk_ci_slurm_job_state "$job_id")"
              if [ "$slurm_state" = "active" ]; then
                echo "ERROR: SLURM id $job_id is still active after the bounded canonical-CI drain; refusing to start a new acceptance run." >&2
                drain_fail=1
              elif [ "$slurm_state" = "unknown" ]; then
                echo "ERROR: final state of SLURM id $job_id is unknown after the canonical-CI drain; refusing to start." >&2
                drain_fail=1
              fi
            done < "$STALE_FILE"
          else
            echo "no stale active canonical-CI SLURM allocations for $ME"
          fi
          rm -f "$STALE_FILE" "$ACTIVE_FILE"
          exit "$drain_fail"

      - name: Create pipeline Conda environment
        run: |
          set -euo pipefail
          # Anaconda's default channels are blocked here (org security/licensing, and conda's
          # Terms-of-Service check pings repo.anaconda.com). Pin a global condarc to ONLY
          # conda-forge + bioconda AND redirect default_channels away from Anaconda, so NO conda
          # operation — including Nextflow's per-process env builds on the offline compute node —
          # resolves a package (numpy, dnaio, ...) from Anaconda. Exported via $GITHUB_ENV so
          # every later step, the app, and the SLURM tasks (sbatch --export=ALL) inherit it; the
          # file lives on the shared FS so the compute nodes can read it.
          CONDARC_FILE="${SLURM_SHARED_RUN_ROOT:-$RUNNER_TEMP}/seqdesk-condarc"
          mkdir -p "$(dirname "$CONDARC_FILE")"
          printf 'channels:\n  - conda-forge\n  - bioconda\ndefault_channels:\n  - https://conda.anaconda.org/conda-forge\n  - https://conda.anaconda.org/bioconda\nchannel_priority: strict\n' > "$CONDARC_FILE"
          export CONDARC="$CONDARC_FILE"
          echo "CONDARC=$CONDARC_FILE" >> "$GITHUB_ENV"
          echo "conda pinned to conda-forge/bioconda (no Anaconda defaults) -> $CONDARC_FILE"
          cat "$CONDARC_FILE"
          if [ -n "${SLURM_SHARED_CONDA_BASE:-}" ]; then
            # SLURM cluster: the compute nodes cannot see the runner's conda, so the env
            # must live on the shared filesystem. It is referenced by FULL PREFIX PATH,
            # not a name: a conda name maps to ~/.conda/envs, which is per-node home here
            # (each node mounts /home from a different NFS server), so names never resolve
            # across nodes. The env also can't go under the admin conda's envs/ dir (read
            # only to the CI user), so it lives at a runner-writable prefix on the shared
            # FS and is activated by path. Created once and reused across runs.
            CONDA_BIN="$SLURM_SHARED_CONDA_BASE/bin/conda"
            ENV_PREFIX="${SLURM_SHARED_CONDA_ENV:-$SLURM_SHARED_RUN_ROOT/conda-envs/seqdesk-pipelines}"
            echo "PIPELINE_CONDA_ENV=$ENV_PREFIX" >> "$GITHUB_ENV"
            PIPELINE_PKGS="python=3.11 openjdk=17 nodejs=24 coreutils nextflow nf-core"
            # Pipelines run their process scripts inside this env on the compute node, so
            # it needs the full launcher toolchain (node + java + coreutils), not just
            # nextflow. Check the binaries INSIDE the env prefix directly — `conda run`
            # would also find tools on the runner's ambient PATH (e.g. the runner's own
            # node), giving a false "present" and skipping the top-up the compute node
            # needs. Reuse only when complete; else top up in place, or create new.
            ENV_NODE_MAJOR=""
            ENV_PYTHON_VERSION=""
            if [ -x "$ENV_PREFIX/bin/node" ]; then
              ENV_NODE_MAJOR="$("$ENV_PREFIX/bin/node" -p 'process.versions.node.split(".")[0]' 2>/dev/null || true)"
            fi
            if [ -x "$ENV_PREFIX/bin/python" ]; then
              ENV_PYTHON_VERSION="$("$ENV_PREFIX/bin/python" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' 2>/dev/null || true)"
            fi
            if [ -x "$ENV_PREFIX/bin/nextflow" ] && [ -x "$ENV_PREFIX/bin/java" ] && \
               [ -x "$ENV_PREFIX/bin/nf-core" ] && [ -x "$ENV_PREFIX/bin/md5sum" ] && \
               [ "$ENV_NODE_MAJOR" = "24" ] && [ "$ENV_PYTHON_VERSION" = "3.11" ]; then
              echo "Reusing existing shared conda env at $ENV_PREFIX (complete pinned toolchain present)"
            elif [ -d "$ENV_PREFIX" ]; then
              echo "Repairing existing shared conda env at $ENV_PREFIX (Node ${ENV_NODE_MAJOR:-missing}, Python ${ENV_PYTHON_VERSION:-missing})"
              "$CONDA_BIN" install -y -p "$ENV_PREFIX" \
                --override-channels -c conda-forge -c bioconda $PIPELINE_PKGS
            else
              echo "Creating shared conda env at $ENV_PREFIX"
              mkdir -p "$(dirname "$ENV_PREFIX")"
              "$CONDA_BIN" create -y -p "$ENV_PREFIX" \
                --override-channels -c conda-forge -c bioconda $PIPELINE_PKGS
            fi
            test "$("$ENV_PREFIX/bin/node" -p 'process.versions.node.split(".")[0]')" = "24"
            test "$("$ENV_PREFIX/bin/python" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.11"
            for cmd in nextflow java nf-core md5sum; do test -x "$ENV_PREFIX/bin/$cmd"; done
          else
            conda create -y -n "$PIPELINE_CONDA_ENV" \
              --override-channels \
              -c conda-forge \
              -c bioconda \
              python=3.11 \
              openjdk=17 \
              nodejs=24 \
              coreutils \
              nextflow \
              nf-core
          fi

      - name: Resolve Conda base and toolchain on PATH
        run: |
          set -euo pipefail
          # On a SLURM cluster the app must point at the shared conda the compute nodes
          # see, not the runner-local one. Falls back to the runner conda when unset.
          # Do not prepend the pipeline env to the job-wide PATH: doing so used to
          # shadow setup-node's supported Node 24 with the persistent Conda env's
          # Node 25 and made the real installer fail. Generated pipeline scripts
          # activate this configured environment explicitly.
          if [ -n "${SLURM_SHARED_CONDA_BASE:-}" ]; then
            CONDA_BASE="$SLURM_SHARED_CONDA_BASE"
            # The env is referenced by full prefix path on this cluster (names don't
            # resolve across nodes). Pin it for the app from the stable variable —
            # NOT via PIPELINE_CONDA_ENV, whose job-level env default makes its value
            # ambiguous against $GITHUB_ENV. Its bin is <prefix>/bin.
            echo "SEQDESK_CONDA_ENV=$SLURM_SHARED_CONDA_ENV" >> "$GITHUB_ENV"
          else
            CONDA_BASE="$(conda info --base)"
          fi
          echo "SEQDESK_CONDA_PATH=$CONDA_BASE" >> "$GITHUB_ENV"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          echo "Application Node remains pinned after Conda setup: $(node --version)"

      - name: Setup PostgreSQL toolchain
        run: |
          set -euo pipefail
          rm -rf "$PG_TOOLCHAIN_DIR"
          conda create -y -p "$PG_TOOLCHAIN_DIR" --override-channels -c conda-forge postgresql
          echo "$PG_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Ensure PostgreSQL database
        run: |
          set -euo pipefail

          find_pg_bin_dir() {
            local candidate=""
            if command -v initdb >/dev/null 2>&1 && command -v pg_ctl >/dev/null 2>&1; then
              dirname "$(command -v initdb)"
              return 0
            fi
            if command -v pg_config >/dev/null 2>&1; then
              candidate="$(pg_config --bindir 2>/dev/null || true)"
              if [ -n "$candidate" ] && [ -x "$candidate/initdb" ] && [ -x "$candidate/pg_ctl" ]; then
                echo "$candidate"
                return 0
              fi
            fi
            for candidate in /usr/pgsql-*/bin /usr/lib/postgresql/*/bin; do
              if [ -x "$candidate/initdb" ] && [ -x "$candidate/pg_ctl" ]; then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }

          create_seqdesk_database() {
            local port="$1"
            local admin_user="$2"
            local admin_password="${3:-}"
            if [ -n "$admin_password" ]; then
              export PGPASSWORD="$admin_password"
            else
              unset PGPASSWORD || true
            fi
            psql -h "$DB_HOST" -p "$port" -U "$admin_user" -d postgres -c "DO \$\$ BEGIN CREATE ROLE $DB_USER LOGIN PASSWORD '$DB_PASSWORD'; EXCEPTION WHEN duplicate_object THEN ALTER ROLE $DB_USER WITH PASSWORD '$DB_PASSWORD'; END \$\$;"
            if ! psql -h "$DB_HOST" -p "$port" -U "$admin_user" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1; then
              psql -h "$DB_HOST" -p "$port" -U "$admin_user" -d postgres -c "CREATE DATABASE $DB_NAME OWNER $DB_USER"
            fi
          }

          wait_for_postgres() {
            local port="$1"
            for _ in $(seq 1 30); do
              if pg_isready -h "$DB_HOST" -p "$port" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          if pg_isready -h "$DB_HOST" -p "$DB_PORT" >/dev/null 2>&1; then
            if create_seqdesk_database "$DB_PORT" postgres; then
              echo "Using existing local PostgreSQL on port $DB_PORT."
              exit 0
            fi
          fi

          PG_BIN_DIR="$(find_pg_bin_dir || true)"
          if [ -n "$PG_BIN_DIR" ]; then
            rm -rf "$PGDATA_DIR"
            "$PG_BIN_DIR/initdb" -D "$PGDATA_DIR" -U postgres -A trust >/dev/null
            {
              echo "listen_addresses = '127.0.0.1'"
              echo "port = $FALLBACK_DB_PORT"
            } >> "$PGDATA_DIR/postgresql.conf"
            "$PG_BIN_DIR/pg_ctl" -D "$PGDATA_DIR" -l "$PG_LOG" start
            wait_for_postgres "$FALLBACK_DB_PORT"
            create_seqdesk_database "$FALLBACK_DB_PORT" postgres
            echo "DB_PORT=$FALLBACK_DB_PORT" >> "$GITHUB_ENV"
            echo "USE_EPHEMERAL_POSTGRES=1" >> "$GITHUB_ENV"
            echo "PG_CTL_BIN=$PG_BIN_DIR/pg_ctl" >> "$GITHUB_ENV"
            echo "Provisioned PostgreSQL via temporary user-space cluster."
            exit 0
          fi

          echo "PostgreSQL provisioning requires existing local PostgreSQL or user-space PostgreSQL tools."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Set database connection environment
        run: |
          set -euo pipefail
          DB_URL="postgresql://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_NAME?schema=public"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "DIRECT_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed database (admin + researcher accounts)
        run: npm run db:seed

      - name: Build SeqDesk app
        run: npm run build -- --webpack

      - name: Boot SeqDesk app and verify readiness
        run: |
          set -euo pipefail
          source "$SEQDESK_CI_CLEANUP_HELPER"
          mkdir -p "$SEQDESK_DATA_DIR" "$SEQDESK_RUN_DIR" "$SEQDESK_DB_DIR"
          # Wire pipeline + conda execution into the running app so SLURM submissions
          # generate real #SBATCH scripts and activate the Nextflow toolchain.
          export NEXTAUTH_URL="http://127.0.0.1:${PORT}"
          export NEXTAUTH_SECRET="pipeline-slurm-e2e-secret"
          export SEQDESK_PIPELINES_ENABLED=true
          export SEQDESK_DATA_PATH="$SEQDESK_DATA_DIR"
          export SEQDESK_PIPELINE_RUN_DIR="$SEQDESK_RUN_DIR"
          export SEQDESK_PIPELINE_DATABASE_DIR="$SEQDESK_DB_DIR"
          export SEQDESK_CONDA_ENABLED=true
          export SEQDESK_CONDA_PATH="$SEQDESK_CONDA_PATH"
          # Prefer the stable shared-cluster env path; fall back to the per-run name.
          export SEQDESK_CONDA_ENV="${SLURM_SHARED_CONDA_ENV:-$PIPELINE_CONDA_ENV}"
          export SEQDESK_SLURM_ENABLED=true
          # SEQDESK_SLURM_INLINE_EXECUTOR is set at job level (inherited here).
          # SLURM compute nodes can't see the app's _work tree, so the pipeline
          # packages (Nextflow workflow scripts) must live on the shared FS. Stage
          # them in this workflow run's own package tree and point the app there.
          if [ -n "${SLURM_SHARED_RUN_ROOT:-}" ]; then
            SHARED_PIPELINES_DIR="$SEQDESK_STAGED_PIPELINES_DIR"
            rm -rf "$SHARED_PIPELINES_DIR"
            mkdir -p "$SHARED_PIPELINES_DIR"
            cp -R pipelines/. "$SHARED_PIPELINES_DIR/"
            export SEQDESK_PIPELINES_DIR="$SHARED_PIPELINES_DIR"
            # Shared, PERSISTENT Nextflow conda cacheDir (outside the per-run dir, so
            # cleanup never removes it). A pipeline's LOCAL run (on the runner, which has
            # network) builds the per-process env here; the later SLURM run on the
            # network-isolated compute node reuses it by hash — no conda fetch needed.
            SHARED_CONDA_CACHE="$(dirname "$SLURM_SHARED_RUN_ROOT")/conda-cache"
            mkdir -p "$SHARED_CONDA_CACHE"
            export SEQDESK_CONDA_CACHE_DIR="$SHARED_CONDA_CACHE"
          fi
          echo "[boot] SEQDESK_CONDA_PATH=$SEQDESK_CONDA_PATH SEQDESK_CONDA_ENV=$SEQDESK_CONDA_ENV SEQDESK_PIPELINE_RUN_DIR=$SEQDESK_PIPELINE_RUN_DIR SEQDESK_PIPELINES_DIR=${SEQDESK_PIPELINES_DIR:-<app default>} SEQDESK_CONDA_CACHE_DIR=${SEQDESK_CONDA_CACHE_DIR:-<app default>}"
          PORT="$PORT" npm run start >"$SERVER_LOG" 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"
          READY=0
          for _ in $(seq 1 120); do
            APP_PROCESS_STATE="$(seqdesk_ci_pid_state "$APP_PID")"
            if [ "$APP_PROCESS_STATE" != "active" ]; then
              echo "Source-boot SeqDesk process state is $APP_PROCESS_STATE before readiness." >&2
              break
            fi
            if curl -fsS "http://127.0.0.1:${PORT}/api/auth/providers" >"$PROVIDERS_JSON"; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time." >&2
            tail -n 200 "$SERVER_LOG" || true
            exit 1
          fi
          # Give bind failures from a competing stale listener time to terminate
          # the process we launched before accepting the HTTP response as ours.
          sleep 1
          APP_PROCESS_STATE="$(seqdesk_ci_pid_state "$APP_PID")"
          APP_IDENTITY_STATE="$(seqdesk_ci_pid_identity_state "$APP_PID" "$GITHUB_WORKSPACE")"
          if [ "$APP_PROCESS_STATE" != "active" ] ||
             [ "$APP_IDENTITY_STATE" != "matches" ]; then
            echo "Readiness endpoint was served, but the source process started by this run is not alive in this checkout." >&2
            tail -n 200 "$SERVER_LOG" || true
            exit 1
          fi
          SOURCE_VERSION_JSON="$RUNNER_TEMP/source-version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          curl -fsS "http://127.0.0.1:${PORT}/api/version" >"$SOURCE_VERSION_JSON"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")" \
          SOURCE_VERSION_JSON="$SOURCE_VERSION_JSON" node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.env.SOURCE_VERSION_JSON, "utf8"));
            if (response.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`source app version mismatch: expected ${process.env.EXPECTED_VERSION}, got ${response.version}`);
            }
          '
          echo "SeqDesk app is ready on port $PORT and serves the checked-out version."

      - name: Run runtime pipeline E2E (local + SLURM through the app)
        env:
          SEQDESK_RUNTIME_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_RUNTIME_E2E_EMAIL: admin@example.com
          SEQDESK_RUNTIME_E2E_PASSWORD: admin
        run: |
          set -euo pipefail
          npm run pipeline:e2e:runtime -- \
            --ensure-dummy-data \
            --pipeline-id "$RUNTIME_PIPELINE_ID" \
            2>&1 | tee "$RUNTIME_E2E_LOG"

      # Runs EARLY on purpose: fastqc reads the order's FASTQs, and the fastq-checksum
      # step above is merge-mode (writes checksums, doesn't move/replace files), so the
      # order still has its original intact reads here (simulate-reads replace + the
      # failure-path test churn them LATER). fastqc declares a bioconda::fastqc conda
      # directive, so Nextflow builds a per-process conda env at runtime. The compute
      # node has NO network, so the SLURM run can't build it directly — but with the
      # shared SEQDESK_CONDA_CACHE_DIR set, the LOCAL run (on the networked runner) builds
      # the env into that shared cache first, and the SLURM run reuses it by hash. So
      # local+SLURM both work via the shared conda cache.
      - name: Run fastqc E2E (local + SLURM, artifacts)
        env:
          SEQDESK_RUNTIME_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_RUNTIME_E2E_EMAIL: admin@example.com
          SEQDESK_RUNTIME_E2E_PASSWORD: admin
        run: |
          set -euo pipefail
          npm run pipeline:e2e:runtime -- \
            --ensure-dummy-data \
            --pipeline-id fastqc \
            2>&1 | tee "$RUNNER_TEMP/fastqc-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"

      - name: Run study-demo-report E2E (local + SLURM, study target)
        env:
          SEQDESK_RUNTIME_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_RUNTIME_E2E_EMAIL: admin@example.com
          SEQDESK_RUNTIME_E2E_PASSWORD: admin
        run: |
          set -euo pipefail
          # study-demo-report is study-scoped and hermetic (awk only, no per-process
          # conda env), so it exercises the study-target path in both local and SLURM.
          npm run pipeline:e2e:runtime -- \
            --ensure-dummy-data \
            --pipeline-id study-demo-report \
            2>&1 | tee "$RUNNER_TEMP/study-demo-report-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"

      - name: Run simulate-reads E2E (local + SLURM, replace writeback)
        env:
          SEQDESK_RUNTIME_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_RUNTIME_E2E_EMAIL: admin@example.com
          SEQDESK_RUNTIME_E2E_PASSWORD: admin
        run: |
          set -euo pipefail
          # simulate-reads in BOTH local and SLURM (replace mode creates a new active
          # Read per sample). The SLURM-only smoke also runs it; this adds local coverage.
          npm run pipeline:e2e:runtime -- \
            --ensure-dummy-data \
            --pipeline-id simulate-reads \
            2>&1 | tee "$RUNNER_TEMP/simulate-reads-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"

      # reads-qc — study target; per-process seqkit/python conda built via the shared
      # cacheDir (the mechanism fastqc proved). HARD-ASSERTED (local + SLURM, `completes`
      # gate): the local `completed`->`running` re-sync flip that originally deferred it was
      # fixed (forceRunningFromQueue no longer demotes a genuinely-finished run — see
      # pipeline-run-ops-service.ts + its regression test), and reads-qc now reaches
      # `completed` and stays there in both modes.
      - name: Run reads-qc E2E (local + SLURM, study target)
        env:
          SEQDESK_RUNTIME_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_RUNTIME_E2E_EMAIL: admin@example.com
          SEQDESK_RUNTIME_E2E_PASSWORD: admin
        run: |
          set -euo pipefail
          npm run pipeline:e2e:runtime -- \
            --ensure-dummy-data \
            --pipeline-id reads-qc \
            2>&1 | tee "$RUNNER_TEMP/reads-qc-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"

      # --- Opt-in: run the PUBLIC pipelines on the REAL ENA mouse-gut dataset (PRJDB6165) ---
      # Gated to an explicit workflow_dispatch with run_mouse_real_data=true, so mirrored pushes
      # skip it (it downloads ~130 MB of real reads from ENA and runs extra pipelines). Seeds the
      # eight real mouse-gut read pairs as a real order/study, then runs fastqc + fastq-checksum
      # (order-scoped) and reads-qc + study-demo-report (study-scoped) on them. The per-process conda
      # envs (fastqc/seqkit) were already warmed into the shared cache by the dummy fastqc/reads-qc
      # steps above, so the SLURM runs here reuse them by hash (same data-independent env hash).
      # Resilient by design: the QOS submit slot is freed before each pipeline, one pipeline failing
      # never aborts the rest, and reports are always collected into the workflow artifact.
      - name: Run public pipelines on REAL mouse-gut data (PRJDB6165) — opt-in
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mouse_real_data == true }}
        continue-on-error: true
        env:
          SEQDESK_RUNTIME_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_RUNTIME_E2E_EMAIL: admin@example.com
          SEQDESK_RUNTIME_E2E_PASSWORD: admin
        run: |
          # NOTE: intentionally NO `set -e` — a single pipeline failing (e.g. a transient SLURM
          # QOS rejection) must NOT abort the step before reports are collected and pushed.
          set -uo pipefail
          MOUSE_REPORTS_DIR="$RUNNER_TEMP/mouse-gut-reports"
          mkdir -p "$MOUSE_REPORTS_DIR"
          echo "MOUSE_REPORTS_DIR=$MOUSE_REPORTS_DIR" >> "$GITHUB_ENV"
          ORDER="DEV-MOUSE-PRJDB6165-001"
          STUDY_ALIAS="mouse-gut-prjdb6165-ci"
          ME="$(whoami)"
          FAILS=""

          # This cluster caps concurrent SLURM submissions per user (QOS MaxSubmitJobPerUser=1):
          # a job still PENDING/RUNNING from the previous mouse pipeline makes the next sbatch fail
          # with QOSMaxSubmitJobPerUserLimit (the reads-qc failure in run 28405692814). Before each
          # pipeline, cancel only jobs resolved from this CI run's database and
          # verified against its run root. The shared account may own other
          # SeqDesk work, so a job-name prefix alone is never sufficient.
          free_qos_slot() {
            source "$SEQDESK_CI_CLEANUP_HELPER"
            seqdesk_ci_cancel_pipeline_runs "$DB_NAME" "$SEQDESK_RUN_DIR"
          }

          # Resilient: each pipeline runs local + SLURM; the LOCAL run (head node, no sbatch) always
          # produces the report, so even if the SLURM submission is rejected we still get the report.
          # Failures are recorded, never fatal.
          run_mouse() {
            local label="$1"; shift
            free_qos_slot
            echo "::group::mouse-gut pipeline: $label"
            if npm run pipeline:e2e:runtime -- "$@" 2>&1 | tee "$RUNNER_TEMP/mouse-$label-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"; then
              echo "mouse $label: OK"
            else
              echo "mouse $label: FAILED (continuing — local report may still exist)"; FAILS="$FAILS $label"
            fi
            echo "::endgroup::"
          }

          # Seed ONCE on the first run (the harness re-downloads on every --seed-example-dataset, so
          # passing it on all four would re-fetch the ~130 MB four times). --set-data-base-path
          # points the bundle extractor at the shared FS the compute nodes see and persists in
          # SiteSettings; --seed-example-dataset downloads the 8 ENA pairs and creates the order/study.
          run_mouse fastq-checksum    --set-data-base-path "$SEQDESK_DATA_DIR" \
            --seed-example-dataset mouse-gut-prjdb6165 --pipeline-id fastq-checksum --order-number "$ORDER"
          run_mouse fastqc            --pipeline-id fastqc            --order-number "$ORDER"
          run_mouse reads-qc          --pipeline-id reads-qc          --study-alias "$STUDY_ALIAS"
          run_mouse study-demo-report --pipeline-id study-demo-report --study-alias "$STUDY_ALIAS"

          # Collect the human-readable report outputs (HTML/TSV/CSV/TXT) from the mouse run dirs;
          # skip the heavy nextflow `work/` intermediates. Each file is renamed by its run-relative
          # path so per-pipeline outputs don't collide on basename. Runs unconditionally.
          echo "=== collecting mouse-gut reports ==="
          find "$SEQDESK_RUN_DIR" -type d -path '*/work' -prune -o \
            -type f \( -iname '*.html' -o -iname '*.tsv' -o -iname '*.csv' -o -iname '*.txt' \) -print 2>/dev/null \
            | while IFS= read -r f; do
                rel="${f#"$SEQDESK_RUN_DIR"/}"
                safe="$(printf '%s' "$rel" | tr '/' '__')"
                cp "$f" "$MOUSE_REPORTS_DIR/$safe" 2>/dev/null || true
              done
          NFILES="$(find "$MOUSE_REPORTS_DIR" -type f | wc -l | tr -d ' ')"
          echo "collected $NFILES report file(s):"
          find "$MOUSE_REPORTS_DIR" -type f -printf '  %f\n' 2>/dev/null | sort | head -120

          if [ "$NFILES" -gt 0 ]; then
            printf 'Mouse-gut (PRJDB6165) real pipeline reports\nrun=%s attempt=%s\nfailed_pipelines=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${FAILS:- none}" > "$MOUSE_REPORTS_DIR/RUN_INFO.txt"
            echo "mouse reports staged for the workflow artifact"
          else
            echo "WARN: no reports collected"
          fi
          echo "mouse pipelines that failed:${FAILS:- none}"
          # Opt-in/experimental: never red the whole job on a mouse-data hiccup.
          exit 0

      # ── Opt-in: kraken2-bracken taxonomic profiling on the REAL human-gut shotgun study ──
      # Runs the new kraken2-bracken pipeline on the 12 real PRJEB54724 read pairs against the
      # runner's Standard kraken2 DB (~12 GB; the head node has ~62 GB RAM so LOCAL mode is fine —
      # KRAKEN2 is capped to maxForks 1 / 16 GB in the package). The DB already ships the Bracken
      # kmer distributions (database150mers.kmer_distrib), so no bracken-build is needed. Collects
      # the Kraken2 report + Bracken abundance + Krona HTML into the workflow artifact.
      - name: Run kraken2-bracken on the REAL human-gut shotgun study (taxonomy → demo, opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_human_gut_kraken == true }}
        continue-on-error: true
        env:
          SEQDESK_RUNTIME_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_RUNTIME_E2E_EMAIL: admin@example.com
          SEQDESK_RUNTIME_E2E_PASSWORD: admin
          KRAKEN2_DB: ${{ vars.SLURM_SHARED_KRAKEN2_DB || '/net/broker/checkm_refdata/kraken2_db' }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/kraken-output"; mkdir -p "$OUT"
          echo "kraken2 DB: $KRAKEN2_DB"
          ls -la "$KRAKEN2_DB"/*.k2d "$KRAKEN2_DB"/database150mers.kmer_distrib 2>/dev/null | head
          # Seed the real human-gut reads (idempotent download) + run kraken2-bracken LOCAL on the
          # human-gut CI order (the harness treats kraken2-bracken as order-scoped). kraken2Db +
          # bracken read length come via --config-json (the read-cleaning pattern).
          if npm run pipeline:e2e:runtime -- \
              --set-data-base-path "$SEQDESK_DATA_DIR" \
              --seed-example-dataset human-gut-prjeb54724 \
              --pipeline-id kraken2-bracken \
              --order-number DEV-HUMAN-PRJEB54724-001 \
              --config-json "{\"kraken2Db\":\"$KRAKEN2_DB\",\"brackenReadLength\":150,\"brackenLevel\":\"S\",\"krona\":true}" \
              --skip-slurm \
              2>&1 | tee "$RUNNER_TEMP/kraken-e2e.log"; then
            echo "kraken2-bracken: OK"
          else
            echo "kraken2-bracken: FAILED (see log)"
          fi
          # Collect the taxonomy outputs (skip nextflow work/ intermediates).
          find "$SEQDESK_RUN_DIR" -type d -path '*/work' -prune -o \
            -type f \( -iname '*.kraken2.report.txt' -o -iname '*.bracken.tsv' -o -iname '*.bracken.report.txt' \
                       -o -iname '*.krona.html' -o -iname '*kraken*summary*' -o -iname '*bracken*summary*' \) -print 2>/dev/null \
            | while IFS= read -r f; do
                rel="${f#"$SEQDESK_RUN_DIR"/}"; safe="$(printf '%s' "$rel" | tr '/' '__')"
                cp "$f" "$OUT/$safe" 2>/dev/null || true
              done
          NFILES="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          echo "collected $NFILES kraken/bracken/krona file(s):"
          find "$OUT" -type f -printf '  %f\n' 2>/dev/null | sort | head -60
          if [ "$NFILES" -gt 0 ]; then
            printf 'Human-gut (PRJEB54724) kraken2-bracken taxonomy output\nrun=%s attempt=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$OUT/RUN_INFO.txt"
            echo "kraken/bracken reports staged for the workflow artifact"
          else
            echo "WARN: no kraken output collected"
          fi
          exit 0

      # read-cleaning UNDER SLURM (source-boot, local + SLURM). The LOCAL run builds detaxizer's
      # conda env into the shared cache on the networked head node; the SLURM run reuses it by
      # hash on the network-less compute node (the fastqc mechanism above). Heavy: detaxizer
      # loads a ~20 GB kraken2 DB into RAM, so this step right-sizes the SLURM request (the
      # job-wide 1G/1h is for the light smokes) and packs the staged DB dir into a cached
      # .tar (detaxizer untars --kraken2db). Seeds the spiked raw dataset (30 human-mt + 30
      # E. coli reads/sample) and asserts host reads are removed + microbes retained
      # (SEQDESK_RUNTIME_E2E_RC_SPIKE_CHECK). This remains an optional extension because the
      # external DB and sufficiently large nodes are not guaranteed. When prerequisites exist,
      # failures are surfaced as a warning result rather than swallowed inside a green step.
      - name: Run read-cleaning E2E (local + SLURM, contamination removal) — optional
        # Keep the change-driven gate bounded: this extension can consume more
        # than an hour before the required fresh-install proof even starts.
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          SEQDESK_RUNTIME_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_RUNTIME_E2E_EMAIL: admin@example.com
          SEQDESK_RUNTIME_E2E_PASSWORD: admin
          SEQDESK_RUNTIME_E2E_RC_SPIKE_CHECK: "1"
          SLURM_SHARED_KRAKEN2_DB: ${{ vars.SLURM_SHARED_KRAKEN2_DB || '/net/broker/checkm_refdata/kraken2_db' }}
        run: |
          set -euo pipefail
          if [ ! -r "${SEQDESK_CI_CLEANUP_HELPER:-}" ]; then
            echo "Required run-scoped cleanup helper is unavailable." >&2
            exit 1
          fi
          source "$SEQDESK_CI_CLEANUP_HELPER"
          DB="$SLURM_SHARED_KRAKEN2_DB"
          if [ ! -e "$DB" ]; then echo "kraken2 DB absent at '$DB' — skipping read-cleaning SLURM (warn)."; exit 0; fi
          # detaxizer untars --kraken2db, so pack the staged DB dir into a cached .tar on the
          # shared FS (the compute node reads it). Idempotent across runs.
          RC_INPUT="$DB"
          if [ -d "$DB" ]; then
            CACHE="$(dirname "$SEQDESK_DATA_DIR")/seqdesk-kraken2-cache"; mkdir -p "$CACHE"
            RC_INPUT="$CACHE/$(basename "$DB").tar"
            [ -s "$RC_INPUT" ] || tar -cf "$RC_INPUT" -C "$(dirname "$DB")" "$(basename "$DB")"
            echo "read-cleaning: kraken2Db dir -> $RC_INPUT ($(du -sh "$RC_INPUT" 2>/dev/null | cut -f1 || echo '?'))"
          fi
          # Right-size the SLURM request to what the cpu partition actually offers (the 20 GB DB
          # loads into RAM). Skip cleanly if the nodes are too small or sinfo is unavailable.
          MAXMEM_MB=$(sinfo -h -p cpu -o "%m" 2>/dev/null | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          echo "cpu partition max node memory: ${MAXMEM_MB:-unknown} MB"
          if [ -z "${MAXMEM_MB:-}" ] || [ "$MAXMEM_MB" -lt 24000 ]; then
            echo "read-cleaning SLURM: nodes <24 GB or sinfo unavailable — skipping (warn)."; exit 0
          fi
          if [ "$MAXMEM_MB" -gt 36000 ]; then REQ_MB=32000; else REQ_MB=$((MAXMEM_MB - 4000)); fi
          export SEQDESK_RUNTIME_E2E_SLURM_MEMORY="${REQ_MB}M"
          export SEQDESK_RUNTIME_E2E_SLURM_TIME_LIMIT="2"
          export SEQDESK_RUNTIME_E2E_SLURM_CORES="2"
          echo "read-cleaning SLURM request: mem=${REQ_MB}M cores=2 time=2h"
          # Shared conda cache (derive from SEQDESK_DATA_DIR, which IS in this step's env).
          CACHE_DIR="$(dirname "$(dirname "$SEQDESK_DATA_DIR")")/conda-cache"
          echo "conda cache dir: $CACHE_DIR ($([ -d "$CACHE_DIR" ] && echo exists || echo MISSING))"
          RC_JSON="{\"kraken2Db\":\"$RC_INPUT\",\"classificationKraken2\":true,\"tax2filter\":\"Homo sapiens\"}"
          # The SLURM run uses the INLINE executor (processes run via Nextflow's local executor on an
          # OFFLINE compute node that can only REUSE cached conda envs, never BUILD them). So build
          # detaxizer's per-process envs on the ONLINE head node first via a --skip-slurm warm-up;
          # the --skip-local SLURM pass then reuses them by hash.
          #
          # Pitfall: Nextflow reuses ANY cached env dir WITHOUT validating it, so an env left a STUB
          # by a prior interrupted build (e.g. python with no dnaio) is reused forever and the rename
          # step fails "No module named 'dnaio'". Env hashes change with conda config so we can't
          # hardcode them — instead: run the warm-up; if it fails, find the broken env from the
          # FAILED task's own .command.run, delete it, and retry so Nextflow rebuilds it complete.
          rc_warmup() {
            npm run pipeline:e2e:runtime -- \
              --set-data-base-path "$SEQDESK_DATA_DIR" --seed-example-dataset read-cleaning-spike \
              --pipeline-id read-cleaning --order-number DEV-RC-SPIKE-001 \
              --config-json "$RC_JSON" --timeout 2400 --skip-slurm \
              2>&1 | tee "$RUNNER_TEMP/read-cleaning-local-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
            return "${PIPESTATUS[0]}"
          }
          rc_heal_broken_envs() {
            local rcdir task_script run env removed
            rcdir="$(find "$SEQDESK_RUN_DIR" -maxdepth 1 -type d -name 'READ-CLEANING-*' 2>/dev/null | tail -1)"
            if [ -z "$rcdir" ]; then echo "heal: no read-cleaning run dir found"; return 0; fi
            removed=0
            # An interrupted Nextflow Conda solve may leave an env directory but
            # no .exitcode. Inspect generated task scripts, but only heal the
            # RENAME_FASTQ_HEADERS/dnaio task: other detaxizer processes use
            # legitimate isolated envs that are not supposed to contain dnaio.
            while IFS= read -r -d '' task_script; do
              if ! grep -qiE 'dnaio|rename[_-]?fastq[_-]?headers' "$task_script" 2>/dev/null; then
                continue
              fi
              run="$(dirname "$task_script")/.command.run"
              env="$(grep -oE "$CACHE_DIR/env-[a-f0-9]+" "$run" 2>/dev/null | head -1)"
              if [ -n "$env" ] && [ -d "$env" ] && \
                 { [ ! -x "$env/bin/python" ] || ! "$env/bin/python" -c "import dnaio" >/dev/null 2>&1; }; then
                echo "heal: removing incomplete read-cleaning Conda env $env"
                rm -rf "$env"
                removed=$((removed + 1))
              fi
            done < <(find "$rcdir/work" -type f -name '.command.sh' -print0 2>/dev/null)
            echo "heal: removed $removed incomplete read-cleaning env(s)"
            return 0
          }
          echo "::group::read-cleaning LOCAL warm-up — builds detaxizer's conda envs on the head node"
          if ! rc_warmup; then
            echo "warm-up failed — healing broken dnaio env(s) from the failed tasks, then retrying"
            rc_heal_broken_envs
            rc_warmup
          fi
          echo "::endgroup::"
          # SLURM-executor pass (best-effort). Reuses the head-node-built envs on the compute node to
          # exercise the real SLURM path. This cluster caps concurrent submissions per user (QOS
          # MaxSubmitJobPerUser): a job left PENDING here holds that slot and makes the next SLURM
          # step fail to submit (QOSMaxSubmitJobPerUserLimit). So cap the wait, tolerate non-completion,
          # then cancel ONLY the exact PipelineRun/job this pass started to free the slot. The
          # warm-up above is the authoritative spike proof; this just confirms the SLURM path when
          # the partition is free.
          RC_STATE_FILE="$RUNNER_TEMP/read-cleaning-slurm-state-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          rm -f "$RC_STATE_FILE"
          set +e
          npm run pipeline:e2e:runtime -- \
            --set-data-base-path "$SEQDESK_DATA_DIR" \
            --seed-example-dataset read-cleaning-spike \
            --pipeline-id read-cleaning \
            --order-number DEV-RC-SPIKE-001 \
            --config-json "$RC_JSON" \
            --timeout 1200 \
            --skip-local \
            --run-state-file "$RC_STATE_FILE" \
            2>&1 | tee "$RUNNER_TEMP/read-cleaning-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          slurm_rc=${PIPESTATUS[0]}
          set -e
          # The harness writes this identity immediately after create/start, before
          # polling. Cross-check it against the exact PipelineRun row, then require
          # the standard SeqDesk job-name + run-root ownership proof before scancel.
          if [ -s "$RC_STATE_FILE" ]; then
            mapfile -t RC_IDENTITY < <(node -e '
              const fs = require("node:fs");
              const state = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(`${state.runId || ""}\n${state.jobId || ""}\n`);
            ' "$RC_STATE_FILE")
            RC_RUN_ID="${RC_IDENTITY[0]:-}"
            RC_JOB_ID="${RC_IDENTITY[1]:-}"
            if [[ ! "$RC_RUN_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "ERROR: read-cleaning state file has an invalid PipelineRun id." >&2
              slurm_rc=1
              RC_JOB_ID=""
            else
              RC_DB_ROW="$(PGPASSWORD="${DB_PASSWORD:-seqdesk}" psql \
                -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" \
                -U "${DB_USER:-seqdesk}" -d "$DB_NAME" -At -F '|' \
                -c "select coalesce(\"queueJobId\", ''), coalesce(\"runFolder\", ''), \"pipelineId\", coalesce(\"executionMode\", '') from \"PipelineRun\" where id='$RC_RUN_ID'" \
                2>/dev/null || true)"
              IFS='|' read -r RC_DB_JOB_ID RC_DB_RUN_FOLDER RC_DB_PIPELINE_ID RC_DB_MODE <<< "$RC_DB_ROW"
              if [ "$RC_DB_PIPELINE_ID" != "read-cleaning" ] ||
                 [ "$RC_DB_MODE" != "slurm" ] ||
                 [[ "$RC_DB_RUN_FOLDER" != "$SEQDESK_RUN_DIR/"* ]] ||
                 [[ ! "$RC_DB_JOB_ID" =~ ^[0-9]+$ ]] ||
                 { [ -n "$RC_JOB_ID" ] && [ "$RC_JOB_ID" != "$RC_DB_JOB_ID" ]; }; then
                echo "ERROR: refusing read-cleaning cleanup; captured run/job identity does not match its scoped PipelineRun row." >&2
                slurm_rc=1
                RC_JOB_ID=""
              else
                RC_JOB_ID="$RC_DB_JOB_ID"
              fi
            fi
          else
            echo "ERROR: read-cleaning runtime did not capture its PipelineRun/job identity." >&2
            slurm_rc=1
            RC_JOB_ID=""
          fi
          if [ -n "${RC_JOB_ID:-}" ]; then
            RC_JOB_STATE="$(seqdesk_ci_slurm_job_state "$RC_JOB_ID")"
            if [ "$RC_JOB_STATE" = "active" ]; then
              RC_IDENTITY_STATE="$(seqdesk_ci_slurm_job_identity_state \
                "$RC_JOB_ID" "$RC_DB_RUN_FOLDER" "seqdesk-$RC_RUN_ID")"
              if [ "$RC_IDENTITY_STATE" != "matches" ]; then
                echo "ERROR: refusing to cancel read-cleaning job $RC_JOB_ID; identity=$RC_IDENTITY_STATE." >&2
                slurm_rc=1
              else
                echo "freeing QOS slot — cancelling scoped read-cleaning PipelineRun $RC_RUN_ID job $RC_JOB_ID"
                scancel "$RC_JOB_ID" 2>/dev/null || slurm_rc=1
              fi
              for _ in $(seq 1 12); do
                RC_JOB_STATE="$(seqdesk_ci_slurm_job_state "$RC_JOB_ID")"
                [ "$RC_JOB_STATE" = "inactive" ] && break
                if [ "$RC_JOB_STATE" = "unknown" ]; then
                  echo "ERROR: read-cleaning job $RC_JOB_ID state became unknown during cancellation." >&2
                  slurm_rc=1
                  break
                fi
                sleep 5
              done
              RC_JOB_STATE="$(seqdesk_ci_slurm_job_state "$RC_JOB_ID")"
              if [ "$RC_JOB_STATE" != "inactive" ]; then
                echo "ERROR: scoped read-cleaning job $RC_JOB_ID final state is $RC_JOB_STATE after cancellation." >&2
                slurm_rc=1
              fi
            elif [ "$RC_JOB_STATE" = "unknown" ]; then
              echo "ERROR: read-cleaning job $RC_JOB_ID state is unknown; preserving its run tree." >&2
              slurm_rc=1
            fi
          fi
          if [ "$slurm_rc" != "0" ]; then
            echo "read-cleaning SLURM pass failed or timed out (exit $slurm_rc)." >&2
            exit "$slurm_rc"
          fi

      - name: Run SLURM-only pipeline smoke through the app
        env:
          SEQDESK_SLURM_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_SLURM_E2E_EMAIL: admin@example.com
          SEQDESK_SLURM_E2E_PASSWORD: admin
        run: |
          set -euo pipefail
          npm run pipeline:e2e:slurm 2>&1 | tee "$SLURM_E2E_LOG"

      - name: Run SLURM failure-path E2E through the app
        env:
          SEQDESK_SLURM_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_SLURM_E2E_EMAIL: admin@example.com
          SEQDESK_SLURM_E2E_PASSWORD: admin
        run: |
          set -euo pipefail
          # Deliberately runs a SLURM job that FAILS (missing FASTQ) to prove SeqDesk
          # reconciles the run to status=failed in the DB. The expected FAILED job in
          # sacct below is therefore intentional, not a regression. Runs after the
          # success smokes; the script restores the moved FASTQs in a finally block,
          # and the data dir is per-run and wiped in cleanup either way.
          npm run pipeline:e2e:slurm-failure 2>&1 | tee "$FAILURE_E2E_LOG"

      - name: Run SLURM cancel/stop E2E through the app
        env:
          SEQDESK_SLURM_E2E_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_SLURM_E2E_EMAIL: admin@example.com
          SEQDESK_SLURM_E2E_PASSWORD: admin
        run: |
          set -euo pipefail
          # Starts a SLURM run and immediately cancels it (DELETE -> scancel), asserting
          # the run reconciles to status=cancelled and the SLURM job is gone. The
          # expected CANCELLED job in sacct below is intentional.
          npm run pipeline:e2e:slurm-cancel 2>&1 | tee "$CANCEL_E2E_LOG"

      # --- App-behaviour checks (ordered after the proven pipeline steps) ---

      - name: Run pipeline no-data validation E2E
        env:
          SEQDESK_APPCHECK_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_APPCHECK_EMAIL: admin@example.com
          SEQDESK_APPCHECK_PASSWORD: admin
        run: |
          set -euo pipefail
          # Creates a throwaway DRAFT order with a read-less sample, then proves that
          # starting a run on it is rejected with a clean validation error (4xx, not a
          # 500/crash). Pure HTTP — no SLURM, no pipeline execution. Cleans up the order.
          echo "===== appcheck: nodata =====" | tee "$APPCHECK_E2E_LOG"
          npm run pipeline:e2e:appcheck -- --check nodata 2>&1 | tee -a "$APPCHECK_E2E_LOG"

      - name: Run pipeline access E2E (notifications + permissions)
        env:
          SEQDESK_APPCHECK_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_APPCHECK_EMAIL: admin@example.com
          SEQDESK_APPCHECK_PASSWORD: admin
        run: |
          set -euo pipefail
          # Runs a fast LOCAL fastq-checksum run to completion, then asserts (a) a
          # 'pipeline.completed' in-app notification fired, and (b) a non-admin
          # researcher cannot read/cancel the admin's run (403) and anonymous is 401.
          echo "===== appcheck: access =====" | tee -a "$APPCHECK_E2E_LOG"
          npm run pipeline:e2e:appcheck -- --check access 2>&1 | tee -a "$APPCHECK_E2E_LOG"

      - name: Run SLURM stuck-run reconciliation E2E
        env:
          SEQDESK_APPCHECK_BASE_URL: http://127.0.0.1:${{ env.PORT }}
          SEQDESK_APPCHECK_EMAIL: admin@example.com
          SEQDESK_APPCHECK_PASSWORD: admin
        run: |
          set -euo pipefail
          # Starts a SLURM run, lets it reach running/queued, then scancels the job OUT
          # OF BAND (behind the app's back) and asserts /sync reconciles the vanished job
          # to a terminal status instead of leaving it wedged (the 99%-stuck regression).
          # The expected CANCELLED job in sacct is intentional.
          echo "===== appcheck: stuck =====" | tee -a "$APPCHECK_E2E_LOG"
          npm run pipeline:e2e:appcheck -- --check stuck 2>&1 | tee -a "$APPCHECK_E2E_LOG"

      - name: SLURM shared-filesystem canary (diagnostic)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          set +e
          if ! command -v sbatch >/dev/null 2>&1; then echo "sbatch unavailable; skip canary"; exit 0; fi
          if [ ! -r "${SEQDESK_CI_CLEANUP_HELPER:-}" ]; then
            echo "run-scoped cleanup helper unavailable; refusing canary submission" >&2
            exit 1
          fi
          source "$SEQDESK_CI_CLEANUP_HELPER"
          CANARY_SUFFIX="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CANARY_JOB_NAME="seqdesk-canary-$CANARY_SUFFIX"
          WORK_DIR="$SEQDESK_RUN_DIR/_canary-$CANARY_SUFFIX"
          HOME_DIR="$HOME/seqdesk-ci-canary-$CANARY_SUFFIX"
          JID=""
          cleanup_canary() {
            local original_rc=$?
            local job_id="${JID%%;*}"
            local cleanup_rc=0
            local job_state identity_state
            trap - EXIT
            if [ -n "$job_id" ]; then
              job_state="$(seqdesk_ci_slurm_job_state "$job_id")"
              if [ "$job_state" = "active" ]; then
                identity_state="$(seqdesk_ci_slurm_job_identity_state \
                  "$job_id" "$HOME_DIR" "$CANARY_JOB_NAME")"
                if [ "$identity_state" = "matches" ]; then
                  echo "canary still active after the diagnostic window; cancelling owned allocation $job_id"
                  scancel "$job_id" >/dev/null 2>&1 || cleanup_rc=1
                else
                  job_state="$(seqdesk_ci_slurm_job_state "$job_id")"
                  if [ "$job_state" = "inactive" ]; then
                    echo "canary allocation $job_id exited before cleanup could signal it"
                  else
                    echo "ERROR: refusing canary scancel for $job_id; queue state=$job_state identity=$identity_state." >&2
                    cleanup_rc=1
                  fi
                fi
                if [ "$cleanup_rc" = 0 ]; then
                  for _ in $(seq 1 24); do
                    job_state="$(seqdesk_ci_slurm_job_state "$job_id")"
                    [ "$job_state" = "inactive" ] && break
                    if [ "$job_state" = "unknown" ]; then
                      cleanup_rc=1
                      break
                    fi
                    sleep 5
                  done
                fi
              elif [ "$job_state" = "unknown" ]; then
                echo "ERROR: canary allocation $job_id queue state is unknown." >&2
                cleanup_rc=1
              fi
              job_state="$(seqdesk_ci_slurm_job_state "$job_id")"
              if [ "$job_state" != "inactive" ]; then
                echo "ERROR: canary allocation $job_id final state is $job_state; cleanup was not verified." >&2
                cleanup_rc=1
              fi
            fi
            if [ "$cleanup_rc" = 0 ]; then
              rm -rf "$HOME_DIR"
            else
              echo "SEQDESK_CANARY_CLEANUP_FAILED=1" >> "$GITHUB_ENV"
              echo "ERROR: preserving canary paths $HOME_DIR and $WORK_DIR." >&2
            fi
            if [ "$original_rc" -ne 0 ]; then
              exit "$original_rc"
            fi
            exit "$cleanup_rc"
          }
          trap cleanup_canary EXIT
          rm -rf "$WORK_DIR" "$HOME_DIR"; mkdir -p "$WORK_DIR" "$HOME_DIR"
          echo "head wrote work $(date)" > "$WORK_DIR/head-marker.txt"
          echo "head wrote home $(date)" > "$HOME_DIR/head-marker.txt"
          # Run slurmd's --output under $HOME (likely shared+writable) so the probe
          # results survive even when the _work run dir is not usable on the node.
          # The probe reports df/mount for both trees and tries read/write on each.
          JID=$(sbatch --parsable --job-name="$CANARY_JOB_NAME" \
            -p cpu -c 1 --mem=200M -t 5:00 -D "$HOME_DIR" \
            --output="$HOME_DIR/canary-%j.out" --error="$HOME_DIR/canary-%j.err" \
            --wrap "set +e; echo node=\$(hostname); echo '--- df WORK ---'; df -hP '$WORK_DIR' 2>&1; echo '--- df HOME ---'; df -hP '$HOME_DIR' 2>&1; echo '--- mounts ---'; mount 2>/dev/null | grep -E ' nfs|on /home|_work' | head; echo '--- read _work marker? ---'; cat '$WORK_DIR/head-marker.txt' 2>&1; echo '--- write _work? ---'; (echo x > '$WORK_DIR/node-write' && echo WORK-WRITE-OK || echo WORK-WRITE-FAIL) 2>&1; echo '--- write HOME? ---'; (echo x > '$HOME_DIR/node-write' && echo HOME-WRITE-OK || echo HOME-WRITE-FAIL) 2>&1; echo '--- pipeline conda env nextflow? ---'; '$PIPELINE_CONDA_ENV/bin/nextflow' -version 2>&1 | head -3")
          submit_rc=$?
          if [ "$submit_rc" -ne 0 ] || [ -z "$JID" ]; then
            echo "canary submission failed; diagnostic skipped"
            exit 0
          fi
          echo "canary job id: $JID"
          for _ in $(seq 1 90); do
            st=$(sacct -j "${JID%%;*}" --noheader -o State -P 2>/dev/null | head -1)
            case "$st" in *COMPLETED*|*FAILED*|*CANCEL*|*TIMEOUT*|*OUT_OF*) echo "canary final state: $st"; break;; esac
            sleep 2
          done
          echo "===== canary STDOUT (written by the node to \$HOME) ====="; cat "$HOME_DIR"/canary-*.out 2>&1
          echo "===== canary STDERR ====="; cat "$HOME_DIR"/canary-*.err 2>&1
          echo "===== node-write probes that landed back on the head node ====="
          echo "  _work/node-write: $(cat "$WORK_DIR/node-write" 2>&1)"
          echo "  HOME/node-write:  $(cat "$HOME_DIR/node-write" 2>&1)"
          echo "===== sacct (canary) ====="; sacct -j "${JID%%;*}" -o JobID,State,ExitCode,NodeList 2>&1
          true

      - name: Stop SeqDesk app
        if: always()
        run: |
          set +e
          cleanup_fail=0
          if [ ! -r "${SEQDESK_CI_CLEANUP_HELPER:-}" ]; then
            echo "ERROR: run-scoped cleanup helper is unavailable." >&2
            cleanup_fail=1
          else
            # Cancel and wait for source-app jobs before the installed-app gate.
            # This frees the single-job QOS slot and prevents either app from
            # writing into a run tree that the other gate later removes.
            source "$SEQDESK_CI_CLEANUP_HELPER"
            seqdesk_ci_cancel_pipeline_runs "${DB_NAME:-}" "${SEQDESK_RUN_DIR:-}" || cleanup_fail=1
            if seqdesk_ci_stop_child "${APP_PID:-}" "source SeqDesk app" "$GITHUB_WORKSPACE"; then
              echo "APP_PID=" >> "$GITHUB_ENV"
            else
              cleanup_fail=1
            fi
            seqdesk_ci_stop_monitors "$GITHUB_WORKSPACE" || cleanup_fail=1
          fi
          exit "$cleanup_fail"

      # PROOF: a REAL INSTALL can run a SLURM pipeline and write results back to the DB —
      # "install SeqDesk, then run a SLURM job through that installed instance". Reuses this
      # job's shared FS + prebuilt conda env + SLURM_SHARED_* + inline executor, installing
      # via the npm launcher + a mock release server (the Alma E2E pattern). Runs after the
      # source-boot app is stopped (one app per DB). This is a required acceptance gate:
      # a green workflow means the candidate was installed, booted, authenticated, and
      # executed pipelines in local and real outer-SLURM modes through that installation.
      - name: Install SeqDesk + run pipelines on the installed app (required)
        # Run independently so diagnostics include installability even if a source-boot
        # assertion failed. Without continue-on-error, any install/pipeline failure still
        # makes the canonical workflow fail.
        if: ${{ always() && !cancelled() }}
        env:
          # Pinned into the install profile as read-cleaning's MANAGED kraken2 DB (same default
          # + override as the source-boot read-cleaning step). Empty/absent → the profile omits
          # it and the read-cleaning full run stays gated on a raw dataset.
          SLURM_SHARED_KRAKEN2_DB: ${{ vars.SLURM_SHARED_KRAKEN2_DB || '/net/broker/checkm_refdata/kraken2_db' }}
        run: |
          set -euo pipefail
          export PATH="$SEQDESK_NODE_BIN:$PATH"
          if [ "${SEQDESK_CANARY_CLEANUP_FAILED:-0}" = "1" ]; then
            echo "A canary allocation survived cleanup; refusing to overlap it with the installed-app gate." >&2
            exit 1
          fi
          # `always()` intentionally lets this independent install proof run
          # after a source assertion fails, but never let it overlap surviving
          # source jobs/processes. Re-run the ownership-checked drain here and
          # require success before creating the second app/database.
          if [ ! -r "${SEQDESK_CI_CLEANUP_HELPER:-}" ]; then
            echo "Required run-scoped cleanup helper is unavailable." >&2
            exit 1
          fi
          source "$SEQDESK_CI_CLEANUP_HELPER"
          seqdesk_ci_cancel_pipeline_runs "$DB_NAME" "$SEQDESK_RUN_DIR"
          seqdesk_ci_stop_child "${APP_PID:-}" "source SeqDesk app" "$GITHUB_WORKSPACE"
          seqdesk_ci_stop_monitors "$GITHUB_WORKSPACE"
          echo "APP_PID=" >> "$GITHUB_ENV"
          if [ "$(node -p 'process.versions.node.split(".")[0]')" != "24" ]; then
            echo "Installed-app gate requires Node 24; PATH resolved $(node --version) at $(command -v node)." >&2
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          # The installer's preflight needs ~2G free at --dir, but $RUNNER_TEMP is on /home
          # (only ~1G on this runner), so root the work area on the shared run FS that already
          # holds the pipeline run/data dirs. The trap stashes the small logs into slurm-diag
          # (uploaded as an artifact) and frees the heavy dirs — app node_modules/.next, the
          # npm cache, the installed data/run trees — on every exit path (these live on the
          # shared FS, which isn't auto-reclaimed between jobs like $RUNNER_TEMP is).
          WORK="${SLURM_SHARED_RUN_ROOT:-$RUNNER_TEMP}/install-slurm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          APP_DIR="$WORK/app"; MOCK_ROOT="$WORK/mock"; NPM_PREFIX="$WORK/npm-prefix"
          INSTALLED_CONDA_CACHE="$WORK/conda-cache"
          INSTALLED_PORT=$((PORT + 1)); MOCK_PORT=$((PORT + 2))
          INSTALLED_DATA="$SEQDESK_DATA_DIR-installed"; INSTALLED_RUNS="$SEQDESK_RUN_DIR-installed"
          DIAG_OUT="$RUNNER_TEMP/slurm-diag"
          # A real install owns its database. Sharing the source-boot DB makes the installed
          # app's --ensure-dummy-data short-circuit (the order already exists) and then resolve
          # reads against a data dir where the FASTQs were never written. Give it a fresh DB on
          # the same ephemeral Postgres; the install migrates + seeds it, and dummy data then
          # lands in $INSTALLED_DATA consistently.
          INSTALLED_DB_NAME="${DB_NAME}_installed"
          INSTALLED_DB_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${INSTALLED_DB_NAME}?schema=public"
          if [ ! -r "${SEQDESK_CI_CLEANUP_HELPER:-}" ]; then
            echo "Run-scoped cleanup helper is unavailable." >&2
            exit 1
          fi
          source "$SEQDESK_CI_CLEANUP_HELPER"
          rm -rf "$WORK"
          mkdir -p "$MOCK_ROOT/api" "$MOCK_ROOT/downloads" "$INSTALLED_DATA" "$INSTALLED_RUNS" "$NPM_PREFIX" "$INSTALLED_CONDA_CACHE" "$DIAG_OUT"
          cleanup_install_slurm() {
            local original_rc=$?
            local cleanup_rc=0
            local pipeline_cleanup_rc=0
            local pid
            trap - EXIT
            set +e
            # Stop every pipeline allocation/process owned by this temporary
            # installed database before removing its run tree. Runtime clients
            # can time out while their detached local process or SLURM job lives.
            seqdesk_ci_cancel_pipeline_runs "$INSTALLED_DB_NAME" "$INSTALLED_RUNS" \
              || { cleanup_rc=1; pipeline_cleanup_rc=1; }
            seqdesk_ci_stop_child "${INSTALLED_APP_PID:-}" "installed SeqDesk app" "${APP_DIR:-}" \
              || { cleanup_rc=1; pipeline_cleanup_rc=1; }
            seqdesk_ci_stop_child "${MOCK_PID:-}" "mock release server" "${MOCK_ROOT:-}" \
              || { cleanup_rc=1; pipeline_cleanup_rc=1; }
            # The app can spawn detached monitors that outlive the parent PID.
            # Scope cleanup to this one install tree so no other SeqDesk install
            # or runner process is affected.
            seqdesk_ci_stop_monitors "${APP_DIR:-}" \
              || { cleanup_rc=1; pipeline_cleanup_rc=1; }
            for f in "$WORK"/install*.log "$WORK"/server.log "$WORK"/mock.log; do
              [ -f "$f" ] && cp "$f" "$DIAG_OUT/installslurm-$(basename "$f")" 2>/dev/null || true
            done
            if [ -d "$INSTALLED_RUNS" ]; then
              INSTALLED_LOGS="$DIAG_OUT/installed-run-logs"
              mkdir -p "$INSTALLED_LOGS"
              find "$INSTALLED_RUNS" -type f \( \
                   -name 'pipeline.out' -o -name 'pipeline.err' \
                -o -name 'slurm-*.out' -o -name 'slurm-*.err' \
                -o -name '.nextflow.log*' -o -name 'run.sh' -o -name 'trace.txt' \
                -o -name '.command.err' -o -name '.command.log' -o -name '.exitcode' \) \
                2>/dev/null | while IFS= read -r f; do
                  rel="${f#"$INSTALLED_RUNS"/}"
                  target="$INSTALLED_LOGS/$rel"
                  mkdir -p "$(dirname "$target")"
                  cp "$f" "$target" 2>/dev/null || true
                done
            fi
            if [ "$pipeline_cleanup_rc" = 0 ]; then
              rm -rf "$WORK" "$INSTALLED_DATA" "$INSTALLED_RUNS" 2>/dev/null || true
            else
              echo "ERROR: preserving installed work/data/run trees because a scoped process survived cleanup." >&2
            fi
            rm -f "$GITHUB_WORKSPACE/seqdesk-${VERSION}.tar.gz" 2>/dev/null || true
            if command -v psql >/dev/null 2>&1; then
              psql -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" -U postgres -d postgres \
                -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$INSTALLED_DB_NAME' AND pid <> pg_backend_pid()" \
                >/dev/null 2>&1 || true
              if ! psql -v ON_ERROR_STOP=1 -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" \
                -U postgres -d postgres -c "DROP DATABASE IF EXISTS \"$INSTALLED_DB_NAME\"" >/dev/null 2>&1; then
                echo "ERROR: failed to drop installed-app database $INSTALLED_DB_NAME" >&2
                cleanup_rc=1
              fi
            fi
            if [ "$original_rc" -ne 0 ]; then
              exit "$original_rc"
            fi
            exit "$cleanup_rc"
          }
          trap cleanup_install_slurm EXIT

          echo "=== create a fresh database for the installed app ==="
          # Connect as the postgres superuser (trust auth on the ephemeral cluster), like the
          # "Ensure PostgreSQL database" step does — the seqdesk role lacks CREATEDB. Own it by
          # seqdesk so the install (which connects as seqdesk) can migrate + seed it.
          psql -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" -U postgres -d postgres \
            -c "DROP DATABASE IF EXISTS \"$INSTALLED_DB_NAME\"" \
            -c "CREATE DATABASE \"$INSTALLED_DB_NAME\" OWNER \"$DB_USER\""

          echo "=== build release tarball + npm launcher ==="
          bash "$GITHUB_WORKSPACE/scripts/build-release.sh" "$VERSION" --offline-fonts --webpack
          cp "$GITHUB_WORKSPACE/seqdesk-${VERSION}.tar.gz" "$MOCK_ROOT/downloads/"
          cp "$GITHUB_WORKSPACE/scripts/install-dist.sh" "$MOCK_ROOT/install.sh"
          CHECKSUM="sha256:$(sha256sum "$MOCK_ROOT/downloads/seqdesk-${VERSION}.tar.gz" | cut -d' ' -f1)"
          echo "{\"latest\":{\"version\":\"$VERSION\",\"channel\":\"stable\",\"releaseDate\":\"$(date -u +%F)\",\"downloadUrl\":\"http://127.0.0.1:$MOCK_PORT/downloads/seqdesk-${VERSION}.tar.gz\",\"checksum\":\"$CHECKSUM\",\"minNodeVersion\":\"22.13.0\"},\"updateAvailable\":false}" > "$MOCK_ROOT/api/version"
          ( cd "$GITHUB_WORKSPACE/npm/seqdesk" && npm run sync-version >/dev/null 2>&1 && npm pack --pack-destination "$WORK" >/dev/null )
          NPM_TGZ="$(find "$WORK" -maxdepth 1 -name 'seqdesk-*.tgz' | head -n1)"
          npm install -g "$NPM_TGZ" --prefix "$NPM_PREFIX" --cache "$WORK/npm-cache" >/dev/null

          echo "=== start mock release server ==="
          ( cd "$MOCK_ROOT" && exec python3 -m http.server "$MOCK_PORT" --bind 127.0.0.1 >"$WORK/mock.log" 2>&1 ) &
          MOCK_PID=$!
          MOCK_READY=0
          for _ in $(seq 1 30); do
            MOCK_PROCESS_STATE="$(seqdesk_ci_pid_state "$MOCK_PID")"
            if [ "$MOCK_PROCESS_STATE" != "active" ]; then
              echo "Mock release server process state is $MOCK_PROCESS_STATE before readiness." >&2
              break
            fi
            if curl -fsS "http://127.0.0.1:$MOCK_PORT/api/version" >/dev/null 2>&1; then
              MOCK_READY=1
              break
            fi
            sleep 1
          done
          if [ "$MOCK_READY" != "1" ]; then
            echo "Mock release endpoint did not become ready." >&2
            tail -n 100 "$WORK/mock.log" 2>/dev/null || true
            exit 1
          fi
          sleep 1
          MOCK_PROCESS_STATE="$(seqdesk_ci_pid_state "$MOCK_PID")"
          MOCK_IDENTITY_STATE="$(seqdesk_ci_pid_identity_state "$MOCK_PID" "$MOCK_ROOT")"
          if [ "$MOCK_PROCESS_STATE" != "active" ] ||
             [ "$MOCK_IDENTITY_STATE" != "matches" ]; then
            echo "Mock endpoint responded, but the server process started by this run is not alive in the mock root." >&2
            tail -n 100 "$WORK/mock.log" 2>/dev/null || true
            exit 1
          fi

          echo "=== install with SLURM execution configured ==="
          PATH="$NPM_PREFIX/bin:$PATH" \
          SEQDESK_API="http://127.0.0.1:$MOCK_PORT/api" \
          SEQDESK_INSTALL_URL="http://127.0.0.1:$MOCK_PORT/install.sh" \
          SEQDESK_LOG="$WORK/install.log" \
          SEQDESK_EXEC_USE_SLURM=true \
          SEQDESK_EXEC_CONDA_PATH="$SEQDESK_CONDA_PATH" \
          SEQDESK_EXEC_CONDA_ENV="$SEQDESK_CONDA_ENV" \
          SEQDESK_EXEC_SLURM_CORES=1 \
          SEQDESK_EXEC_SLURM_MEMORY=1G \
          SEQDESK_EXEC_SLURM_TIME_LIMIT=1 \
            seqdesk -y --no-pm2 --with-pipelines \
              --dir "$APP_DIR" --port "$INSTALLED_PORT" \
              --data-path "$INSTALLED_DATA" --run-dir "$INSTALLED_RUNS" \
              --nextauth-url "http://127.0.0.1:$INSTALLED_PORT" \
              --database-url "$INSTALLED_DB_URL" --database-direct-url "$INSTALLED_DB_URL"
          if seqdesk_ci_stop_child "$MOCK_PID" "mock release server" "$MOCK_ROOT"; then
            MOCK_PID=""
          else
            echo "Mock release server did not stop cleanly after installation." >&2
            exit 1
          fi
          if [ -L "$APP_DIR/start.sh" ] || [ ! -f "$APP_DIR/start.sh" ] || [ ! -x "$APP_DIR/start.sh" ]; then
            echo "Fresh install is missing its executable root start wrapper: $APP_DIR/start.sh" >&2
            exit 1
          fi
          if ! grep -F -q 'cd "$ROOT_DIR/current"' "$APP_DIR/start.sh" ||
             ! grep -F -q 'exec ./start.sh "$@"' "$APP_DIR/start.sh"; then
            echo "Fresh install root start.sh is not the releases/current wrapper." >&2
            exit 1
          fi
          if [ ! -L "$APP_DIR/current" ]; then
            echo "Fresh install did not create the required current symlink: $APP_DIR/current" >&2
            ls -la "$APP_DIR" 2>/dev/null || true
            exit 1
          fi
          INSTALL_ROOT="$(cd "$APP_DIR" && pwd -P)"
          EXPECTED_RELEASE_DIR="$INSTALL_ROOT/releases/$VERSION"
          if [ ! -d "$EXPECTED_RELEASE_DIR" ]; then
            echo "Fresh install is missing the expected versioned release: $EXPECTED_RELEASE_DIR" >&2
            exit 1
          fi
          EXPECTED_RELEASE_CANONICAL="$(cd "$EXPECTED_RELEASE_DIR" && pwd -P)"
          if [ "$EXPECTED_RELEASE_CANONICAL" != "$EXPECTED_RELEASE_DIR" ]; then
            echo "Expected versioned release resolves outside its canonical path: $EXPECTED_RELEASE_DIR -> $EXPECTED_RELEASE_CANONICAL" >&2
            exit 1
          fi
          INSTALLED_RELEASE_DIR="$(cd "$APP_DIR/current" && pwd -P)"
          if [ "$INSTALLED_RELEASE_DIR" != "$EXPECTED_RELEASE_DIR" ]; then
            echo "Fresh install current target mismatch: expected $EXPECTED_RELEASE_DIR, found $INSTALLED_RELEASE_DIR" >&2
            exit 1
          fi
          if [ ! -f "$INSTALLED_RELEASE_DIR/scripts/apply-install-profile.mjs" ]; then
            echo "Installed versioned release is missing scripts/apply-install-profile.mjs." >&2
            ls -la "$INSTALLED_RELEASE_DIR" 2>/dev/null || true
            exit 1
          fi
          test -f "$INSTALLED_RELEASE_DIR/package.json"
          INSTALLED_VERSION="$(cd "$INSTALLED_RELEASE_DIR" && node -p "require('./package.json').version")"
          if [ "$INSTALLED_VERSION" != "$VERSION" ]; then
            echo "Installed version mismatch: expected $VERSION, found $INSTALLED_VERSION." >&2
            exit 1
          fi
          echo "Installed SeqDesk $INSTALLED_VERSION at $APP_DIR"

          echo "=== assert installer persisted runtime + pipeline execution settings ==="
          ( cd "$APP_DIR" && \
            EXPECTED_DATA_PATH="$INSTALLED_DATA" \
            EXPECTED_RUN_DIR="$INSTALLED_RUNS" \
            EXPECTED_CONDA_PATH="$SEQDESK_CONDA_PATH" \
            EXPECTED_CONDA_ENV="$SEQDESK_CONDA_ENV" \
            EXPECTED_DB_URL="$INSTALLED_DB_URL" \
            EXPECTED_PORT="$INSTALLED_PORT" \
            DATABASE_URL="$INSTALLED_DB_URL" DIRECT_URL="$INSTALLED_DB_URL" \
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const assert = require("node:assert/strict");
              const { createRequire } = require("node:module");
              const configName = ["settings.json", "seqdesk.config.json"]
                .find((name) => fs.existsSync(name));
              assert.ok(configName, "installed runtime config is missing");
              const config = JSON.parse(fs.readFileSync(configName, "utf8"));
              assert.equal(config.site?.dataBasePath, process.env.EXPECTED_DATA_PATH);
              assert.equal(config.pipelines?.enabled, true);
              assert.equal(config.pipelines?.execution?.mode, "slurm");
              assert.equal(config.pipelines?.execution?.runDirectory, process.env.EXPECTED_RUN_DIR);
              assert.equal(config.runtime?.databaseUrl, process.env.EXPECTED_DB_URL);
              assert.equal(config.runtime?.directUrl, process.env.EXPECTED_DB_URL);
              assert.equal(config.app?.port, Number(process.env.EXPECTED_PORT));

              // Distribution installs keep immutable application dependencies
              // under current/, while settings.json stays at the install root.
              // Resolve Prisma from the active release instead of the wrapper root.
              const runtimeRoot = fs.existsSync(path.join("current", "package.json"))
                ? path.join(process.cwd(), "current")
                : process.cwd();
              const requireFromInstall = createRequire(
                path.join(runtimeRoot, "package.json")
              );
              const { PrismaClient } = requireFromInstall("@prisma/client");
              const prisma = new PrismaClient();
              prisma.siteSettings.findUnique({
                where: { id: "singleton" },
                select: { dataBasePath: true, extraSettings: true },
              }).then((settings) => {
                assert.ok(settings, "SiteSettings singleton is missing");
                assert.equal(settings.dataBasePath, process.env.EXPECTED_DATA_PATH);
                const extra = JSON.parse(settings.extraSettings || "{}");
                const execution = extra.pipelineExecution || {};
                assert.equal(execution.useSlurm, true);
                assert.equal(execution.runtimeMode, "conda");
                assert.equal(execution.condaPath, process.env.EXPECTED_CONDA_PATH);
                assert.equal(execution.condaEnv, process.env.EXPECTED_CONDA_ENV);
                assert.equal(execution.pipelineRunDir, process.env.EXPECTED_RUN_DIR);
                assert.equal(execution.slurmQueue, "cpu");
                assert.equal(execution.slurmCores, 1);
                assert.equal(execution.slurmMemory, "1G");
                assert.equal(execution.slurmTimeLimit, 1);
                console.log("Installer persistence verified in config file and SiteSettings.");
              }).finally(() => prisma.$disconnect()).catch((error) => {
                console.error(error);
                process.exitCode = 1;
              });
            ' )

          echo "=== apply a facility install profile (managed pipeline config) ==="
          # Pin read-cleaning's managed kraken2 DB through the install profile, exactly as a
          # facility ships it — NOT a per-run --config-json override (production HIDES that
          # field once the DB is server-managed). apply-install-profile.mjs is the same script
          # the installer runs for a hosted --profile; we feed a local resolved profile so the
          # test is self-contained. This writes PipelineConfig.config.kraken2Db, which is the
          # single key `nextflow ... --kraken2db` resolves from at run time.
          fail=0
          PROFILE_JSON="$WORK/profile.json"
          KRAKEN2_DB="${SLURM_SHARED_KRAKEN2_DB:-}"
          [ -e "$KRAKEN2_DB" ] || KRAKEN2_DB=""
          KRAKEN2_DB="$KRAKEN2_DB" PROFILE_OUT="$PROFILE_JSON" node -e '
            const fs = require("fs");
            const db = process.env.KRAKEN2_DB || "";
            const rc = { classificationKraken2: true, tax2filter: "Homo sapiens" };
            if (db) rc.kraken2Db = db;
            fs.writeFileSync(process.env.PROFILE_OUT, JSON.stringify(
              { pipelines: { enabled: true,
                  // every pipeline we run on the installed app must be enabled here
                  // (a disabled pipeline 400s with "not enabled in SeqDesk settings")
                  enable: ["fastq-checksum", "simulate-reads", "fastqc",
                           "study-demo-report", "reads-qc", "read-cleaning"],
                  configs: { "read-cleaning": rc } } }, null, 2));
          '
          if [ -n "$KRAKEN2_DB" ]; then
            echo "Profile pins read-cleaning kraken2Db = $KRAKEN2_DB"
          else
            echo "kraken2 DB absent at '${SLURM_SHARED_KRAKEN2_DB:-<unset>}' — profile omits kraken2Db (read-cleaning full run stays gated on a raw dataset)."
          fi
          # Apply with the script and dependencies shipped in the installed artifact,
          # targeting the installed app's own database.
          ( cd "$INSTALLED_RELEASE_DIR" && DATABASE_URL="$INSTALLED_DB_URL" DIRECT_URL="$INSTALLED_DB_URL" \
              node scripts/apply-install-profile.mjs --profile-config "$PROFILE_JSON" ) \
            || { echo "ERROR: install-profile apply failed."; fail=1; }

          echo "=== assert the managed config landed in the DB the installed app reads ==="
          if [ -n "$KRAKEN2_DB" ]; then
            RC_DB_CONFIG="$(PGPASSWORD="${DB_PASSWORD:-seqdesk}" psql -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" -U "${DB_USER:-seqdesk}" -d "$INSTALLED_DB_NAME" -tAc "select config from \"PipelineConfig\" where \"pipelineId\"='read-cleaning'" 2>&1 || true)"
            echo "PipelineConfig[read-cleaning].config = $RC_DB_CONFIG"
            case "$RC_DB_CONFIG" in
              *"$KRAKEN2_DB"*) echo "OK: profile-managed kraken2Db persisted — --kraken2db resolves from here, no per-run override." ;;
              *) echo "ERROR: managed kraken2Db not found in PipelineConfig after profile apply."; fail=1 ;;
            esac
          fi

          echo "=== boot the INSTALLED app with the SLURM runtime env ==="
          ( cd "$APP_DIR"
            export PATH="$SEQDESK_NODE_BIN:$PATH"
            # The installer must be the source of truth for port, database,
            # data/run paths, SLURM policy, and Conda path/env. Unset inherited
            # job variables so a broken persisted setting cannot be masked.
            unset PORT DATABASE_URL DIRECT_URL
            unset SEQDESK_SLURM_ENABLED SEQDESK_CONDA_ENABLED
            unset SEQDESK_CONDA_PATH SEQDESK_CONDA_ENV
            unset SEQDESK_PIPELINE_RUN_DIR SEQDESK_DATA_PATH
            unset SEQDESK_PIPELINES_DIR
            export SEQDESK_SLURM_INLINE_EXECUTOR=1
            # Use a new shared cache for this installation. Installed local runs
            # populate it before their SLURM counterparts, proving a fresh
            # facility can provision pipeline process environments.
            export SEQDESK_CONDA_CACHE_DIR="$INSTALLED_CONDA_CACHE"
            exec ./start.sh ) >"$WORK/server.log" 2>&1 &
          INSTALLED_APP_PID=$!
          INSTALLED_READY=0
          for _ in $(seq 1 60); do
            INSTALLED_PROCESS_STATE="$(seqdesk_ci_pid_state "$INSTALLED_APP_PID")"
            if [ "$INSTALLED_PROCESS_STATE" != "active" ]; then
              echo "Installed SeqDesk process state is $INSTALLED_PROCESS_STATE before readiness." >&2
              break
            fi
            if curl -fsS "http://127.0.0.1:$INSTALLED_PORT/api/auth/providers" >"$WORK/providers.json" 2>/dev/null; then
              INSTALLED_READY=1
              break
            fi
            sleep 2
          done
          if [ "$INSTALLED_READY" != "1" ]; then
            echo "Installed SeqDesk did not become ready in time." >&2
            tail -n 200 "$WORK/server.log" 2>/dev/null || true
            exit 1
          fi
          sleep 1
          INSTALLED_PROCESS_STATE="$(seqdesk_ci_pid_state "$INSTALLED_APP_PID")"
          INSTALLED_IDENTITY_STATE="$(seqdesk_ci_pid_identity_state "$INSTALLED_APP_PID" "$APP_DIR")"
          if [ "$INSTALLED_PROCESS_STATE" != "active" ] ||
             [ "$INSTALLED_IDENTITY_STATE" != "matches" ]; then
            echo "Readiness endpoint responded, but this run's installed process is not alive in the install root." >&2
            tail -n 200 "$WORK/server.log" 2>/dev/null || true
            exit 1
          fi
          curl -fsS "http://127.0.0.1:$INSTALLED_PORT/api/version" >"$WORK/version.json"
          EXPECTED_VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (response.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`installed app version mismatch: expected ${process.env.EXPECTED_VERSION}, got ${response.version}`);
            }
          ' "$WORK/version.json"
          node -e '
            const fs = require("node:fs");
            const providers = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!providers || typeof providers !== "object" || !providers.credentials) {
              throw new Error("Installed SeqDesk did not expose the credentials provider");
            }
          ' "$WORK/providers.json"
          echo "Installed SeqDesk is ready and exposes authentication."

          echo "=== run pipelines through the INSTALLED app (managed config from the install) ==="
          # Install once, exercise many — NO --config-json; managed config + execution come from
          # the install/profile, the realistic facility flow. Grow this list per the
          # "Install-harness expansion roadmap" (Phase 1) in PIPELINE_E2E_COVERAGE.md.
          rc=0
          run_installed() {
            local label="$1"; shift
            echo "::group::installed-app pipeline: $label"
            local prc=0
            SEQDESK_RUNTIME_E2E_BASE_URL="http://127.0.0.1:$INSTALLED_PORT" \
            SEQDESK_RUNTIME_E2E_EMAIL=admin@example.com \
            SEQDESK_RUNTIME_E2E_PASSWORD=admin \
            SEQDESK_RUNTIME_E2E_SLURM_CORES=1 \
            SEQDESK_RUNTIME_E2E_SLURM_MEMORY=1G \
            SEQDESK_RUNTIME_E2E_SLURM_TIME_LIMIT=1 \
              npm run pipeline:e2e:runtime -- --ensure-dummy-data "$@" \
                2>&1 | tee "$WORK/install-$label.log" || prc=$?
            echo "::endgroup::"
            echo "installed-app [$label] exit: $prc"
            [ "$prc" = 0 ] || rc=1
          }
          # Phase-1 matrix on the installed app. First prove that the installer's
          # persisted default policy selects SLURM without the client forcing an
          # execution mode; then explicitly prove local mode. Conda-backed
          # pipelines run local before SLURM so this fresh installation builds
          # each process env into its own empty shared cache before the offline
          # compute node reuses it. Study-scoped pipelines auto-find the dummy
          # study. read-cleaning/metaxpath/mag/submg stay in extended diagnostics.
          run_installed fastq-checksum-default  --pipeline-id fastq-checksum \
            --skip-local --skip-slurm --include-default-policy --expect-default-mode slurm
          run_installed fastq-checksum-local    --pipeline-id fastq-checksum    --skip-slurm
          # No --skip means local then SLURM as separate runs/run folders.
          run_installed simulate-reads          --pipeline-id simulate-reads
          run_installed study-demo-report       --pipeline-id study-demo-report
          run_installed fastqc                  --pipeline-id fastqc
          run_installed reads-qc                --pipeline-id reads-qc

          echo "=== prove installed runs used the packaged pipeline tree ==="
          PACKAGED_PIPELINES_ROOT="$INSTALLED_RELEASE_DIR/pipelines"
          for pipeline_id in fastq-checksum simulate-reads study-demo-report fastqc reads-qc; do
            expected_target="$PACKAGED_PIPELINES_ROOT/$pipeline_id/workflow"
            if grep -R -F -l --include='run.sh' -- "$expected_target" "$INSTALLED_RUNS" >/dev/null 2>&1; then
              echo "OK: $pipeline_id run.sh targets $expected_target"
            else
              echo "ERROR: no installed $pipeline_id run.sh targets the packaged workflow $expected_target" >&2
              rc=1
            fi
          done

          # App-resilience on the INSTALLED app — the same pipeline-ops dimensions the
          # source-boot steps assert, now on the realistic facility install: no-data → clean
          # 400, run visibility/permissions (403/401) + pipeline.completed notification,
          # failure → DB failed, cancel → scancel → cancelled, stuck-run reconcile via /sync.
          # The scripts are HTTP-only (SLURM commands are host-level); point them at the
          # installed app. These are required along with the installed pipeline matrix.
          run_installed_resil() {
            local label="$1"; shift
            echo "::group::installed-app resilience: $label"
            local prc=0
            "$@" >"$WORK/install-resil-$label.log" 2>&1 || prc=$?
            sed -n '1,120p' "$WORK/install-resil-$label.log" 2>/dev/null || true
            echo "::endgroup::"
            echo "installed-app resilience [$label] exit: $prc"
            [ "$prc" = 0 ] || rc=1
          }
          export SEQDESK_SLURM_E2E_BASE_URL="http://127.0.0.1:$INSTALLED_PORT"
          export SEQDESK_SLURM_E2E_EMAIL=admin@example.com SEQDESK_SLURM_E2E_PASSWORD=admin
          export SEQDESK_APPCHECK_BASE_URL="http://127.0.0.1:$INSTALLED_PORT"
          export SEQDESK_APPCHECK_EMAIL=admin@example.com SEQDESK_APPCHECK_PASSWORD=admin
          run_installed_resil nodata  npm run pipeline:e2e:appcheck -- --check nodata
          run_installed_resil access  npm run pipeline:e2e:appcheck -- --check access
          run_installed_resil failure npm run pipeline:e2e:slurm-failure
          run_installed_resil cancel  npm run pipeline:e2e:slurm-cancel
          run_installed_resil stuck   npm run pipeline:e2e:appcheck -- --check stuck

          if seqdesk_ci_stop_child "$INSTALLED_APP_PID" "installed SeqDesk app" "$APP_DIR"; then
            INSTALLED_APP_PID=""
          else
            echo "Installed SeqDesk did not stop cleanly after the matrix." >&2
            rc=1
          fi
          echo "installed-app pipelines overall rc: $rc"
          if [ "$rc" != 0 ]; then
            echo "--- installed-app run logs (the cleanup trap frees these; dump them now) ---"
            find "$INSTALLED_RUNS" -type f \( -name 'slurm-*.err' -o -name 'slurm-*.out' \
              -o -name '.command.err' -o -name '.command.log' -o -name '.command.sh' \
              -o -name 'pipeline.err' -o -name 'pipeline.out' -o -name '.nextflow.log' -o -name 'run.sh' \) \
              2>/dev/null | sort | while IFS= read -r f; do
                echo "::group::$f"; sed -n '1,200p' "$f" 2>/dev/null; echo "::endgroup::"; done || true
            echo "--- installed-app task exit codes (a non-zero one shows the failed process) ---"
            find "$INSTALLED_RUNS" -path '*/work/*' -name '.exitcode' 2>/dev/null | while IFS= read -r f; do echo "$f => $(cat "$f" 2>/dev/null)"; done | grep -v '=> 0$' || true
          fi
          [ "$rc" = 0 ] || fail=1
          exit "$fail"

      - name: Collect SLURM + pipeline diagnostics
        if: always()
        run: |
          set +e
          DIAG="$RUNNER_TEMP/slurm-diag"
          mkdir -p "$DIAG"

          # 1) Run-folder tree + every relevant log, echoed to the console AND staged.
          if [ -n "${SEQDESK_RUN_DIR:-}" ] && [ -d "$SEQDESK_RUN_DIR" ]; then
            find "$SEQDESK_RUN_DIR" -maxdepth 5 -printf '%y %10s  %p\n' 2>/dev/null | tee "$DIAG/run-dir-tree.txt"
            find "$SEQDESK_RUN_DIR" -type f \( \
                 -name 'pipeline.out' -o -name 'pipeline.err' \
              -o -name 'slurm-*.out' -o -name 'slurm-*.err' \
              -o -name '.nextflow.log*' -o -name 'run.sh' -o -name 'trace.txt' \
              -o -name '.command.err' -o -name '.command.log' -o -name '.command.out' \) 2>/dev/null \
            | while IFS= read -r f; do
                echo "::group::$f"
                sed -n '1,500p' "$f"
                echo "::endgroup::"
              done
          else
            echo "No run dir at '${SEQDESK_RUN_DIR:-<unset>}'."
          fi

          # 2) SLURM's own view — the only clue when a job fails before writing any log
          #    (e.g. compute node can't see the run dir, so --output can't be opened).
          #    The runner account can own unrelated cluster work. Stage and print only
          #    seqdesk-* jobs whose accounting WorkDir belongs to this CI run.
          if command -v sacct >/dev/null 2>&1; then
            SOURCE_RUN_ROOT="${SEQDESK_RUN_DIR:-}"
            INSTALLED_RUN_ROOT=""
            [ -n "$SOURCE_RUN_ROOT" ] && INSTALLED_RUN_ROOT="${SOURCE_RUN_ROOT}-installed"
            SACCT_RAW="$RUNNER_TEMP/sacct-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.raw"
            SACCT_FILTERED="$DIAG/sacct.txt"
            CI_SLURM_IDS="$DIAG/ci-slurm-job-ids.txt"
            : > "$SACCT_FILTERED"
            : > "$CI_SLURM_IDS"
            if sacct -u "$USER" --starttime=now-4hours --noheader --parsable2 \
              --format=JobIDRaw,JobName%128,State,ExitCode,Reason%128,WorkDir%220,NodeList \
              >"$SACCT_RAW" 2>/dev/null; then
              {
                echo "JobIDRaw|JobName|State|ExitCode|Reason|WorkDir|NodeList"
                awk -F'|' -v source_root="$SOURCE_RUN_ROOT" -v installed_root="$INSTALLED_RUN_ROOT" '
                  function beneath(path, root) {
                    return root != "" && (path == root || index(path, root "/") == 1)
                  }
                  $1 ~ /^[0-9]+$/ && $2 ~ /^seqdesk-/ &&
                    (beneath($6, source_root) || beneath($6, installed_root)) {
                    print
                  }
                ' "$SACCT_RAW"
              } | tee "$SACCT_FILTERED"
              awk -F'|' 'NR > 1 && $1 ~ /^[0-9]+$/ { print $1 }' \
                "$SACCT_FILTERED" | sort -u > "$CI_SLURM_IDS"
            else
              echo "sacct query failed." | tee "$SACCT_FILTERED"
            fi
            rm -f "$SACCT_RAW"
            if command -v scontrol >/dev/null 2>&1; then
              while IFS= read -r jid; do
                [ -n "$jid" ] || continue
                job_info="$(scontrol show job -o "$jid" 2>/dev/null || true)"
                job_name="$(printf '%s\n' "$job_info" | tr ' ' '\n' | sed -n 's/^JobName=//p' | head -n 1)"
                work_dir="$(printf '%s\n' "$job_info" | tr ' ' '\n' | sed -n 's/^WorkDir=//p' | head -n 1)"
                work_dir_matches=0
                if [ -n "$SOURCE_RUN_ROOT" ] &&
                   [[ "$work_dir" == "$SOURCE_RUN_ROOT" || "$work_dir" == "$SOURCE_RUN_ROOT/"* ]]; then
                  work_dir_matches=1
                fi
                if [ -n "$INSTALLED_RUN_ROOT" ] &&
                   [[ "$work_dir" == "$INSTALLED_RUN_ROOT" || "$work_dir" == "$INSTALLED_RUN_ROOT/"* ]]; then
                  work_dir_matches=1
                fi
                if [[ "$job_name" != seqdesk-* ]] || [ "$work_dir_matches" != 1 ]; then
                  echo "Skipping scontrol/log paths for $jid: current controller metadata is outside this CI run."
                  continue
                fi
                echo "### scontrol show job $jid" | tee -a "$DIAG/scontrol.txt"
                printf '%s\n' "$job_info" | tee -a "$DIAG/scontrol.txt"
                # cat the StdOut/StdErr paths SLURM actually resolved, wherever they landed
                for kind in StdOut StdErr; do
                  p="$(printf '%s\n' "$job_info" | tr ' ' '\n' | sed -n "s/^${kind}=//p")"
                  if [ -n "$p" ] && [ -f "$p" ]; then
                    echo "::group::$kind($jid) = $p"; sed -n '1,300p' "$p"; echo "::endgroup::"
                    cp "$p" "$DIAG/" 2>/dev/null
                  fi
                done
              done < "$CI_SLURM_IDS"
            fi
          else
            echo "sacct not on PATH; cannot capture SLURM accounting." | tee "$DIAG/sacct.txt"
          fi
          true

      - name: Upload SLURM pipeline E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-slurm-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.SERVER_LOG }}
            ${{ env.RUNTIME_E2E_LOG }}
            ${{ env.SLURM_E2E_LOG }}
            ${{ env.FAILURE_E2E_LOG }}
            ${{ env.CANCEL_E2E_LOG }}
            ${{ env.APPCHECK_E2E_LOG }}
            ${{ env.PROVIDERS_JSON }}
            ${{ env.PG_LOG }}
            ${{ env.SEQDESK_RUN_DIR }}
            ${{ runner.temp }}/slurm-diag
            # Real mouse-gut (PRJDB6165) pipeline reports — only present when the opt-in step ran
            # (workflow_dispatch + run_mouse_real_data=true). Collected for the demo viewer.
            ${{ runner.temp }}/mouse-gut-reports
            # Opt-in human-gut Kraken/Bracken/Krona reports.
            ${{ runner.temp }}/kraken-output
            # Nextflow work dirs are intermediates, not useful as artifacts — and they get
            # huge (read-cleaning's detaxizer un-tars a ~20 GB kraken2 DB into one, which made
            # the upload hang ~1h). The per-process logs are echoed by the diagnostics step.
            !${{ env.SEQDESK_RUN_DIR }}/**/work/**
          if-no-files-found: warn
          retention-days: 5

      - name: Cleanup resources
        if: always()
        run: |
          set +e
          cleanup_fail=0
          pipeline_cleanup_fail=0
          if [ "${SEQDESK_CANARY_CLEANUP_FAILED:-0}" = "1" ]; then
            echo "ERROR: canary cleanup was not proven; preserving its source run tree." >&2
            cleanup_fail=1
            pipeline_cleanup_fail=1
          fi
          if [ -r "${SEQDESK_CI_CLEANUP_HELPER:-}" ]; then
            source "$SEQDESK_CI_CLEANUP_HELPER"
            seqdesk_ci_cancel_pipeline_runs "${DB_NAME:-}" "${SEQDESK_RUN_DIR:-}" \
              || { cleanup_fail=1; pipeline_cleanup_fail=1; }
            seqdesk_ci_stop_child "${APP_PID:-}" "source SeqDesk app" "$GITHUB_WORKSPACE" \
              || { cleanup_fail=1; pipeline_cleanup_fail=1; }
            seqdesk_ci_stop_monitors "$GITHUB_WORKSPACE" \
              || { cleanup_fail=1; pipeline_cleanup_fail=1; }
          else
            echo "ERROR: run-scoped cleanup helper is unavailable." >&2
            cleanup_fail=1
            pipeline_cleanup_fail=1
          fi
          if command -v psql >/dev/null 2>&1; then
            psql -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" -U postgres -d postgres \
              -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${DB_NAME:-seqdesk_slurm_missing}' AND pid <> pg_backend_pid()" \
              >/dev/null 2>&1 || true
            if ! psql -v ON_ERROR_STOP=1 -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" \
              -U postgres -d postgres -c "DROP DATABASE IF EXISTS \"${DB_NAME:-seqdesk_slurm_missing}\"" >/dev/null 2>&1; then
              echo "ERROR: failed to drop source-app database ${DB_NAME:-<unset>}" >&2
              cleanup_fail=1
            fi
          fi
          if [ "${USE_EPHEMERAL_POSTGRES:-0}" = "1" ] && [ -n "${PGDATA_DIR:-}" ] && [ -n "${PG_CTL_BIN:-}" ]; then
            "$PG_CTL_BIN" -D "$PGDATA_DIR" stop -m fast || true
            rm -rf "$PGDATA_DIR"
          fi
          # Remove temp dirs BEFORE the conda env: this shell runs with the env
          # active on PATH, so deleting it first leaves `rm` unresolvable (exit 127).
          if [ "$pipeline_cleanup_fail" = 0 ]; then
            rm -rf "${PG_TOOLCHAIN_DIR:-}" "${SEQDESK_DATA_DIR:-}" "${SEQDESK_RUN_DIR:-}" \
              "${SEQDESK_STAGED_PIPELINES_DIR:-}" "${SEQDESK_DB_DIR:-}"
          else
            echo "ERROR: preserving source data/run/pipeline trees because a scoped process survived cleanup." >&2
          fi
          # Only remove a throwaway per-run env. With the shared cluster conda
          # (SLURM_SHARED_CONDA_BASE set) the env is persistent and reused across runs.
          if [ -z "${SLURM_SHARED_CONDA_BASE:-}" ]; then
            conda env remove -n "$PIPELINE_CONDA_ENV" || true
          fi
          exit "$cleanup_fail"
