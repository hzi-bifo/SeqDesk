name: Install (Ubuntu)

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is in the list on purpose: the default set stops at
    # opened/synchronize/reopened, so adding the `installer-e2e` label to an
    # open PR would otherwise do nothing until the next push -- the label would
    # look like a switch that is not wired to anything.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Cost split between pull requests and main, implemented with the per-job `if:`
# below rather than a second workflow file:
#
#   * The installer unit suites (wizard, Conda discovery, private PostgreSQL,
#     drift guard) run on EVERY pull request. They need no database, no build
#     and no network, finish in seconds, and are exactly the checks that would
#     have caught the 2026-07-24 breakage before it reached main. Running them
#     only after the merge is what let main go red in the first place.
#
#   * The heavy legs -- one full release build plus six real end-to-end
#     installs, close to an hour of runner time in total -- stay on push to
#     main and on workflow_dispatch. On a pull request they run only when the
#     PR carries the `installer-e2e` label, so a change that actually touches
#     scripts/install*.sh can be proven before the merge without charging every
#     unrelated documentation PR for it. Add the label (or dispatch this
#     workflow on the branch) whenever the installer itself changed.
concurrency:
  group: install-e2e-ubuntu-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  # Superseded pull-request runs are cancelled; runs on main always finish, so
  # the record of what main was proven with stays complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  interactive-wizard-test:
    # The installer's unit suites. Every one of them sources an installer in
    # library-only mode -- no real install, no database, no network -- so the
    # whole job costs seconds and gates every push AND every pull request.
    if: ${{ github.repository == 'hzi-bifo/SeqDesk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # One step per suite: run together under `bash -e`, the first failing
      # suite hid the other two for days, so a red Conda test also meant the
      # private-PostgreSQL suite never executed at all.
      - name: Run interactive wizard test
        run: bash scripts/ci/test-interactive-wizard.sh

      - name: Run Conda discovery test
        run: bash scripts/ci/test-conda-discovery.sh

      - name: Run private PostgreSQL test
        # Provisioning cases self-skip when initdb/pg_ctl are absent, so this
        # still exercises the path helpers and guards on a client-only runner.
        run: bash scripts/ci/test-private-postgres.sh

      - name: Run printed-credential checker test
        # Unit-tests the parser that the second-install job below depends on,
        # against summaries rendered by the installer's own print_login_summary.
        # A parser that silently matches nothing would turn that 60-minute job
        # into a green light for the exact bug it exists to catch.
        run: bash scripts/ci/test-printed-credentials-check.sh

      - name: Check installer drift
        # scripts/install.sh and scripts/install-dist.sh share ~50 helper
        # functions and fixes have repeatedly landed in only one of them.
        run: bash scripts/ci/check-installer-drift.sh

  build-public-release-artifact:
    # Heavy leg: pull requests need the `installer-e2e` label. See the cost
    # split at the top of this file.
    if: >-
      github.repository == 'hzi-bifo/SeqDesk'
      && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'installer-e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build release tarball
        env:
          DATABASE_URL: postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public
          DIRECT_URL: postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          bash "$GITHUB_WORKSPACE/scripts/build-release.sh" "$VERSION" --offline-fonts --webpack
          mkdir -p "$RUNNER_TEMP/public-release-tarball"
          cp "$GITHUB_WORKSPACE/seqdesk-${VERSION}.tar.gz" "$RUNNER_TEMP/public-release-tarball/"

      - name: Upload public release tarball
        uses: actions/upload-artifact@v4
        with:
          name: public-release-tarball
          path: ${{ runner.temp }}/public-release-tarball/*
          if-no-files-found: error
          # Only consumed by downstream install-E2E jobs within the same run;
          # 1-day floor keeps the 39 MB tarball from piling up in Actions storage.
          retention-days: 1

  public-installer-ubuntu:
    # Heavy leg: pull requests need the `installer-e2e` label.
    if: >-
      github.repository == 'hzi-bifo/SeqDesk'
      && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'installer-e2e')
      )
    needs: build-public-release-artifact
    runs-on: ubuntu-latest
    # The real core -> managed-runtime leg below downloads a fresh Miniconda
    # base and solves the complete Nextflow environment. Keep it bounded, but
    # leave enough room for a cold conda-forge/bioconda solve.
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "DO \$\$ BEGIN CREATE ROLE seqdesk LOGIN PASSWORD 'seqdesk'; EXCEPTION WHEN duplicate_object THEN ALTER ROLE seqdesk WITH PASSWORD 'seqdesk'; END \$\$;"
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'seqdesk'" | grep -q 1; then
            sudo -u postgres psql -c "CREATE DATABASE seqdesk OWNER seqdesk"
          fi

      - name: Configure paths
        run: |
          echo "PORT=8787" >> "$GITHUB_ENV"
          echo "RECONFIG_PORT=8789" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/seqdesk-public" >> "$GITHUB_ENV"
          echo "INFRA_CONFIG=$RUNNER_TEMP/infrastructure-public.json" >> "$GITHUB_ENV"
          echo "RECONFIG_CONFIG=$RUNNER_TEMP/infrastructure-public-reconfigure.json" >> "$GITHUB_ENV"
          echo "INSTALL_LOG=$RUNNER_TEMP/public-install.log" >> "$GITHUB_ENV"
          echo "SERVER_LOG=$RUNNER_TEMP/public-server.log" >> "$GITHUB_ENV"
          echo "PROVIDERS_JSON=$RUNNER_TEMP/public-providers.json" >> "$GITHUB_ENV"
          echo "CONFIG_SNAPSHOT=$RUNNER_TEMP/public-seqdesk.config.json" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/public-release-artifact" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_ROOT=$RUNNER_TEMP/public-release-server" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_PORT=8791" >> "$GITHUB_ENV"
          echo "MOCK_SERVER_LOG=$RUNNER_TEMP/public-release-server.log" >> "$GITHUB_ENV"
          echo "PUBLIC_CLI_BIN_DIR=$RUNNER_TEMP/seqdesk-public-cli-bin" >> "$GITHUB_ENV"
          echo "PUBLIC_CLI_CONFIG_HOME=$RUNNER_TEMP/seqdesk-public-cli-config" >> "$GITHUB_ENV"
          echo "PUBLIC_CLI_NEUTRAL_CWD=$RUNNER_TEMP/seqdesk-public-cli-neutral" >> "$GITHUB_ENV"
          echo "PUBLIC_CLI_CONDA_PREFIX=$RUNNER_TEMP/seqdesk-public-cli-miniconda" >> "$GITHUB_ENV"
          echo "PUBLIC_CLI_INSTALL_JSON=$RUNNER_TEMP/public-pipeline-cli-install.json" >> "$GITHUB_ENV"
          echo "PUBLIC_CLI_STATUS_JSON=$RUNNER_TEMP/public-pipeline-cli-status.json" >> "$GITHUB_ENV"
          echo "PUBLIC_CLI_RUNTIME_LOG=$RUNNER_TEMP/public-pipeline-cli-runtime.log" >> "$GITHUB_ENV"

      - name: Download public release tarball
        uses: actions/download-artifact@v4
        with:
          name: public-release-tarball
          path: ${{ env.RELEASE_ARTIFACT_DIR }}

      - name: Prepare mock release metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_DATE="$(date -u +%F)"
          mkdir -p "$MOCK_RELEASE_ROOT/api" "$MOCK_RELEASE_ROOT/downloads"
          TARBALL_PATH="$(find "$RELEASE_ARTIFACT_DIR" -maxdepth 1 -name 'seqdesk-*.tar.gz' | head -n 1)"
          if [ -z "$TARBALL_PATH" ]; then
            echo "Release tarball not found in $RELEASE_ARTIFACT_DIR"
            exit 1
          fi
          TARBALL_NAME="$(basename "$TARBALL_PATH")"
          cp "$TARBALL_PATH" "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME"
          CHECKSUM="sha256:$(sha256sum "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME" | cut -d' ' -f1)"
          cat > "$MOCK_RELEASE_ROOT/api/version" <<EOF
          {"latest":{"version":"$VERSION","channel":"stable","releaseDate":"$RELEASE_DATE","downloadUrl":"http://127.0.0.1:$MOCK_RELEASE_PORT/downloads/$TARBALL_NAME","checksum":"$CHECKSUM","releaseNotes":"CI e2e test release artifact","minNodeVersion":"22.13.0"},"updateAvailable":false,"currentVersion":null}
          EOF

      - name: Create infrastructure JSON
        run: |
          cat > "$INFRA_CONFIG" <<EOF
          {
            "port": $PORT,
            "pipelinesEnabled": false,
            "nextAuthUrl": "http://127.0.0.1:$PORT",
            "databaseUrl": "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public",
            "directUrl": "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public"
          }
          EOF
          cat > "$RECONFIG_CONFIG" <<EOF
          {
            "port": $RECONFIG_PORT,
            "pipelinesEnabled": false,
            "nextAuthUrl": "http://127.0.0.1:$RECONFIG_PORT",
            "databaseUrl": "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public",
            "directUrl": "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public"
          }
          EOF

      - name: Run public installer (headless)
        run: |
          set -euo pipefail
          cd "$MOCK_RELEASE_ROOT"
          python3 -m http.server "$MOCK_RELEASE_PORT" --bind 127.0.0.1 >>"$MOCK_SERVER_LOG" 2>&1 &
          MOCK_SERVER_PID=$!
          cleanup() {
            kill "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
            wait "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/api/version" >/dev/null; then
              break
            fi
            sleep 1
          done
          XDG_CONFIG_HOME="$PUBLIC_CLI_CONFIG_HOME" \
            SEQDESK_CLI_BIN_DIR="$PUBLIC_CLI_BIN_DIR" \
            SEQDESK_API="http://127.0.0.1:${MOCK_RELEASE_PORT}/api" \
            SEQDESK_LOG="$INSTALL_LOG" \
            bash "$GITHUB_WORKSPACE/scripts/install-dist.sh" \
            -y --without-pipelines --no-pm2 --dir "$INSTALL_DIR" --config "$INFRA_CONFIG"

      - name: Verify install artifacts
        run: |
          set -euo pipefail
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          test -f "$INSTALL_DIR/package.json"
          test -f "$CFG"
          test -x "$INSTALL_DIR/start.sh"
          cp "$CFG" "$CONFIG_SNAPSHOT"

      - name: Validate initial config values
        run: |
          set -euo pipefail
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          node "$GITHUB_WORKSPACE/scripts/assert-installed-config.mjs" \
            --file "$CFG" \
            --expected-port "$PORT"

      - name: Reconfigure public install in place
        run: |
          set -euo pipefail
          cd "$MOCK_RELEASE_ROOT"
          python3 -m http.server "$MOCK_RELEASE_PORT" --bind 127.0.0.1 >>"$MOCK_SERVER_LOG" 2>&1 &
          MOCK_SERVER_PID=$!
          cleanup() {
            kill "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
            wait "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/api/version" >/dev/null; then
              break
            fi
            sleep 1
          done
          XDG_CONFIG_HOME="$PUBLIC_CLI_CONFIG_HOME" \
            SEQDESK_CLI_BIN_DIR="$PUBLIC_CLI_BIN_DIR" \
            SEQDESK_API="http://127.0.0.1:${MOCK_RELEASE_PORT}/api" \
            SEQDESK_LOG="$INSTALL_LOG" \
            bash "$GITHUB_WORKSPACE/scripts/install-dist.sh" \
            -y --reconfigure --without-pipelines --no-pm2 --dir "$INSTALL_DIR" --config "$RECONFIG_CONFIG"

      - name: Validate reconfigured config values
        run: |
          set -euo pipefail
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          cp "$CFG" "$CONFIG_SNAPSHOT"
          node "$GITHUB_WORKSPACE/scripts/assert-installed-config.mjs" \
            --file "$CFG" \
            --expected-port "$RECONFIG_PORT"

      - name: Bootstrap pipeline runtime through the installed user CLI
        timeout-minutes: 30
        run: |
          set -euo pipefail

          # This directory is outside both the checkout and installation. The
          # command therefore has to use the installer-written wrapper and
          # default-install pointer; an implicit source-tree cwd cannot help it.
          mkdir -p "$PUBLIC_CLI_NEUTRAL_CWD"
          cd "$PUBLIC_CLI_NEUTRAL_CWD"

          test -x "$PUBLIC_CLI_BIN_DIR/seqdesk"
          test -f "$PUBLIC_CLI_CONFIG_HOME/seqdesk/default-install"
          test "$(sed -n '1p' "$PUBLIC_CLI_CONFIG_HOME/seqdesk/default-install")" = "$INSTALL_DIR"
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (config?.pipelines?.enabled !== false) {
              throw new Error("the CLI bootstrap must start from a core-only install");
            }
          ' "$CFG"

          # An explicit, absent prefix forces --runtime through the managed
          # Miniconda download path even if ubuntu-latest gains Conda later.
          test ! -e "$PUBLIC_CLI_CONDA_PREFIX"
          export XDG_CONFIG_HOME="$PUBLIC_CLI_CONFIG_HOME"
          export SEQDESK_CONDA_PATH="$PUBLIC_CLI_CONDA_PREFIX"

          if ! "$PUBLIC_CLI_BIN_DIR/seqdesk" pipelines install simulate-reads \
            --runtime --yes --json \
            >"$PUBLIC_CLI_INSTALL_JSON" 2>"$PUBLIC_CLI_RUNTIME_LOG"; then
            cat "$PUBLIC_CLI_RUNTIME_LOG" >&2
            test ! -s "$PUBLIC_CLI_INSTALL_JSON" || cat "$PUBLIC_CLI_INSTALL_JSON" >&2
            exit 1
          fi
          cat "$PUBLIC_CLI_RUNTIME_LOG"

          if ! "$PUBLIC_CLI_BIN_DIR/seqdesk" pipelines status simulate-reads --json \
            >"$PUBLIC_CLI_STATUS_JSON" 2>>"$PUBLIC_CLI_RUNTIME_LOG"; then
            cat "$PUBLIC_CLI_RUNTIME_LOG" >&2
            test ! -s "$PUBLIC_CLI_STATUS_JSON" || cat "$PUBLIC_CLI_STATUS_JSON" >&2
            exit 1
          fi

          test -x "$PUBLIC_CLI_CONDA_PREFIX/bin/conda"
          node - "$PUBLIC_CLI_INSTALL_JSON" "$PUBLIC_CLI_STATUS_JSON" \
            "$INSTALL_DIR" "$PUBLIC_CLI_CONDA_PREFIX" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const [installJson, statusJson, installDir, condaPrefix] =
            process.argv.slice(2);
          const installResult = JSON.parse(fs.readFileSync(installJson, "utf8"));
          const statusResult = JSON.parse(fs.readFileSync(statusJson, "utf8"));

          function assertReadyEnabled(result, source) {
            const pipeline = result?.pipeline;
            if (result?.success !== true) {
              throw new Error(`${source}: command did not report success`);
            }
            if (pipeline?.pipelineId !== "simulate-reads" || pipeline?.installed !== true) {
              throw new Error(`${source}: simulate-reads is not installed`);
            }
            if (
              pipeline?.setupState !== "ready" ||
              pipeline?.activationState !== "enabled" ||
              pipeline?.enabled !== true ||
              pipeline?.readiness?.status !== "ready" ||
              pipeline?.readiness?.canEnable !== true
            ) {
              throw new Error(`${source}: pipeline is not ready and enabled`);
            }

            const runtime = new Map(
              (pipeline.readiness.items || [])
                .filter((item) => String(item?.id || "").startsWith("runtime-"))
                .map((item) => [item.id, item.status])
            );
            for (const id of ["runtime-nextflow", "runtime-java", "runtime-conda"]) {
              if (runtime.get(id) !== "ready") {
                throw new Error(`${source}: ${id} did not pass readiness`);
              }
            }
          }

          assertReadyEnabled(installResult, "install");
          assertReadyEnabled(statusResult, "status");

          const configCandidates = ["settings.json", "seqdesk.config.json"];
          const configPath = configCandidates
            .map((name) => path.join(installDir, name))
            .find((candidate) => fs.existsSync(candidate));
          if (!configPath) throw new Error("installed runtime config is missing");
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          if (config?.pipelines?.execution?.conda?.path !== condaPrefix) {
            throw new Error("managed Conda prefix was not persisted");
          }
          if (config?.pipelines?.execution?.conda?.environment !== "seqdesk-pipelines") {
            throw new Error("managed Conda environment was not persisted");
          }
          if (config?.pipelines?.enabled !== true) {
            throw new Error("pipeline support was not enabled");
          }
          NODE

          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          cp "$CFG" "$CONFIG_SNAPSHOT"

      - name: Verify public app startup and auth flows
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR"

          ./start.sh "$RECONFIG_PORT" >"$SERVER_LOG" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${RECONFIG_PORT}/api/auth/providers" >"$PROVIDERS_JSON"; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            tail -n 200 "$SERVER_LOG" || true
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!payload || typeof payload !== "object" || !Object.prototype.hasOwnProperty.call(payload, "credentials")) {
              console.error("Missing credentials provider in /api/auth/providers response");
              process.exit(1);
            }
          ' "$PROVIDERS_JSON"
          node "$GITHUB_WORKSPACE/scripts/run-auth-e2e.mjs" \
            --base-url "http://127.0.0.1:${RECONFIG_PORT}" \
            --email "user@example.com" \
            --password "user" \
            --expected-role "RESEARCHER"
          node "$GITHUB_WORKSPACE/scripts/run-auth-e2e.mjs" \
            --base-url "http://127.0.0.1:${RECONFIG_PORT}" \
            --email "admin@example.com" \
            --password "admin" \
            --expected-role "FACILITY_ADMIN" \
            --check-path "/api/admin/users"

      - name: Upload install e2e artifacts (public installer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-e2e-public-ubuntu
          path: |
            ${{ env.INSTALL_LOG }}
            ${{ env.SERVER_LOG }}
            ${{ env.CONFIG_SNAPSHOT }}
            ${{ env.PROVIDERS_JSON }}
            ${{ env.MOCK_SERVER_LOG }}
            ${{ env.PUBLIC_CLI_INSTALL_JSON }}
            ${{ env.PUBLIC_CLI_STATUS_JSON }}
            ${{ env.PUBLIC_CLI_RUNTIME_LOG }}
          if-no-files-found: warn
          retention-days: 5

  source-installer-ubuntu:
    # Heavy leg: pull requests need the `installer-e2e` label.
    if: >-
      github.repository == 'hzi-bifo/SeqDesk'
      && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'installer-e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "DO \$\$ BEGIN CREATE ROLE seqdesk LOGIN PASSWORD 'seqdesk'; EXCEPTION WHEN duplicate_object THEN ALTER ROLE seqdesk WITH PASSWORD 'seqdesk'; END \$\$;"
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'seqdesk'" | grep -q 1; then
            sudo -u postgres psql -c "CREATE DATABASE seqdesk OWNER seqdesk"
          fi

      - name: Configure paths
        run: |
          echo "PORT=8788" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/seqdesk-source" >> "$GITHUB_ENV"
          echo "INFRA_CONFIG=$RUNNER_TEMP/infrastructure-source.json" >> "$GITHUB_ENV"
          echo "INSTALL_LOG=$RUNNER_TEMP/source-install.log" >> "$GITHUB_ENV"
          echo "SERVER_LOG=$RUNNER_TEMP/source-server.log" >> "$GITHUB_ENV"
          echo "PROVIDERS_JSON=$RUNNER_TEMP/source-providers.json" >> "$GITHUB_ENV"
          echo "CONFIG_SNAPSHOT=$RUNNER_TEMP/source-seqdesk.config.json" >> "$GITHUB_ENV"
          echo "STORE_E2E_JSON=$RUNNER_TEMP/source-store-e2e.json" >> "$GITHUB_ENV"
          echo "STORE_E2E_LOG=$RUNNER_TEMP/source-store-e2e.log" >> "$GITHUB_ENV"
          echo "STORE_E2E_FIXTURE_PORT=$((PORT + 1))" >> "$GITHUB_ENV"

      - name: Create infrastructure JSON
        run: |
          cat > "$INFRA_CONFIG" <<EOF
          {
            "port": $PORT,
            "pipelinesEnabled": false,
            "nextAuthUrl": "http://127.0.0.1:$PORT",
            "databaseUrl": "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public",
            "directUrl": "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public"
          }
          EOF

      - name: Run source installer (headless)
        run: |
          set -euo pipefail
          # The installer clones by branch name, and this job points it at the
          # checkout itself. GITHUB_REF_NAME cannot be used for that: on a
          # pull_request event it is "<pr>/merge", which is not a branch in the
          # local repository, so the clone fails with "Remote branch not found".
          # Name a branch at whatever commit was checked out instead, which holds
          # for push and pull_request alike.
          git -C "$GITHUB_WORKSPACE" branch --force ci-source-install HEAD
          SEQDESK_REPO="file://$GITHUB_WORKSPACE" SEQDESK_LOG="$INSTALL_LOG" bash "$GITHUB_WORKSPACE/scripts/install.sh" \
            -y --without-pipelines --branch ci-source-install --dir "$INSTALL_DIR" --config "$INFRA_CONFIG"

      - name: Verify install artifacts
        run: |
          set -euo pipefail
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          test -f "$INSTALL_DIR/package.json"
          test -f "$CFG"
          test -x "$INSTALL_DIR/start.sh"
          cp "$CFG" "$CONFIG_SNAPSHOT"

      - name: Validate installed config values
        run: |
          set -euo pipefail
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          node "$GITHUB_WORKSPACE/scripts/assert-installed-config.mjs" \
            --file "$CFG" \
            --expected-port "$PORT"

      - name: Verify source app auth and blocked-readiness Store rollback
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR"

          # This install intentionally omits the pipeline runtime. Point Store
          # traffic at a deterministic local fixture and require the app to
          # reject activation while still preserving v1 after a broken update.
          export SEQDESK_PIPELINES_DIR="$INSTALL_DIR/pipelines"
          export SEQDESK_PIPELINE_REGISTRY_URL="http://127.0.0.1:${STORE_E2E_FIXTURE_PORT}/registry"
          ./start.sh "$PORT" >"$SERVER_LOG" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 180); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/auth/providers" >"$PROVIDERS_JSON"; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            tail -n 200 "$SERVER_LOG" || true
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!payload || typeof payload !== "object" || !Object.prototype.hasOwnProperty.call(payload, "credentials")) {
              console.error("Missing credentials provider in /api/auth/providers response");
              process.exit(1);
            }
          ' "$PROVIDERS_JSON"
          node "$GITHUB_WORKSPACE/scripts/run-auth-e2e.mjs" \
            --base-url "http://127.0.0.1:${PORT}" \
            --email "user@example.com" \
            --password "user" \
            --expected-role "RESEARCHER"
          node "$GITHUB_WORKSPACE/scripts/run-auth-e2e.mjs" \
            --base-url "http://127.0.0.1:${PORT}" \
            --email "admin@example.com" \
            --password "admin" \
            --expected-role "FACILITY_ADMIN" \
            --check-path "/api/admin/users"
          node "$GITHUB_WORKSPACE/scripts/run-pipeline-store-e2e.mjs" \
            --base-url "http://127.0.0.1:${PORT}" \
            --fixture-url "http://127.0.0.1:${STORE_E2E_FIXTURE_PORT}" \
            --expect-readiness blocked \
            --expected-execution-mode local \
            --result-file "$STORE_E2E_JSON" \
            2>&1 | tee "$STORE_E2E_LOG"

      - name: Upload install e2e artifacts (source installer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-e2e-source-ubuntu
          path: |
            ${{ env.INSTALL_LOG }}
            ${{ env.SERVER_LOG }}
            ${{ env.CONFIG_SNAPSHOT }}
            ${{ env.PROVIDERS_JSON }}
            ${{ env.STORE_E2E_JSON }}
            ${{ env.STORE_E2E_LOG }}
          if-no-files-found: warn
          retention-days: 5

  public-installer-ubuntu-pm2:
    # Heavy leg: pull requests need the `installer-e2e` label.
    if: >-
      github.repository == 'hzi-bifo/SeqDesk'
      && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'installer-e2e')
      )
    needs: build-public-release-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "DO \$\$ BEGIN CREATE ROLE seqdesk LOGIN PASSWORD 'seqdesk'; EXCEPTION WHEN duplicate_object THEN ALTER ROLE seqdesk WITH PASSWORD 'seqdesk'; END \$\$;"
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'seqdesk'" | grep -q 1; then
            sudo -u postgres psql -c "CREATE DATABASE seqdesk OWNER seqdesk"
          fi

      - name: Configure paths
        run: |
          echo "PORT=8790" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/seqdesk-public-pm2" >> "$GITHUB_ENV"
          echo "INFRA_CONFIG=$RUNNER_TEMP/infrastructure-public-pm2.json" >> "$GITHUB_ENV"
          echo "INSTALL_LOG=$RUNNER_TEMP/public-pm2-install.log" >> "$GITHUB_ENV"
          echo "SERVER_LOG=$RUNNER_TEMP/public-pm2-server.log" >> "$GITHUB_ENV"
          echo "PROVIDERS_JSON=$RUNNER_TEMP/public-pm2-providers.json" >> "$GITHUB_ENV"
          echo "CONFIG_SNAPSHOT=$RUNNER_TEMP/public-pm2-seqdesk.config.json" >> "$GITHUB_ENV"
          echo "PM2_INFO=$RUNNER_TEMP/public-pm2-info.txt" >> "$GITHUB_ENV"
          echo "PM2_HOME=$RUNNER_TEMP/public-pm2-home" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/public-release-artifact" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_ROOT=$RUNNER_TEMP/public-release-server" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_PORT=8792" >> "$GITHUB_ENV"
          echo "MOCK_SERVER_LOG=$RUNNER_TEMP/public-pm2-release-server.log" >> "$GITHUB_ENV"

      - name: Download public release tarball
        uses: actions/download-artifact@v4
        with:
          name: public-release-tarball
          path: ${{ env.RELEASE_ARTIFACT_DIR }}

      - name: Prepare mock release metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_DATE="$(date -u +%F)"
          mkdir -p "$MOCK_RELEASE_ROOT/api" "$MOCK_RELEASE_ROOT/downloads"
          TARBALL_PATH="$(find "$RELEASE_ARTIFACT_DIR" -maxdepth 1 -name 'seqdesk-*.tar.gz' | head -n 1)"
          if [ -z "$TARBALL_PATH" ]; then
            echo "Release tarball not found in $RELEASE_ARTIFACT_DIR"
            exit 1
          fi
          TARBALL_NAME="$(basename "$TARBALL_PATH")"
          cp "$TARBALL_PATH" "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME"
          CHECKSUM="sha256:$(sha256sum "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME" | cut -d' ' -f1)"
          cat > "$MOCK_RELEASE_ROOT/api/version" <<EOF
          {"latest":{"version":"$VERSION","channel":"stable","releaseDate":"$RELEASE_DATE","downloadUrl":"http://127.0.0.1:$MOCK_RELEASE_PORT/downloads/$TARBALL_NAME","checksum":"$CHECKSUM","releaseNotes":"CI e2e test release artifact","minNodeVersion":"22.13.0"},"updateAvailable":false,"currentVersion":null}
          EOF

      - name: Create infrastructure JSON
        run: |
          cat > "$INFRA_CONFIG" <<EOF
          {
            "port": $PORT,
            "pipelinesEnabled": false,
            "nextAuthUrl": "http://127.0.0.1:$PORT",
            "databaseUrl": "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public",
            "directUrl": "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk?schema=public"
          }
          EOF

      - name: Run public installer with PM2
        run: |
          set -euo pipefail
          cd "$MOCK_RELEASE_ROOT"
          python3 -m http.server "$MOCK_RELEASE_PORT" --bind 127.0.0.1 >>"$MOCK_SERVER_LOG" 2>&1 &
          MOCK_SERVER_PID=$!
          cleanup() {
            kill "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
            wait "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/api/version" >/dev/null; then
              break
            fi
            sleep 1
          done
          SEQDESK_API="http://127.0.0.1:${MOCK_RELEASE_PORT}/api" SEQDESK_LOG="$INSTALL_LOG" \
            bash "$GITHUB_WORKSPACE/scripts/install-dist.sh" \
            -y --without-pipelines --use-pm2 --dir "$INSTALL_DIR" --config "$INFRA_CONFIG"

      - name: Verify install artifacts
        run: |
          set -euo pipefail
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          test -f "$INSTALL_DIR/package.json"
          test -f "$CFG"
          test -x "$INSTALL_DIR/start.sh"
          cp "$CFG" "$CONFIG_SNAPSHOT"

      - name: Validate installed config values
        run: |
          set -euo pipefail
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          node "$GITHUB_WORKSPACE/scripts/assert-installed-config.mjs" \
            --file "$CFG" \
            --expected-port "$PORT"

      - name: Verify PM2 process exists
        run: |
          set -euo pipefail
          if command -v pm2 >/dev/null 2>&1; then
            PM2_BIN="$(command -v pm2)"
          elif [ -x "$INSTALL_DIR/node_modules/.bin/pm2" ]; then
            PM2_BIN="$INSTALL_DIR/node_modules/.bin/pm2"
          else
            echo "PM2 binary not found"
            exit 1
          fi
          echo "PM2_BIN=$PM2_BIN" >> "$GITHUB_ENV"
          "$PM2_BIN" describe seqdesk >"$PM2_INFO"

      - name: Wait for PM2-managed app
        run: |
          set -euo pipefail
          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/auth/providers" >"$PROVIDERS_JSON"; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            "${PM2_BIN}" logs seqdesk --nostream --lines 200 || true
            exit 1
          fi

      - name: Assert credentials provider exists
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!payload || typeof payload !== "object" || !Object.prototype.hasOwnProperty.call(payload, "credentials")) {
              console.error("Missing credentials provider in /api/auth/providers response");
              process.exit(1);
            }
          ' "$PROVIDERS_JSON"

      - name: Verify researcher login works
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/run-auth-e2e.mjs" \
            --base-url "http://127.0.0.1:${PORT}" \
            --email "user@example.com" \
            --password "user" \
            --expected-role "RESEARCHER"

      - name: Verify admin login works
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/run-auth-e2e.mjs" \
            --base-url "http://127.0.0.1:${PORT}" \
            --email "admin@example.com" \
            --password "admin" \
            --expected-role "FACILITY_ADMIN" \
            --check-path "/api/admin/users"

      - name: Capture PM2 logs
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${PM2_BIN:-}" ]; then
            "${PM2_BIN}" logs seqdesk --nostream --lines 200 >"$SERVER_LOG" 2>&1 || true
          fi

      - name: Upload install e2e artifacts (public installer PM2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-e2e-public-ubuntu-pm2
          path: |
            ${{ env.INSTALL_LOG }}
            ${{ env.SERVER_LOG }}
            ${{ env.CONFIG_SNAPSHOT }}
            ${{ env.PROVIDERS_JSON }}
            ${{ env.PM2_INFO }}
            ${{ env.MOCK_SERVER_LOG }}
          if-no-files-found: warn
          retention-days: 5

      - name: Cleanup PM2 process
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${PM2_BIN:-}" ]; then
            "${PM2_BIN}" delete seqdesk >/dev/null 2>&1 || true
          fi

