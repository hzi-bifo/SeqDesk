      - name: Prepare mock installer and release metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_DATE="$(date -u +%F)"
          mkdir -p "$MOCK_RELEASE_ROOT/api" "$MOCK_RELEASE_ROOT/downloads"
          cp "$GITHUB_WORKSPACE/scripts/install-dist.sh" "$MOCK_RELEASE_ROOT/install.sh"
          TARBALL_PATH="$(find "$RELEASE_ARTIFACT_DIR" -maxdepth 1 -name 'seqdesk-*.tar.gz' | head -n 1)"
          if [ -z "$TARBALL_PATH" ]; then
            echo "Release tarball not found in $RELEASE_ARTIFACT_DIR"
            exit 1
          fi
          TARBALL_NAME="$(basename "$TARBALL_PATH")"
          cp "$TARBALL_PATH" "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME"
          CHECKSUM="sha256:$(sha256sum "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME" | cut -d' ' -f1)"
          cat > "$MOCK_RELEASE_ROOT/api/version" <<EOF
          {"latest":{"version":"$VERSION","channel":"stable","releaseDate":"$RELEASE_DATE","downloadUrl":"http://127.0.0.1:$MOCK_RELEASE_PORT/downloads/$TARBALL_NAME","checksum":"$CHECKSUM","releaseNotes":"CI install profile fixture release artifact","minNodeVersion":"22.13.0"},"updateAvailable":false,"currentVersion":null}
          EOF

      - name: Install side-by-side without profile through npm launcher
        run: |
          set -euo pipefail
          NPM_TGZ="$(find "$NPM_ARTIFACT_DIR" -maxdepth 1 -name 'seqdesk-*.tgz' | head -n 1)"
          if [ -z "$NPM_TGZ" ]; then
            echo "Npm launcher tarball not found in $NPM_ARTIFACT_DIR"
            exit 1
          fi
          npm install -g "$NPM_TGZ" --prefix "$NPM_PREFIX" --cache "$NPM_CACHE"

          cd "$MOCK_RELEASE_ROOT"
          python3 -m http.server "$MOCK_RELEASE_PORT" --bind 127.0.0.1 >>"$MOCK_SERVER_LOG" 2>&1 &
          MOCK_SERVER_PID=$!
          cleanup() {
            kill "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
            wait "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/api/version" >/dev/null && \
               curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/install.sh" >/dev/null; then
              break
            fi
            sleep 1
          done

          PATH="$NPM_PREFIX/bin:$PATH" \
          SEQDESK_API="http://127.0.0.1:${MOCK_RELEASE_PORT}/api" \
          SEQDESK_INSTALL_URL="http://127.0.0.1:${MOCK_RELEASE_PORT}/install.sh" \
          SEQDESK_LOG="$INSTALL_LOG" \
            seqdesk \
              -y \
              --without-pipelines \
              --no-pm2 \
              --dir "$INSTALL_DIR" \
              --port "$PORT" \
              --nextauth-url "http://127.0.0.1:$PORT" \
              --database-url "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk_profile_fixture?schema=public" \
              --database-direct-url "postgresql://seqdesk:seqdesk@127.0.0.1:5432/seqdesk_profile_fixture?schema=public"

      - name: Apply checked-in install profile via --profile-config (no secret)
        run: |
          set -euo pipefail
          test -f "$FIXTURE_PROFILE"
          # A release/launcher install lays the app (scripts, .env, node_modules)
          # out under $INSTALL_DIR/current; seqdesk.config.json is at the install
          # root (symlinked into current). Run apply from the app dir so apply-core
          # finds .env (DB connection) and writes the install's seqdesk.config.json.
          if [ -f "$INSTALL_DIR/current/scripts/apply-install-profile.mjs" ]; then
            APP_DIR="$INSTALL_DIR/current"
          elif [ -f "$INSTALL_DIR/scripts/apply-install-profile.mjs" ]; then
            APP_DIR="$INSTALL_DIR"
          else
            echo "apply-install-profile.mjs not found under $INSTALL_DIR or $INSTALL_DIR/current"
            ls -la "$INSTALL_DIR" "$INSTALL_DIR/current" 2>/dev/null || true
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          node scripts/apply-install-profile.mjs --profile-config "$FIXTURE_PROFILE"

      - name: Assert install profile applied (Prisma DB + config persistence)
        run: |
          set -euo pipefail
          CONFIG_DIR="${APP_DIR:-$INSTALL_DIR}"
          CFG="$CONFIG_DIR/settings.json"; [ -f "$CFG" ] || CFG="$CONFIG_DIR/seqdesk.config.json"
          cp "$CFG" "$CONFIG_SNAPSHOT"
          node "$GITHUB_WORKSPACE/scripts/assert-installed-config.mjs" \
            --file "$CFG" \
            --expected-port "$PORT" >/dev/null
          INSTALL_DIR="$INSTALL_DIR" APP_DIR="${APP_DIR:-$INSTALL_DIR}" PROFILE_ID="$PROFILE_ID" PROFILE_ASSERT_JSON="$PROFILE_ASSERT_JSON" \
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            import { createRequire } from "node:module";

            const installDir = process.env.INSTALL_DIR;
            const appDir = process.env.APP_DIR || installDir;
            const expectedProfileId = process.env.PROFILE_ID;
            const expectedDeviceId = "ont-minion-mk1d";

            function fail(message) {
              console.error("ASSERT FAIL: " + message);
              process.exit(1);
            }
            function parseJsonObject(raw, label) {
              if (!raw) return {};
              try {
                const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
                if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
              } catch (error) {
                fail("Failed to parse " + label + ": " + (error && error.message ? error.message : error));
              }
              return {};
            }
            function requireField(items, name, label) {
              if (!Array.isArray(items) || !items.some((item) => item && item.name === name)) {
                fail("Expected " + label + " field " + name + " to be present");
              }
            }

            // seqdesk.config.json persistence of safe install profile metadata
            const configPath = ["settings.json","seqdesk.config.json"].map((n)=>path.join(appDir,n)).find((p)=>fs.existsSync(p)) || path.join(appDir,"settings.json");
            const config = parseJsonObject(fs.readFileSync(configPath, "utf8"), configPath);
            if (!config.installProfile || config.installProfile.id !== expectedProfileId) {
              fail("seqdesk.config.json installProfile.id mismatch, got " + JSON.stringify(config.installProfile));
            }

            // Real Prisma DB reads from the installed app
            const databaseUrl = config && config.runtime && config.runtime.databaseUrl;
            if (typeof databaseUrl !== "string" || databaseUrl.trim().length === 0) {
              fail("Installed config does not include runtime.databaseUrl");
            }
            process.env.DATABASE_URL = databaseUrl;
            process.env.DIRECT_URL = (config.runtime && config.runtime.directUrl) || databaseUrl;

            const requireFromInstall = createRequire(path.join(appDir, "package.json"));
            const { PrismaClient } = requireFromInstall("@prisma/client");
            const prisma = new PrismaClient();
            try {
              const [settings, orderForm, pipelineConfigs] = await Promise.all([
                prisma.siteSettings.findUnique({ where: { id: "singleton" } }),
                prisma.orderFormConfig.findUnique({ where: { id: "singleton" } }),
                prisma.pipelineConfig.findMany(),
              ]);
              if (!settings) fail("SiteSettings singleton is missing");
              if (!orderForm) fail("OrderFormConfig singleton is missing");

              const extra = parseJsonObject(settings.extraSettings, "SiteSettings.extraSettings");
              if (!extra.installProfile || extra.installProfile.id !== expectedProfileId) {
                fail("extraSettings.installProfile.id mismatch, got " + JSON.stringify(extra.installProfile));
              }

              const orderSchema = parseJsonObject(orderForm.schema, "OrderFormConfig.schema");
              requireField(orderSchema.fields, "run_type", "order");
              requireField(orderSchema.fields, "internal_sample_code", "order");
              requireField(extra.studyFormFields, "study_experiment_type", "study");
              requireField(extra.sequencingRunSampleFormFields, "barcode", "run assignment");
              requireField(extra.sequencingRunSampleFormFields, "concentration_ng_ul", "run assignment");

              const sequencingTechRaw = extra.sequencingTechConfig;
              const sequencingTech = parseJsonObject(
                typeof sequencingTechRaw === "string" ? sequencingTechRaw : JSON.stringify(sequencingTechRaw),
                "extraSettings.sequencingTechConfig"
              );
              const availableDeviceIds = Array.isArray(sequencingTech.devices)
                ? sequencingTech.devices.filter((d) => d.available).map((d) => d.id)
                : [];
              if (availableDeviceIds.length !== 1 || availableDeviceIds[0] !== expectedDeviceId) {
                fail("Expected only " + expectedDeviceId + " available, got " + availableDeviceIds.join(", "));
              }

              if (settings.enaUsername !== "ci-fixture-webin-user") {
                fail("Expected fixture ENA username, got " + settings.enaUsername);
              }

              const enabledPipelines = pipelineConfigs
                .filter((p) => p.enabled)
                .map((p) => p.pipelineId)
                .sort();
              if (!enabledPipelines.includes("fastq-checksum")) {
                fail("Expected pipeline fastq-checksum to be enabled, got " + enabledPipelines.join(", "));
              }

              const result = {
                installProfile: extra.installProfile,
                availableDeviceIds,
                enabledPipelines,
                orderFields: orderSchema.fields.map((f) => f.name),
              };
              fs.writeFileSync(process.env.PROFILE_ASSERT_JSON, JSON.stringify(result, null, 2));
              process.stdout.write(JSON.stringify(result, null, 2));
            } finally {
              await prisma.$disconnect();
            }
          '

      - name: Verify installed app startup with applied profile
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR"
          ./start.sh "$PORT" >"$SERVER_LOG" 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/auth/providers" >"$PROVIDERS_JSON"; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            tail -n 200 "$SERVER_LOG" || true
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!payload || typeof payload !== "object" || !Object.prototype.hasOwnProperty.call(payload, "credentials")) {
              console.error("Missing credentials provider in /api/auth/providers response");
              process.exit(1);
            }
          ' "$PROVIDERS_JSON"
          node "$GITHUB_WORKSPACE/scripts/run-auth-e2e.mjs" \
            --base-url "http://127.0.0.1:${PORT}" \
            --email "admin@example.com" \
            --password "admin" \
            --expected-role "FACILITY_ADMIN" \
            --check-path "/api/admin/users"

      - name: Upload install profile fixture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-e2e-profile-fixture-ubuntu
          path: |
            ${{ env.INSTALL_LOG }}
            ${{ env.SERVER_LOG }}
            ${{ env.CONFIG_SNAPSHOT }}
            ${{ env.PROVIDERS_JSON }}
            ${{ env.PROFILE_ASSERT_JSON }}
            ${{ env.MOCK_SERVER_LOG }}
          if-no-files-found: warn
          retention-days: 5

  private-postgres-install-ubuntu:
    name: Install without --database-url (SeqDesk provisions PostgreSQL)
    # Every other install job is handed a ready database plus --database-url,
    # so the flagship path for a reviewer without a DBA — no usable server
    # anywhere, SeqDesk builds and owns its own cluster — had no end-to-end
    # coverage at all. This job runs it and then boots the installed app.
    #
    # Heavy leg: pull requests need the `installer-e2e` label. This is the one
    # to label when scripts/install-dist.sh touches PostgreSQL at all.
    if: >-
      github.repository == 'hzi-bifo/SeqDesk'
      && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'installer-e2e')
      )
    needs: build-public-release-artifact
    runs-on: ubuntu-latest
    # Same budget as the other install jobs: unpack, npm install, migrate, seed
    # and a cold Next.js boot all happen here too, and the readiness loop alone
    # is allowed four minutes.
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure no PostgreSQL server is running
        run: |
          set -euo pipefail
          # Debian/Ubuntu ship a `postgresql.service` meta unit plus one
          # `postgresql@<major>-main.service` per cluster. The instances are
          # PartOf= the meta unit, so stopping it stops them; the glob is the
          # belt-and-braces pass for an instance started on its own. Neither
          # unit name is assumed to exist -- the assertions below are what
          # actually decide whether the runner is quiet.
          sudo systemctl stop postgresql.service >/dev/null 2>&1 || true
          sudo systemctl stop 'postgresql@*.service' >/dev/null 2>&1 || true
          # The path under test only exists when nothing already answers, so
          # prove both transports are silent instead of assuming the image
          # default never changes. pg_isready is required rather than probed
          # with `command -v`: skipping the check when it is missing would turn
          # this gate, and the "no TCP listener" assertion further down, into a
          # pair of assertions that pass without testing anything.
          if ! command -v pg_isready >/dev/null 2>&1; then
            echo "pg_isready is not on PATH; this job cannot prove the runner is PostgreSQL-free"
            exit 1
          fi
          if pg_isready -h 127.0.0.1 -p 5432 -q; then
            echo "A PostgreSQL server is still accepting connections on 127.0.0.1:5432"
            exit 1
          fi
          if [ -S /var/run/postgresql/.s.PGSQL.5432 ]; then
            echo "A PostgreSQL socket is still present at /var/run/postgresql/.s.PGSQL.5432"
            exit 1
          fi
          # The server programs themselves must be present, otherwise the
          # installer would stop for the wrong reason and prove nothing. Both
          # layouts find_postgres_binary knows about are accepted, so a runner
          # image that switches to the PGDG packages does not fail here.
          for tool in initdb pg_ctl; do
            if ! ls "/usr/lib/postgresql/"*"/bin/$tool" >/dev/null 2>&1 &&
               ! ls "/usr/pgsql-"*"/bin/$tool" >/dev/null 2>&1 &&
               ! command -v "$tool" >/dev/null 2>&1; then
              echo "PostgreSQL server program $tool is not installed on this runner"
              exit 1
            fi
          done

      - name: Configure paths
        run: |
          echo "PORT=8797" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/seqdesk-private-pg" >> "$GITHUB_ENV"
          echo "INSTALL_LOG=$RUNNER_TEMP/private-pg-install.log" >> "$GITHUB_ENV"
          echo "SERVER_LOG=$RUNNER_TEMP/private-pg-server.log" >> "$GITHUB_ENV"
          echo "PROVIDERS_JSON=$RUNNER_TEMP/private-pg-providers.json" >> "$GITHUB_ENV"
          echo "SETUP_JSON=$RUNNER_TEMP/private-pg-setup.json" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/private-pg-release-artifact" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_ROOT=$RUNNER_TEMP/private-pg-release-server" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_PORT=8798" >> "$GITHUB_ENV"
          echo "MOCK_SERVER_LOG=$RUNNER_TEMP/private-pg-release-server.log" >> "$GITHUB_ENV"
          echo "PG_ROOT=$HOME/.seqdesk/postgres" >> "$GITHUB_ENV"
          echo "PG_SERVER_LOG=$HOME/.seqdesk/postgres/server.log" >> "$GITHUB_ENV"

      - name: Download public release tarball
        uses: actions/download-artifact@v4
        with:
          name: public-release-tarball
          path: ${{ env.RELEASE_ARTIFACT_DIR }}

      - name: Prepare mock release metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_DATE="$(date -u +%F)"
          mkdir -p "$MOCK_RELEASE_ROOT/api" "$MOCK_RELEASE_ROOT/downloads"
          TARBALL_PATH="$(find "$RELEASE_ARTIFACT_DIR" -maxdepth 1 -name 'seqdesk-*.tar.gz' | head -n 1)"
          if [ -z "$TARBALL_PATH" ]; then
            echo "Release tarball not found in $RELEASE_ARTIFACT_DIR"
            exit 1
          fi
          TARBALL_NAME="$(basename "$TARBALL_PATH")"
          cp "$TARBALL_PATH" "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME"
          CHECKSUM="sha256:$(sha256sum "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME" | cut -d' ' -f1)"
          cat > "$MOCK_RELEASE_ROOT/api/version" <<EOF
          {"latest":{"version":"$VERSION","channel":"stable","releaseDate":"$RELEASE_DATE","downloadUrl":"http://127.0.0.1:$MOCK_RELEASE_PORT/downloads/$TARBALL_NAME","checksum":"$CHECKSUM","releaseNotes":"CI private PostgreSQL e2e release artifact","minNodeVersion":"22.13.0"},"updateAvailable":false,"currentVersion":null}
          EOF

      - name: Run installer without a database URL
        run: |
          set -euo pipefail
          cd "$MOCK_RELEASE_ROOT"
          python3 -m http.server "$MOCK_RELEASE_PORT" --bind 127.0.0.1 >>"$MOCK_SERVER_LOG" 2>&1 &
          MOCK_SERVER_PID=$!
          cleanup() {
            kill "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
            wait "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/api/version" >/dev/null; then
              break
            fi
            sleep 1
          done
          # No --database-url and no --config on purpose: the installer has to
          # discover that nothing is usable and provision its own cluster.
          SEQDESK_API="http://127.0.0.1:${MOCK_RELEASE_PORT}/api" SEQDESK_LOG="$INSTALL_LOG" \
            bash "$GITHUB_WORKSPACE/scripts/install-dist.sh" \
            -y --without-pipelines --no-pm2 \
            --dir "$INSTALL_DIR" \
            --port "$PORT" \
            --nextauth-url "http://127.0.0.1:$PORT"

      - name: Assert SeqDesk provisioned its own PostgreSQL cluster
        run: |
          set -euo pipefail
          test -s "$PG_ROOT/data/PG_VERSION"
          test -S "$PG_ROOT/socket/.s.PGSQL.5432"
          # Written by the installer, not by PostgreSQL's defaults: both lines
          # are the socket-only guarantee the cluster is documented to provide.
          grep -q "^listen_addresses = ''" "$PG_ROOT/data/postgresql.conf"
          grep -q "^port = 5432$" "$PG_ROOT/data/postgresql.conf"
          # The private cluster is documented never to open a TCP port. Not
          # guarded by `command -v`: the first step of this job already refused
          # to continue without pg_isready, so a missing binary must not
          # silently downgrade this to an assertion that always passes.
          if pg_isready -h 127.0.0.1 -p 5432 -q; then
            echo "The private cluster opened a TCP listener on 127.0.0.1:5432"
            exit 1
          fi
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          test -x "$INSTALL_DIR/start.sh"
          # The generated URL carries a generated password, so assert on the
          # parsed host only and never echo the URL itself.
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const databaseUrl = config && config.runtime && config.runtime.databaseUrl;
            if (typeof databaseUrl !== "string" || databaseUrl.length === 0) {
              throw new Error("installed config has no runtime.databaseUrl");
            }
            const socketDir = new URL(databaseUrl).searchParams.get("host");
            if (socketDir !== process.argv[2]) {
              throw new Error("expected the generated URL to use the private socket " + process.argv[2] + ", got " + socketDir);
            }
          ' "$CFG" "$PG_ROOT/socket"

      - name: Verify installed app startup against the private cluster
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR"

          ./start.sh "$PORT" >"$SERVER_LOG" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/auth/providers" >"$PROVIDERS_JSON"; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            tail -n 200 "$SERVER_LOG" || true
            echo "--- private PostgreSQL server log ---"
            tail -n 100 "$PG_SERVER_LOG" || true
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${PORT}/api/setup/status" >"$SETUP_JSON"
          node -e '
            const fs = require("node:fs");
            const providers = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!providers || typeof providers !== "object" || !providers.credentials) {
              throw new Error("credentials provider is missing");
            }
            const setup = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (!setup || !setup.exists || !setup.configured) {
              throw new Error("database is not configured: " + JSON.stringify(setup));
            }
          ' "$PROVIDERS_JSON" "$SETUP_JSON"

      - name: Upload install e2e artifacts (private PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # settings.json is deliberately not uploaded here: without a supplied
          # --database-url it holds a generated database password.
          name: install-e2e-private-postgres-ubuntu
          path: |
            ${{ env.INSTALL_LOG }}
            ${{ env.SERVER_LOG }}
            ${{ env.PROVIDERS_JSON }}
            ${{ env.SETUP_JSON }}
            ${{ env.MOCK_SERVER_LOG }}
            ${{ env.PG_SERVER_LOG }}
          if-no-files-found: warn
          retention-days: 5

  adopted-postgres-install-ubuntu:
    name: Install without --database-url (adopt the running distro server)
    # The cheaper half of the same gap: a distro PostgreSQL is running, the
    # reviewer supplies no URL, so the installer adopts the server over TCP and
    # has to bootstrap the seqdesk role and database through the postgres
    # superuser account itself.
    #
    # Heavy leg: pull requests need the `installer-e2e` label.
    if: >-
      github.repository == 'hzi-bifo/SeqDesk'
      && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'installer-e2e')
      )
    needs: build-public-release-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Start PostgreSQL without creating the SeqDesk role
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -q; then
              break
            fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432
          # No CREATE ROLE/CREATE DATABASE here, unlike every other job in this
          # workflow: bootstrapping them is exactly what is under test. Both are
          # asserted absent, so the post-install check further down cannot pass
          # on something the runner image happened to ship.
          if sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'seqdesk'" | grep -q 1; then
            echo "Role seqdesk already exists; this job must start from a bare server"
            exit 1
          fi
          if sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'seqdesk'" | grep -q 1; then
            echo "Database seqdesk already exists; this job must start from a bare server"
            exit 1
          fi

      - name: Configure paths
        run: |
          echo "PORT=8799" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/seqdesk-adopted-pg" >> "$GITHUB_ENV"
          echo "INSTALL_LOG=$RUNNER_TEMP/adopted-pg-install.log" >> "$GITHUB_ENV"
          echo "SERVER_LOG=$RUNNER_TEMP/adopted-pg-server.log" >> "$GITHUB_ENV"
          echo "PROVIDERS_JSON=$RUNNER_TEMP/adopted-pg-providers.json" >> "$GITHUB_ENV"
          echo "SETUP_JSON=$RUNNER_TEMP/adopted-pg-setup.json" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/adopted-pg-release-artifact" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_ROOT=$RUNNER_TEMP/adopted-pg-release-server" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_PORT=8800" >> "$GITHUB_ENV"
          echo "MOCK_SERVER_LOG=$RUNNER_TEMP/adopted-pg-release-server.log" >> "$GITHUB_ENV"
          echo "PG_ROOT=$HOME/.seqdesk/postgres" >> "$GITHUB_ENV"

      - name: Download public release tarball
        uses: actions/download-artifact@v4
        with:
          name: public-release-tarball
          path: ${{ env.RELEASE_ARTIFACT_DIR }}

      - name: Prepare mock release metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_DATE="$(date -u +%F)"
          mkdir -p "$MOCK_RELEASE_ROOT/api" "$MOCK_RELEASE_ROOT/downloads"
          TARBALL_PATH="$(find "$RELEASE_ARTIFACT_DIR" -maxdepth 1 -name 'seqdesk-*.tar.gz' | head -n 1)"
          if [ -z "$TARBALL_PATH" ]; then
            echo "Release tarball not found in $RELEASE_ARTIFACT_DIR"
            exit 1
          fi
          TARBALL_NAME="$(basename "$TARBALL_PATH")"
          cp "$TARBALL_PATH" "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME"
          CHECKSUM="sha256:$(sha256sum "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME" | cut -d' ' -f1)"
          cat > "$MOCK_RELEASE_ROOT/api/version" <<EOF
          {"latest":{"version":"$VERSION","channel":"stable","releaseDate":"$RELEASE_DATE","downloadUrl":"http://127.0.0.1:$MOCK_RELEASE_PORT/downloads/$TARBALL_NAME","checksum":"$CHECKSUM","releaseNotes":"CI adopted PostgreSQL e2e release artifact","minNodeVersion":"22.13.0"},"updateAvailable":false,"currentVersion":null}
          EOF

      - name: Run installer without a database URL
        run: |
          set -euo pipefail
          cd "$MOCK_RELEASE_ROOT"
          python3 -m http.server "$MOCK_RELEASE_PORT" --bind 127.0.0.1 >>"$MOCK_SERVER_LOG" 2>&1 &
          MOCK_SERVER_PID=$!
          cleanup() {
            kill "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
            wait "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/api/version" >/dev/null; then
              break
            fi
            sleep 1
          done
          SEQDESK_API="http://127.0.0.1:${MOCK_RELEASE_PORT}/api" SEQDESK_LOG="$INSTALL_LOG" \
            bash "$GITHUB_WORKSPACE/scripts/install-dist.sh" \
            -y --without-pipelines --no-pm2 \
            --dir "$INSTALL_DIR" \
            --port "$PORT" \
            --nextauth-url "http://127.0.0.1:$PORT"

      - name: Assert the running server was adopted
        run: |
          set -euo pipefail
          test -x "$INSTALL_DIR/start.sh"
          # A healthy server was already there, so nothing may have been
          # provisioned under $HOME.
          if [ -e "$PG_ROOT/data" ]; then
            echo "A private cluster was created even though a server was already running"
            exit 1
          fi
          # The distro server must still be the one answering, and the
          # bootstrap that runs through the postgres superuser account must
          # actually have created both objects. Without these two the job would
          # only prove that a connection string was written to a file.
          pg_isready -h 127.0.0.1 -p 5432
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'seqdesk'" | grep -q 1
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'seqdesk'" | grep -q 1
          CFG="$INSTALL_DIR/settings.json"; [ -f "$CFG" ] || CFG="$INSTALL_DIR/seqdesk.config.json"
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const databaseUrl = config && config.runtime && config.runtime.databaseUrl;
            if (typeof databaseUrl !== "string" || databaseUrl.length === 0) {
              throw new Error("installed config has no runtime.databaseUrl");
            }
            const parsed = new URL(databaseUrl);
            if (parsed.hostname !== "127.0.0.1" || parsed.searchParams.get("host")) {
              throw new Error("expected the adopted TCP server, got host " + parsed.hostname);
            }
          ' "$CFG"

      - name: Verify installed app startup against the adopted server
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR"

          ./start.sh "$PORT" >"$SERVER_LOG" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/auth/providers" >"$PROVIDERS_JSON"; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            tail -n 200 "$SERVER_LOG" || true
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${PORT}/api/setup/status" >"$SETUP_JSON"
          node -e '
            const fs = require("node:fs");
            const providers = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!providers || typeof providers !== "object" || !providers.credentials) {
              throw new Error("credentials provider is missing");
            }
            const setup = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (!setup || !setup.exists || !setup.configured) {
              throw new Error("database is not configured: " + JSON.stringify(setup));
            }
          ' "$PROVIDERS_JSON" "$SETUP_JSON"

      - name: Upload install e2e artifacts (adopted PostgreSQL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # settings.json is deliberately not uploaded here: without a supplied
          # --database-url it holds a generated database password.
          name: install-e2e-adopted-postgres-ubuntu
          path: |
            ${{ env.INSTALL_LOG }}
            ${{ env.SERVER_LOG }}
            ${{ env.PROVIDERS_JSON }}
            ${{ env.SETUP_JSON }}
            ${{ env.MOCK_SERVER_LOG }}
          if-no-files-found: warn
          retention-days: 5

  second-install-existing-database-ubuntu:
    name: Second install over a database that already has accounts
    # The gap that let v1.1.123 ship: every other installation leg in this
    # workflow starts from an empty database, so the seeding always takes its
    # `create` branch and a freshly generated password always works. A reviewer
    # installing a SECOND time -- new install directory, same PostgreSQL
    # database -- meets accounts that already exist. The installer still
    # generates bootstrap passwords, still writes their hashes into
    # settings.json, still prints them under "Login", and they do not
    # authenticate, because the existing rows are left untouched.
    #
    # The assertion this job exists for, in one line: a password the installer
    # PRINTS must work. Everything else here is scaffolding for that check.
    #
    # The second install is allowed to print no credentials at all -- that is
    # the honest outcome for a database whose accounts it must not overwrite --
    # but then it has to say so, and the accounts that were already there have
    # to still work.
    #
    # KNOWN GAP -- PM2 is not covered here, deliberately. Both installs below
    # run --no-pm2 and both application boots are a plain `./start.sh`, so the
    # sibling defect shipped in the same version -- PM2 freezing the
    # DATABASE_URL the installer exported into the process and replaying it on
    # every later restart, which makes an edited settings.json have no effect --
    # has no assertion anywhere in this workflow.
    #
    # It is not bolted on here because it is a different experiment, not a
    # different line: it needs a PM2-managed install, an edit to settings.json,
    # a restart, and proof that the app moved to the edited value -- none of
    # which this job's database has any bearing on. It also needs a real pm2
    # daemon to be meaningful, because the behaviour under test is pm2's own:
    # `pm2 restart --update-env` MERGES the current environment into the copy
    # pm2 stored and cannot remove a variable from it. Measured against pm2
    # 7.0.1 with an isolated PM2_HOME and a throwaway app that prints its
    # environment:
    #
    #   DATABASE_URL=OLD pm2 start app.js --name t     -> app sees OLD
    #   env -u DATABASE_URL pm2 restart t --update-env -> app still sees OLD
    #   DATABASE_URL= pm2 restart t --update-env       -> app sees ""
    #
    # which is why scripts/install-dist.sh passes EMPTY values rather than
    # unsetting them (pm2_exec_runtime), and why the summary it prints leads
    # with `DATABASE_URL= DIRECT_URL= pm2 restart seqdesk --update-env`. Until a
    # job covers that end to end, treat the PM2 restart path as untested by CI.
    #
    # Heavy leg: pull requests need the `installer-e2e` label.
    if: >-
      github.repository == 'hzi-bifo/SeqDesk'
      && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'installer-e2e')
      )
    needs: build-public-release-artifact
    runs-on: ubuntu-latest
    # Two full installs plus three application boots, so roughly double a
    # single-install leg. The third boot belongs to the password-reset leg at
    # the end: the reset itself is a single UPDATE and costs nothing, but the
    # login that proves the new password works needs the app up again.
    timeout-minutes: 70
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DB_NAME: seqdesk_second_install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "DO \$\$ BEGIN CREATE ROLE seqdesk LOGIN PASSWORD 'seqdesk'; EXCEPTION WHEN duplicate_object THEN ALTER ROLE seqdesk WITH PASSWORD 'seqdesk'; END \$\$;"
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1; then
            sudo -u postgres psql -c "CREATE DATABASE $DB_NAME OWNER seqdesk"
          fi
          # Its own database, not the shared `seqdesk` one: this job deliberately
          # leaves populated accounts behind, and no other leg may inherit them.
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1

      - name: Configure paths
        run: |
          echo "PORT_ONE=8801" >> "$GITHUB_ENV"
          echo "PORT_TWO=8802" >> "$GITHUB_ENV"
          echo "INSTALL_DIR_ONE=$RUNNER_TEMP/seqdesk-second-install-first" >> "$GITHUB_ENV"
          echo "INSTALL_DIR_TWO=$RUNNER_TEMP/seqdesk-second-install-second" >> "$GITHUB_ENV"
          echo "FIRST_INSTALL_LOG=$RUNNER_TEMP/second-install-first.log" >> "$GITHUB_ENV"
          echo "SECOND_INSTALL_LOG=$RUNNER_TEMP/second-install-second.log" >> "$GITHUB_ENV"
          # The two summaries hold the plaintext passwords the installer printed.
          # They are masked in the job log and never uploaded.
          echo "FIRST_SUMMARY=$RUNNER_TEMP/second-install-first-summary.log" >> "$GITHUB_ENV"
          echo "SECOND_SUMMARY=$RUNNER_TEMP/second-install-second-summary.log" >> "$GITHUB_ENV"
          echo "SERVER_LOG_ONE=$RUNNER_TEMP/second-install-first-server.log" >> "$GITHUB_ENV"
          echo "SERVER_LOG_TWO=$RUNNER_TEMP/second-install-second-server.log" >> "$GITHUB_ENV"
          echo "FIRST_RESULT=$RUNNER_TEMP/second-install-first-credentials.json" >> "$GITHUB_ENV"
          echo "SECOND_RESULT=$RUNNER_TEMP/second-install-second-credentials.json" >> "$GITHUB_ENV"
          echo "GOVERNING_RESULT=$RUNNER_TEMP/second-install-governing-credentials.json" >> "$GITHUB_ENV"
          echo "ADMIN_FINGERPRINT=$RUNNER_TEMP/second-install-admin-fingerprint.txt" >> "$GITHUB_ENV"
          echo "PRE_EXISTING_EMAILS=$RUNNER_TEMP/second-install-pre-existing-emails.txt" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/second-install-release-artifact" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_ROOT=$RUNNER_TEMP/second-install-release-server" >> "$GITHUB_ENV"
          echo "MOCK_RELEASE_PORT=8803" >> "$GITHUB_ENV"
          echo "MOCK_SERVER_LOG=$RUNNER_TEMP/second-install-release-server.log" >> "$GITHUB_ENV"
          echo "DB_URL=postgresql://seqdesk:seqdesk@127.0.0.1:5432/$DB_NAME?schema=public" >> "$GITHUB_ENV"
          # The account the password-reset leg recovers. It is the one the
          # second install deliberately left alone, so at that point in the job
          # nobody holds a working password for it -- which is the whole reason
          # the reset command exists.
          echo "RESET_EMAIL=admin@example.com" >> "$GITHUB_ENV"
          # Everything the reset command wrote to its stdout/stderr. Like the
          # two installer summaries it carries a plaintext password, so it is
          # masked before anything echoes it and it is never uploaded.
          echo "RESET_OUTPUT=$RUNNER_TEMP/second-install-reset-output.log" >> "$GITHUB_ENV"
          echo "RESET_PASSWORD_FILE=$RUNNER_TEMP/second-install-reset-password.txt" >> "$GITHUB_ENV"
          # The extracted password rendered in the one line shape
          # scripts/ci/mask-printed-credentials.sh recognises, so the same
          # masking the installer summaries get also covers this value.
          echo "RESET_MASK_FILE=$RUNNER_TEMP/second-install-reset-mask.log" >> "$GITHUB_ENV"
          # Which account was reset and whether the password was generated. No
          # password value in it, so this one is safe to upload.
          echo "RESET_SUMMARY=$RUNNER_TEMP/second-install-reset-summary.json" >> "$GITHUB_ENV"
          echo "SERVER_LOG_THREE=$RUNNER_TEMP/second-install-reset-server.log" >> "$GITHUB_ENV"

      - name: Download public release tarball
        uses: actions/download-artifact@v4
        with:
          name: public-release-tarball
          path: ${{ env.RELEASE_ARTIFACT_DIR }}

      - name: Prepare mock release metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_DATE="$(date -u +%F)"
          mkdir -p "$MOCK_RELEASE_ROOT/api" "$MOCK_RELEASE_ROOT/downloads"
          TARBALL_PATH="$(find "$RELEASE_ARTIFACT_DIR" -maxdepth 1 -name 'seqdesk-*.tar.gz' | head -n 1)"
          if [ -z "$TARBALL_PATH" ]; then
            echo "Release tarball not found in $RELEASE_ARTIFACT_DIR"
            exit 1
          fi
          TARBALL_NAME="$(basename "$TARBALL_PATH")"
          cp "$TARBALL_PATH" "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME"
          CHECKSUM="sha256:$(sha256sum "$MOCK_RELEASE_ROOT/downloads/$TARBALL_NAME" | cut -d' ' -f1)"
          cat > "$MOCK_RELEASE_ROOT/api/version" <<EOF
          {"latest":{"version":"$VERSION","channel":"stable","releaseDate":"$RELEASE_DATE","downloadUrl":"http://127.0.0.1:$MOCK_RELEASE_PORT/downloads/$TARBALL_NAME","checksum":"$CHECKSUM","releaseNotes":"CI second-install e2e release artifact","minNodeVersion":"22.13.0"},"updateAvailable":false,"currentVersion":null}
          EOF

      - name: First install (guided setup, generated credentials)
        run: |
          set -euo pipefail
          cd "$MOCK_RELEASE_ROOT"
          python3 -m http.server "$MOCK_RELEASE_PORT" --bind 127.0.0.1 >>"$MOCK_SERVER_LOG" 2>&1 &
          MOCK_SERVER_PID=$!
          cleanup() {
            kill "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
            wait "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/api/version" >/dev/null; then
              break
            fi
            sleep 1
          done
          # --interactive rather than -y, because only the guided wizard
          # GENERATES the bootstrap passwords and prints them -- which is the
          # install under test. `-y` never mints a password, so it cannot
          # exercise this at all.
          #
          # The wizard requires a controlling terminal and refuses without one
          # ("No interactive TTY detected"), which a runner does not have. Run it
          # under `script`, which allocates a pseudo-terminal; feeding empty lines
          # takes every prompt's default, and a blank password is exactly the
          # answer that asks the installer to generate one. This is also the only
          # place --interactive -- the command the documentation leads with -- is
          # exercised for real.
          #
          # The supplied --database-url survives the wizard (its local-PostgreSQL
          # default never overwrites a URL that is already set), so both installs
          # share one database.
          #
          # Output is captured to a file rather than tee'd: it carries the
          # generated plaintext, which is masked in the next command before
          # anything can echo it.
          INSTALL_CMD="SEQDESK_API=http://127.0.0.1:${MOCK_RELEASE_PORT}/api"
          INSTALL_CMD="$INSTALL_CMD SEQDESK_LOG=$(printf '%q' "$FIRST_INSTALL_LOG")"
          INSTALL_CMD="$INSTALL_CMD bash $(printf '%q' "$GITHUB_WORKSPACE/scripts/install-dist.sh")"
          INSTALL_CMD="$INSTALL_CMD --interactive --without-pipelines --no-pm2"
          INSTALL_CMD="$INSTALL_CMD --dir $(printf '%q' "$INSTALL_DIR_ONE")"
          INSTALL_CMD="$INSTALL_CMD --port $(printf '%q' "$PORT_ONE")"
          INSTALL_CMD="$INSTALL_CMD --nextauth-url $(printf '%q' "http://127.0.0.1:$PORT_ONE")"
          INSTALL_CMD="$INSTALL_CMD --database-url $(printf '%q' "$DB_URL")"
          INSTALL_CMD="$INSTALL_CMD --database-direct-url $(printf '%q' "$DB_URL")"
          set +e
          # The answer stream must be BOUNDED. A pseudo-terminal echoes what is
          # written to it, so `yes ''` feeding it forever becomes a feedback loop:
          # every newline comes straight back into this capture file, which grows
          # until the runner dies -- observed twice, as a "runner received a
          # shutdown signal" about 27 seconds in, which reads like infrastructure
          # but was self-inflicted. A fixed number of newlines covers every prompt
          # in the wizard and then closes; the reads that follow return empty,
          # which is the same default-taking answer.
          # The 8 MB cap is a second, independent guard. Under Linux `script`,
          # stdin is forwarded to the pseudo-terminal and echoed straight back
          # into this capture; an unbounded answer stream therefore writes until
          # the disk gives out, which killed the runner twice ("received a
          # shutdown signal" ~27s in, which reads like infrastructure and is not).
          # A real install summary is a few kilobytes, so hitting this cap means
          # something is looping, and truncating is far cheaper to diagnose than
          # a dead runner.
          printf '\n%.0s' $(seq 1 100) \
            | timeout 20m script -qec "$INSTALL_CMD" /dev/null 2>&1 \
            | head -c 8388608 >"$FIRST_SUMMARY"
          # Element 1 of the pipeline is the installer; $? would be head's.
          INSTALL_STATUS=${PIPESTATUS[1]}
          set -e
          bash "$GITHUB_WORKSPACE/scripts/ci/mask-printed-credentials.sh" "$FIRST_SUMMARY"
          cat "$FIRST_SUMMARY"
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "First install failed with status $INSTALL_STATUS"
            exit "$INSTALL_STATUS"
          fi
          test -x "$INSTALL_DIR_ONE/start.sh"
          # The install log outlives the session and is uploaded from this job,
          # so a printed credential must not have reached it.
          if grep -qE '^[[:space:]]+[A-Za-z]+ password[[:space:]]{2,}[^[:space:]]' "$FIRST_INSTALL_LOG"; then
            echo "A credential value was written to the install log."
            exit 1
          fi

      - name: Verify the first install's printed credentials work
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR_ONE"

          ./start.sh "$PORT_ONE" >"$SERVER_LOG_ONE" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT_ONE}/api/auth/providers" >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            tail -n 200 "$SERVER_LOG_ONE" || true
            exit 1
          fi

          # --require-printed-password: if this install ever stops showing a
          # generated password, the whole job would still pass while asserting
          # nothing. Fail instead.
          node "$GITHUB_WORKSPACE/scripts/ci/assert-printed-credentials.mjs" \
            --summary "$FIRST_SUMMARY" \
            --base-url "http://127.0.0.1:${PORT_ONE}" \
            --label "first install" \
            --require-printed-password \
            --result-file "$FIRST_RESULT"

      - name: Record the accounts the second install will meet
        # NOTE: the SQL below names the table "User" (quoted, capitalised)
        # because the Prisma model `User` carries no `@@map`, so Prisma's table
        # name is the model name verbatim. That couples this job to a schema
        # detail: adding `@@map("users")` to the model in prisma/schema.prisma
        # renames the table and every `FROM "User"` in this workflow starts
        # failing with `relation "User" does not exist`. Grep this file for
        # `FROM \"User\"` when changing the mapping -- three steps read it (this
        # one, "Assert the existing admin password was not overwritten" and
        # "Assert settings.json kept no password the seed never applied").
        run: |
          set -euo pipefail
          USER_COUNT="$(PGPASSWORD=seqdesk psql -h 127.0.0.1 -p 5432 -U seqdesk -d "$DB_NAME" -tAc 'SELECT count(*) FROM "User"')"
          echo "Existing accounts in $DB_NAME: $USER_COUNT"
          if [ "$USER_COUNT" -lt 1 ]; then
            echo "The first install left no accounts behind; the second install would not be a second install."
            exit 1
          fi
          # A fingerprint of the stored hash, not the hash itself, so the value
          # can be compared after the second install without ever being written
          # somewhere it does not belong.
          PGPASSWORD=seqdesk psql -h 127.0.0.1 -p 5432 -U seqdesk -d "$DB_NAME" \
            -tAc "SELECT md5(password) FROM \"User\" WHERE email = 'admin@example.com'" \
            > "$ADMIN_FINGERPRINT"
          test -s "$ADMIN_FINGERPRINT"
          # Which addresses were already taken BEFORE the second install ran.
          # "Exists now" is not the same question: the second install may
          # legitimately create an account that was missing, and for that one a
          # generated password (and its hash in settings.json) is correct.
          PGPASSWORD=seqdesk psql -h 127.0.0.1 -p 5432 -U seqdesk -d "$DB_NAME" \
            -tAc 'SELECT email FROM "User"' > "$PRE_EXISTING_EMAILS"
          test -s "$PRE_EXISTING_EMAILS"
          echo "Addresses the second install must not claim to have given a password:"
          cat "$PRE_EXISTING_EMAILS"

      - name: Second install over the same database
        run: |
          set -euo pipefail
          cd "$MOCK_RELEASE_ROOT"
          python3 -m http.server "$MOCK_RELEASE_PORT" --bind 127.0.0.1 >>"$MOCK_SERVER_LOG" 2>&1 &
          MOCK_SERVER_PID=$!
          cleanup() {
            kill "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
            wait "$MOCK_SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MOCK_RELEASE_PORT}/api/version" >/dev/null; then
              break
            fi
            sleep 1
          done
          # A fresh install directory, the same database. That is the shape the
          # author hit: the installer's "Back up and replace the install
          # directory? (y/N)" prompt moved the old directory aside, so the
          # second install landed on an empty
          # directory and a March database -- and it is also what a reviewer
          # gets when they install on a second machine against a shared server.
          # Same pseudo-terminal treatment as the first install: the wizard is
          # the only path that mints credentials, and it requires a terminal.
          # See the first install step for why the answer stream is bounded.
          INSTALL_CMD="SEQDESK_API=http://127.0.0.1:${MOCK_RELEASE_PORT}/api"
          INSTALL_CMD="$INSTALL_CMD SEQDESK_LOG=$(printf '%q' "$SECOND_INSTALL_LOG")"
          INSTALL_CMD="$INSTALL_CMD bash $(printf '%q' "$GITHUB_WORKSPACE/scripts/install-dist.sh")"
          INSTALL_CMD="$INSTALL_CMD --interactive --without-pipelines --no-pm2"
          INSTALL_CMD="$INSTALL_CMD --dir $(printf '%q' "$INSTALL_DIR_TWO")"
          INSTALL_CMD="$INSTALL_CMD --port $(printf '%q' "$PORT_TWO")"
          INSTALL_CMD="$INSTALL_CMD --nextauth-url $(printf '%q' "http://127.0.0.1:$PORT_TWO")"
          INSTALL_CMD="$INSTALL_CMD --database-url $(printf '%q' "$DB_URL")"
          INSTALL_CMD="$INSTALL_CMD --database-direct-url $(printf '%q' "$DB_URL")"
          set +e
          printf '\n%.0s' $(seq 1 100) \
            | timeout 20m script -qec "$INSTALL_CMD" /dev/null 2>&1 \
            | head -c 8388608 >"$SECOND_SUMMARY"
          INSTALL_STATUS=${PIPESTATUS[1]}
          set -e
          bash "$GITHUB_WORKSPACE/scripts/ci/mask-printed-credentials.sh" "$SECOND_SUMMARY"
          cat "$SECOND_SUMMARY"
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "The second install failed with status $INSTALL_STATUS."
            echo "Attaching to a database that already holds SeqDesk accounts is a supported"
            echo "outcome: the install has to finish and tell the operator where they stand."
            exit "$INSTALL_STATUS"
          fi
          test -x "$INSTALL_DIR_TWO/start.sh"
          if grep -qE '^[[:space:]]+[A-Za-z]+ password[[:space:]]{2,}[^[:space:]]' "$SECOND_INSTALL_LOG"; then
            echo "A credential value was written to the install log."
            exit 1
          fi

      - name: Assert the existing admin password was not overwritten
        # `FROM "User"` again -- see the note on "Record the accounts the second
        # install will meet" about the unmapped Prisma model name.
        run: |
          set -euo pipefail
          AFTER="$(PGPASSWORD=seqdesk psql -h 127.0.0.1 -p 5432 -U seqdesk -d "$DB_NAME" \
            -tAc "SELECT md5(password) FROM \"User\" WHERE email = 'admin@example.com'")"
          BEFORE="$(cat "$ADMIN_FINGERPRINT")"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "The second install rewrote the existing admin password."
            echo "Anyone able to run the installer against a database could reset its admin"
            echo "account that way, so the fix for the printed-credential bug must not be to"
            echo "overwrite the account."
            exit 1
          fi
          echo "ok: the existing admin account was left untouched"

      - name: Assert settings.json kept no password the seed never applied
        # The original report in one file. settings.json has to be written
        # before the seed runs (it is what tells the seed which accounts to
        # create), but whether an account is already there can only be answered
        # once the database is reachable -- after that write. So the second
        # install writes bootstrap.users.<role>.passwordHash, then learns the
        # account exists, and the seed leaves the existing row alone. A hash
        # left behind in settings.json at that point matches nothing in the
        # database: it is the artefact that makes the next person conclude the
        # printed password "was configured" and hunt the bug in the app.
        #
        # `FROM "User"` again -- see the note on "Record the accounts the second
        # install will meet" about the unmapped Prisma model name.
        run: |
          set -euo pipefail
          SETTINGS_TWO="$INSTALL_DIR_TWO/settings.json"
          if [ ! -f "$SETTINGS_TWO" ]; then
            SETTINGS_TWO="$INSTALL_DIR_TWO/seqdesk.config.json"
          fi
          if [ ! -f "$SETTINGS_TWO" ]; then
            echo "The second install left no settings.json in $INSTALL_DIR_TWO."
            exit 1
          fi
          echo "Config under test: $SETTINGS_TWO"

          BOOTSTRAP_TSV="$RUNNER_TEMP/second-install-bootstrap-users.tsv"
          # One "<role><TAB><email><TAB><secret keys>" line per configured
          # bootstrap user. Only the NAMES of the secret keys are printed; no
          # value from the file reaches the job log.
          SEQDESK_SETTINGS_PATH="$SETTINGS_TWO" node > "$BOOTSTRAP_TSV" <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync(process.env.SEQDESK_SETTINGS_PATH, 'utf8'));
          const users = (config && config.bootstrap && config.bootstrap.users) || {};
          for (const [role, user] of Object.entries(users)) {
            if (!user || typeof user !== 'object') continue;
            const email = typeof user.email === 'string' ? user.email.trim() : '';
            if (!email) continue;
            const secrets = ['password', 'passwordHash'].filter((key) =>
              Object.prototype.hasOwnProperty.call(user, key) &&
              typeof user[key] === 'string' &&
              user[key].trim() !== ''
            );
            process.stdout.write(`${role}\t${email}\t${secrets.join(',') || '-'}\n`);
          }
          NODE
          cat "$BOOTSTRAP_TSV"

          # Driven from the addresses that were already taken, not from
          # settings.json, so the assertion cannot go quiet: dropping the whole
          # bootstrap.users.<role> entry is an equally correct outcome (nothing
          # unapplied is left behind) and must not read as "nothing to check".
          FAILED=0
          while read -r EMAIL; do
            [ -n "${EMAIL:-}" ] || continue
            MATCH_TSV="$RUNNER_TEMP/second-install-bootstrap-match.tsv"
            awk -F'\t' -v want="$EMAIL" '$2 == want { print $1 "\t" $3 }' "$BOOTSTRAP_TSV" > "$MATCH_TSV"
            if [ ! -s "$MATCH_TSV" ]; then
              echo "ok: settings.json configures no bootstrap entry for the pre-existing account $EMAIL"
              continue
            fi
            while IFS=$'\t' read -r ROLE SECRETS; do
              [ -n "${ROLE:-}" ] || continue
              if [ "$SECRETS" != "-" ]; then
                echo "FAIL: settings.json still carries bootstrap.users.$ROLE.{$SECRETS} for $EMAIL,"
                echo "      an account that already existed before this install ran. The seed does not"
                echo "      touch such an account, so that value authenticates nothing -- it only makes"
                echo "      the inert printed password look like it was applied."
                FAILED=1
              else
                echo "ok: no password kept in settings.json for the pre-existing $ROLE account ($EMAIL)"
              fi
            done < "$MATCH_TSV"
          done < "$PRE_EXISTING_EMAILS"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          # The same statement from the other side: whatever hash did survive in
          # settings.json must be the hash the database actually stores. This
          # also covers an account the second install legitimately created.
          while IFS=$'\t' read -r ROLE EMAIL SECRETS; do
            [ -n "${EMAIL:-}" ] || continue
            case ",$SECRETS," in
              *,passwordHash,*) ;;
              *) continue ;;
            esac
            SETTINGS_FINGERPRINT="$(SEQDESK_SETTINGS_PATH="$SETTINGS_TWO" SEQDESK_ROLE="$ROLE" node -e '
              const fs = require("fs");
              const crypto = require("crypto");
              const config = JSON.parse(fs.readFileSync(process.env.SEQDESK_SETTINGS_PATH, "utf8"));
              const hash = config.bootstrap.users[process.env.SEQDESK_ROLE].passwordHash;
              process.stdout.write(crypto.createHash("md5").update(hash).digest("hex"));
            ')"
            DB_FINGERPRINT="$(PGPASSWORD=seqdesk psql -h 127.0.0.1 -p 5432 -U seqdesk -d "$DB_NAME" \
              -tAc "SELECT md5(password) FROM \"User\" WHERE email = '$EMAIL'")"
            if [ "$SETTINGS_FINGERPRINT" != "$DB_FINGERPRINT" ]; then
              echo "FAIL: bootstrap.users.$ROLE.passwordHash in settings.json is not the hash stored"
              echo "      for $EMAIL in the database, so it was never applied."
              FAILED=1
            else
              echo "ok: the stored bootstrap hash for $ROLE ($EMAIL) is the one the database uses"
            fi
          done < "$BOOTSTRAP_TSV"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Assert the second install was honest about credentials
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR_TWO"

          ./start.sh "$PORT_TWO" >"$SERVER_LOG_TWO" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT_TWO}/api/auth/providers" >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            tail -n 200 "$SERVER_LOG_TWO" || true
            exit 1
          fi

          # 1. Whatever the second install printed has to be true: any password
          #    in its summary must authenticate, and if it printed none it must
          #    have said that the database already holds the accounts.
          node "$GITHUB_WORKSPACE/scripts/ci/assert-printed-credentials.mjs" \
            --summary "$SECOND_SUMMARY" \
            --base-url "http://127.0.0.1:${PORT_TWO}" \
            --label "second install" \
            --require-disclosure \
            --result-file "$SECOND_RESULT"

          # 2. The credentials that were already there still govern. Checked by
          #    replaying the FIRST install's summary against the SECOND
          #    install's app, so the passwords stay in the file they were
          #    captured in.
          node "$GITHUB_WORKSPACE/scripts/ci/assert-printed-credentials.mjs" \
            --summary "$FIRST_SUMMARY" \
            --base-url "http://127.0.0.1:${PORT_TWO}" \
            --label "first install, rechecked after the second" \
            --require-printed-password \
            --result-file "$GOVERNING_RESULT"

      - name: Reset the forgotten password with the shipped command
        # The two steps below close the job's loop. Up to here the second
        # install has been shown to be honest -- it printed no password and said
        # why -- which leaves a reviewer holding an account they cannot log into
        # and no way back in. That is exactly the situation `seqdesk
        # reset-password` exists for, and this runner is the only place it can
        # be tried against a real installation in that state.
        #
        # ORDER MATTERS. Every assertion above has already run, including
        # "Assert the existing admin password was not overwritten", so that one
        # still tests what it was written to test: whether the INSTALL rewrote
        # the hash. This step rewrites it deliberately, afterwards, and asserts
        # that it did.
        #
        # The launcher is this checkout's copy rather than a globally installed
        # or `npx`-fetched `seqdesk`: the published package predates the command
        # and would not have it, so testing anything else would test the wrong
        # code. It is pointed with --dir at INSTALL_DIR_TWO, which is what makes
        # the worker it runs the copy that shipped inside the release tarball
        # and makes it read that installation's settings.json for the database
        # credentials.
        #
        # --yes because the command otherwise stops for a confirmation and
        # nobody is here to give it; without it this step would hang until the
        # job timeout.
        run: |
          set -euo pipefail

          # Cleared rather than assumed absent, so a rerun cannot make the
          # checks below pass on a leftover file from an earlier attempt.
          rm -f "$RESET_PASSWORD_FILE" "$RESET_MASK_FILE" "$RESET_SUMMARY"

          # Output is captured to a file rather than tee'd, for the same reason
          # the installer summaries above are: it carries the new plaintext
          # password, which is masked in the commands that follow before
          # anything can echo it.
          : > "$RESET_OUTPUT"
          chmod 600 "$RESET_OUTPUT"
          set +e
          node "$GITHUB_WORKSPACE/npm/seqdesk/bin/seqdesk.js" reset-password \
            --dir "$INSTALL_DIR_TWO" \
            --email "$RESET_EMAIL" \
            --yes \
            --json \
            >"$RESET_OUTPUT" 2>&1
          RESET_STATUS=$?
          set -e

          # First net, and dead weight while --json is used: the shared masker
          # only recognises the installer's "  <Word> password    <value>" line
          # shape. It runs anyway so a future change back to the human summary
          # is covered without anyone having to remember this step.
          bash "$GITHUB_WORKSPACE/scripts/ci/mask-printed-credentials.sh" "$RESET_OUTPUT"

          # Second net, and the value this job needs to log in with. --json
          # makes the whole output one pretty-printed payload, so the password
          # is read out of that and written twice: once for the login step, once
          # in the line shape the masker above understands, which is what
          # actually registers the value as a secret. Nothing prints the
          # command's output until that has happened.
          # Non-fatal, so a failed reset can still be diagnosed below.
          set +e
          SEQDESK_RESET_OUTPUT="$RESET_OUTPUT" \
          SEQDESK_RESET_PASSWORD_FILE="$RESET_PASSWORD_FILE" \
          SEQDESK_RESET_MASK_FILE="$RESET_MASK_FILE" \
          SEQDESK_RESET_SUMMARY="$RESET_SUMMARY" \
          node <<'NODE'
          const fs = require("node:fs");

          const raw = fs.readFileSync(process.env.SEQDESK_RESET_OUTPUT, "utf8");
          let password = "";
          let details = {};

          // --json prints the payload with JSON.stringify(result, null, 2), so
          // it spans lines. Parse the whole capture, and if stderr got mixed in
          // ahead of it, fall back to the outermost braces.
          const candidates = [raw.trim()];
          const first = raw.indexOf("{");
          const last = raw.lastIndexOf("}");
          if (first !== -1 && last > first) {
            candidates.push(raw.slice(first, last + 1));
          }
          for (const candidate of candidates) {
            if (!candidate) continue;
            try {
              const payload = JSON.parse(candidate);
              if (payload && payload.ok === true && typeof payload.password === "string" && payload.password) {
                password = payload.password;
                details = { email: payload.email, role: payload.role, generated: payload.generated };
                break;
              }
            } catch {
              // Not a payload. Fall through to the printed-line shape below.
            }
          }

          if (!password) {
            // Kept as a net for a command that stops emitting JSON: the shape
            // scripts/ci/mask-printed-credentials.sh matches, so a value found
            // this way was already registered as a secret.
            for (const line of raw.split(/\r?\n/)) {
              const match = /^[ \t]+[A-Za-z]+ password[ \t]{2,}(\S.*)$/.exec(line);
              if (match) {
                password = match[1].trim();
                break;
              }
            }
          }

          if (!password) {
            console.error("Could not find a password in the reset command output.");
            console.error("Expected an \"ok\": true JSON payload with a password, or a printed");
            console.error("\"  <Word> password    <value>\" line.");
            process.exit(1);
          }

          fs.writeFileSync(process.env.SEQDESK_RESET_PASSWORD_FILE, password, { mode: 0o600 });
          fs.writeFileSync(process.env.SEQDESK_RESET_MASK_FILE, `  Reset password       ${password}\n`, {
            mode: 0o600,
          });
          fs.writeFileSync(
            process.env.SEQDESK_RESET_SUMMARY,
            `${JSON.stringify(
              {
                email: details.email ?? null,
                role: details.role ?? null,
                generated: details.generated ?? null,
                passwordPrinted: true,
              },
              null,
              2
            )}\n`
          );
          NODE
          EXTRACT_STATUS=$?
          set -e
          if [ -f "$RESET_MASK_FILE" ]; then
            bash "$GITHUB_WORKSPACE/scripts/ci/mask-printed-credentials.sh" "$RESET_MASK_FILE"
          fi

          # The command only emits a password when it succeeded, so a non-zero
          # exit can be dumped whole and is the case that most needs it.
          if [ "$RESET_STATUS" -ne 0 ]; then
            cat "$RESET_OUTPUT"
            echo "seqdesk reset-password failed with status $RESET_STATUS."
            echo "A reviewer who cannot log in has nothing else to try, so this command"
            echo "has to work against an installation the installer just left alone."
            exit "$RESET_STATUS"
          fi

          # Deliberately NOT dumped: the command reported success, which means
          # its output carries the new password, and a value this job could not
          # find is a value it could not register as a secret either. Printing
          # it here to explain the failure would be the leak the masking above
          # exists to prevent.
          if [ "$EXTRACT_STATUS" -ne 0 ]; then
            echo "seqdesk reset-password succeeded but this job could not read the new password"
            echo "out of its output, so the output is withheld rather than printed unmasked."
            echo "A password nobody can read is the same failure as no password at all."
            echo "Output size: $(wc -c <"$RESET_OUTPUT") bytes."
            exit 1
          fi

          # Every password value in it is registered as a secret by now.
          cat "$RESET_OUTPUT"
          test -s "$RESET_PASSWORD_FILE"
          cat "$RESET_SUMMARY"

          # The counterpart of "Assert the existing admin password was not
          # overwritten": that step proved the INSTALL left the hash alone, this
          # one proves the reset did not. Compared as md5 fingerprints, so no
          # hash is written anywhere it does not belong.
          #
          # `FROM "User"` again -- see the note on "Record the accounts the
          # second install will meet" about the unmapped Prisma model name.
          AFTER_RESET="$(PGPASSWORD=seqdesk psql -h 127.0.0.1 -p 5432 -U seqdesk -d "$DB_NAME" \
            -tAc "SELECT md5(password) FROM \"User\" WHERE email = '$RESET_EMAIL'")"
          BEFORE_RESET="$(cat "$ADMIN_FINGERPRINT")"
          if [ "$AFTER_RESET" = "$BEFORE_RESET" ]; then
            echo "reset-password reported success but the stored hash for $RESET_EMAIL is unchanged."
            echo "Whatever it printed cannot be the password that account now has."
            exit 1
          fi
          echo "ok: the stored password hash for $RESET_EMAIL was replaced"

      - name: Log in with the password the reset command printed
        # The assertion the whole password-reset leg exists for, and the same
        # rule this job already enforces for the installer: a password that gets
        # PRINTED must work. Nothing weaker counts -- a reset that reports
        # success and leaves the account unreachable is the defect, not the fix.
        #
        # PORT_TWO is reused. The step above ran with the app down and the
        # previous boot's process reaped, and the start wrapper execs through to
        # node, so killing it released the port.
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR_TWO"

          ./start.sh "$PORT_TWO" >"$SERVER_LOG_THREE" 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT_TWO}/api/auth/providers" >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application did not become ready in time."
            tail -n 200 "$SERVER_LOG_THREE" || true
            exit 1
          fi

          # Same login path every other installation leg in this workflow uses,
          # so a pass here means the same thing it means there.
          node "$GITHUB_WORKSPACE/scripts/run-auth-e2e.mjs" \
            --base-url "http://127.0.0.1:${PORT_TWO}" \
            --email "$RESET_EMAIL" \
            --password "$(cat "$RESET_PASSWORD_FILE")"
          echo "ok: the password seqdesk reset-password printed authenticates as $RESET_EMAIL"

      - name: Upload install e2e artifacts (second install)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Neither installer summary is uploaded, and neither is the reset
          # command's output or the password file it produced: all four hold a
          # plaintext password. The credential-result JSONs and the reset
          # summary record which accounts were touched and whether they
          # authenticated, with no password values in them.
          name: install-e2e-second-install-ubuntu
          path: |
            ${{ env.FIRST_INSTALL_LOG }}
            ${{ env.SECOND_INSTALL_LOG }}
            ${{ env.SERVER_LOG_ONE }}
            ${{ env.SERVER_LOG_TWO }}
            ${{ env.SERVER_LOG_THREE }}
            ${{ env.FIRST_RESULT }}
            ${{ env.SECOND_RESULT }}
            ${{ env.GOVERNING_RESULT }}
            ${{ env.RESET_SUMMARY }}
            ${{ env.MOCK_SERVER_LOG }}
          if-no-files-found: warn
          retention-days: 5
