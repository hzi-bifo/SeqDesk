name: Mirror to private CI

# Mirrors the public repository's `main` to the private CI repo
# (hzi-bifo/SeqDesk-ci) on every push. The private repo holds the self-hosted
# (Twincore AlmaLinux / SLURM) workflows and the self-hosted runner; this keeps
# the self-hosted runner entirely off the public repository.
#
# Only the public source repo mirrors (the `github.repository` guard prevents
# the mirror from running again once the code lands on the private side).
#
# Setup required (one-time):
#   1. Generate an SSH key:  ssh-keygen -t ed25519 -f mirror_key -N "" -C seqdesk-mirror
#   2. On hzi-bifo/SeqDesk-ci -> Settings -> Deploy keys -> Add deploy key:
#        paste mirror_key.pub, tick "Allow write access".
#   3. On hzi-bifo/SeqDesk (this repo) -> Settings -> Secrets and variables ->
#        Actions -> New repository secret named MIRROR_SSH_KEY = contents of mirror_key.
# A missing secret is a configuration failure: this mirror is the only automatic
# path to the required private self-hosted acceptance gate.
#
# The private workflow publishes a commit-specific success/failure tag back to
# SeqDesk-ci. This job reads that tag with the same deploy key, so the public
# check does not go green until the matching private acceptance run is green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-private
  # A newer main commit supersedes an older public-side waiter. The private
  # workflow has its own non-cancelling concurrency policy for live SLURM jobs.
  cancel-in-progress: true

jobs:
  mirror:
    if: ${{ github.repository == 'hzi-bifo/SeqDesk' }}
    runs-on: ubuntu-latest
    # Fail closed within GitHub's hosted-job limit. A prior non-cancellable
    # private Slurm run may still occupy the runner; this window covers most of
    # that queue plus the matching 180-minute gate, but never converts a missing
    # result into success.
    timeout-minutes: 355
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to the private CI mirror
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_SSH_KEY:-}" ]; then
            echo "ERROR: MIRROR_SSH_KEY secret is not set; the required private CI gate cannot run." >&2
            echo "Add the deploy key described in this workflow's header." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -c core.sshCommand="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            push --force git@github.com:hzi-bifo/SeqDesk-ci.git HEAD:refs/heads/main
          echo "Mirrored $(git rev-parse --short HEAD) to hzi-bifo/SeqDesk-ci (main)."

      - name: Wait for the matching private acceptance result
        run: |
          set -euo pipefail
          PRIVATE_REPOSITORY="git@github.com:hzi-bifo/SeqDesk-ci.git"
          PRIVATE_SHA="$(git rev-parse HEAD)"
          SUCCESS_REF="refs/tags/seqdesk-private-ci/${PRIVATE_SHA}/success"
          FAILURE_REF="refs/tags/seqdesk-private-ci/${PRIVATE_SHA}/failure"
          SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"

          # Result evidence is scoped to the immutable commit SHA. Re-running
          # this public workflow for the same SHA intentionally reuses that
          # evidence; re-run the private workflow when a fresh infrastructure
          # execution is required, and its publisher will replace the marker.
          # Poll for at most 350 minutes. A missing marker (runner loss,
          # cancellation, or result-publication failure) is a failed gate, not
          # an implicit success.
          for _ in $(seq 1 700); do
            success=0
            failure=0
            git -c core.sshCommand="$SSH_COMMAND" ls-remote --exit-code \
              "$PRIVATE_REPOSITORY" "$SUCCESS_REF" >/dev/null 2>&1 && success=1
            git -c core.sshCommand="$SSH_COMMAND" ls-remote --exit-code \
              "$PRIVATE_REPOSITORY" "$FAILURE_REF" >/dev/null 2>&1 && failure=1

            if [ "$success" = 1 ] && [ "$failure" = 1 ]; then
              echo "ERROR: private CI published conflicting results for $PRIVATE_SHA." >&2
              exit 1
            fi
            if [ "$success" = 1 ]; then
              echo "Private acceptance gate passed for $PRIVATE_SHA."
              exit 0
            fi
            if [ "$failure" = 1 ]; then
              echo "ERROR: private acceptance gate failed for $PRIVATE_SHA." >&2
              echo "Inspect https://github.com/hzi-bifo/SeqDesk-ci/actions/workflows/pipeline-slurm-e2e.yml" >&2
              exit 1
            fi
            sleep 30
          done

          echo "ERROR: timed out waiting for the private acceptance result for $PRIVATE_SHA." >&2
          exit 1
