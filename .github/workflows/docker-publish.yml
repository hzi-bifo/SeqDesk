name: Publish reviewer Docker image

on:
  workflow_run:
    workflows: [Build Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing successful release tag containing the Docker files (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seqdesk-docker-publication
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'hzi-bifo/SeqDesk' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require the published release and successful native release gates
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if [ -n "$REQUESTED_TAG" ]; then test "$REQUESTED_TAG" = "$TAG"; fi
          SHA=$(git rev-parse HEAD)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          node -e 'const r=require(process.argv[1]); if(r.draft || r.prerelease) process.exit(1)' "$RUNNER_TEMP/release.json"
          SUCCESS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$SHA&status=success" \
            --jq 'any(.workflow_runs[]; .conclusion == "success")')
          test "$SUCCESS" = true
          test -f Dockerfile
          test -f compose.yaml
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v4
      - name: Build the architecture candidate once
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: seqdesk-reviewed:${{ matrix.arch }}
          provenance: false
          build-args: |
            SEQDESK_IMAGE_VERSION=${{ needs.release.outputs.version }}
            SEQDESK_IMAGE_REVISION=${{ needs.release.outputs.sha }}
          cache-from: type=gha,scope=seqdesk-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=seqdesk-${{ matrix.arch }}
      - name: Verify credentials, real login, and persistence using the candidate image
        env:
          SEQDESK_DOCKER_TEST_IMAGE: seqdesk-reviewed:${{ matrix.arch }}
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --entrypoint node "$SEQDESK_DOCKER_TEST_IMAGE" -e '
            const assert = require("node:assert/strict");
            assert.equal(require("./package.json").version, process.argv[1]);
            assert.equal(process.arch, process.argv[2] === "amd64" ? "x64" : "arm64");
          ' "$EXPECTED_VERSION" "$EXPECTED_ARCH"
          node --test docker/setup.test.mjs
          bash scripts/ci/test-docker-reviewer.sh
      - name: Save the tested image without rebuilding it
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker save "seqdesk-reviewed:$ARCH" | gzip > "$RUNNER_TEMP/seqdesk-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-tested-${{ matrix.arch }}
          path: ${{ runner.temp }}/seqdesk-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 3

  publish:
    needs: [release, build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/hzi-bifo/seqdesk
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: docker-tested-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the exact tested images and multi-platform version
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            gunzip -c "$RUNNER_TEMP/images/seqdesk-$ARCH.tar.gz" | docker load
            docker tag "seqdesk-reviewed:$ARCH" "$IMAGE:$VERSION-$ARCH"
            docker push "$IMAGE:$VERSION-$ARCH"
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          # Re-running an older release must not move latest backwards.
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$LATEST" = "$RELEASE_TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Attach the version-pinned Compose download to the existing release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('compose.yaml').read_text()
          text = text.replace('${SEQDESK_DOCKER_IMAGE:-ghcr.io/hzi-bifo/seqdesk:latest}',
                              os.environ['IMAGE'] + ':' + os.environ['VERSION'])
          Path(os.environ['RUNNER_TEMP'], 'compose.yaml').write_text(text)
          PY
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/compose.yaml" --clobber
          echo "Published $IMAGE:$VERSION for AMD64 and ARM64." >> "$GITHUB_STEP_SUMMARY"
          echo "First publication: set package visibility to Public in GitHub Packages before advertising anonymous downloads." >> "$GITHUB_STEP_SUMMARY"
