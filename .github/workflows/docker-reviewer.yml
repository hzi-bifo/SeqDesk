name: Docker reviewer installation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify credential setup
        run: node --test docker/setup.test.mjs
      - name: Build, migrate, authenticate, and check persistence
        run: bash scripts/ci/test-docker-reviewer.sh
