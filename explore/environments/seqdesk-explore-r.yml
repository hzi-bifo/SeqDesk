# Conda environment for R Explore kits.
# Referenced from kit.json as  "environment": "seqdesk-explore-r"  (the file name
# without .yml). Like the Python environment it is created once per content
# hash of this file and reused until the file changes.
#
# R kits read the same run-folder contract as Python kits (inputs.json, one TSV
# plus schema per input, outputs/manifest.json); jsonlite and readr cover that.
name: seqdesk-explore-r
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # R 4.5: the Bioconductor 3.22 builds below exist for linux-64 and osx-arm64
  # only at 4.5 (checked with `conda env create --dry-run` on both, Sep 2026).
  # The 4.3 base with MaAsLin 2 1.18 did not solve on osx-arm64 (r-pscl and
  # edgeR 4.0 have no osx-arm64 builds).
  - r-base=4.5.*
  - r-tidyverse
  - r-vegan
  - r-ggplot2
  - r-plotly
  - r-jsonlite
  - r-pheatmap
  # Common RNA-seq and microbiome analysis, so most steps need no extra packages.
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-fgsea
  - bioconductor-apeglm
  - bioconductor-phyloseq
  # MaAsLin 3 replaces MaAsLin 2 (whose last build is R 4.3 only). A step that
  # needs MaAsLin 2 can add it as a step package on an R 4.3 environment.
  - bioconductor-maaslin3
