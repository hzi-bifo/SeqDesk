# Pytest configuration for the Explore helper library and the kit self-tests.
# importlib mode lets every kit keep its own test-data/test_kit.py without
# package __init__ files; pythonpath makes the helper importable in-process.
[pytest]
addopts = --import-mode=importlib
pythonpath = lib/python
testpaths = lib/python/tests kits
python_files = test_*.py
